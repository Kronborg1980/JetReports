<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Norröna · Financial Cockpit</title>
<style>
:root{
  --bg:#07131C; --bg2:#0B1C28;
  --panel:rgba(19,42,58,.62); --panel2:rgba(27,56,75,.55); --panelSolid:#122A3A;
  --line:rgba(120,180,210,.16); --line2:rgba(120,180,210,.30);
  --ink:#E8F3F8; --ink2:#B4CEDC; --muted:#7C9CAE;
  --good:#4FD1A5; --bad:#FF7A75; --warn:#FFB547; --info:#6EA8FE;
  --brand:#39B6E8; --brand2:#1B6FA8;
  --shadow:0 18px 46px rgba(0,0,0,.42);
  --r:16px; --r2:11px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#EEF3F6; --bg2:#E3ECF1;
  --panel:rgba(255,255,255,.78); --panel2:rgba(255,255,255,.62); --panelSolid:#FFFFFF;
  --line:rgba(20,60,85,.14); --line2:rgba(20,60,85,.26);
  --ink:#0A1D28; --ink2:#2C4A5C; --muted:#5E7C8D;
  --good:#0E9E76; --bad:#D24A45; --warn:#B5760A; --info:#2F6FD0;
  --brand:#1B6FA8; --brand2:#12557F;
  --shadow:0 12px 32px rgba(20,60,85,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--ui); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; min-height:100vh; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-20% -10% auto -10%; height:70vh; z-index:-2; pointer-events:none;
  background:
    radial-gradient(60% 70% at 12% 0%, rgba(57,182,232,.22), transparent 62%),
    radial-gradient(55% 65% at 88% 6%, rgba(79,209,165,.16), transparent 60%),
    radial-gradient(45% 60% at 50% 30%, rgba(255,181,71,.10), transparent 65%);
  filter:blur(10px);
}
body::after{
  content:""; position:fixed; inset:0; z-index:-3; background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 55%,var(--bg) 100%);
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.eyebrow{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700}
button,input,select{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
a{color:var(--brand)}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:var(--line2); border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ============ chrome ============ */
.top{
  position:sticky; top:0; z-index:60; backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  background:linear-gradient(180deg,rgba(7,19,28,.92),rgba(7,19,28,.66));
  border-bottom:1px solid var(--line);
}
html[data-theme="light"] .top{background:linear-gradient(180deg,rgba(238,243,246,.94),rgba(238,243,246,.7))}
.topin{max-width:1560px; margin:0 auto; padding:9px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:-.02em; font-size:15px; white-space:nowrap}
.logo .mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 4px 14px rgba(57,182,232,.35)}
.logo .mk svg{width:15px;height:15px}
.logo small{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:1px}
.spacer{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:99px;
  border:1px solid var(--line); background:var(--panel2); font-size:12px; font-weight:600; color:var(--ink2);
  transition:.16s; white-space:nowrap;
}
.chip:hover{border-color:var(--line2); color:var(--ink)}
.chip.on{background:linear-gradient(145deg,var(--brand),var(--brand2)); color:#fff; border-color:transparent}
.chip svg{width:14px;height:14px}
.seg{display:inline-flex; background:var(--panel2); border:1px solid var(--line); border-radius:99px; padding:3px; gap:2px}
.seg button{padding:5px 11px; border-radius:99px; font-size:12px; font-weight:600; color:var(--muted); transition:.15s}
.seg button.on{background:var(--panelSolid); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.2)}

/* nav */
.nav{max-width:1560px; margin:0 auto; padding:0 16px 9px; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  padding:7px 13px; border-radius:10px; font-size:13px; font-weight:600; color:var(--muted);
  white-space:nowrap; display:flex; align-items:center; gap:7px; transition:.15s; position:relative;
}
.nav button:hover{color:var(--ink); background:var(--panel2)}
.nav button.on{color:var(--ink); background:var(--panel)}
.nav button.on::after{content:""; position:absolute; left:13px; right:13px; bottom:1px; height:2px; border-radius:2px; background:var(--brand)}
.nav .b{background:var(--bad); color:#fff; font-size:10px; padding:1px 6px; border-radius:99px; font-weight:800}

/* filter bar */
.fbar{
  max-width:1560px; margin:0 auto; padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1560px; margin:0 auto; padding:18px 16px 90px}

/* ============ panels ============ */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
  backdrop-filter:blur(14px) saturate(130%); -webkit-backdrop-filter:blur(14px) saturate(130%);
  box-shadow:var(--shadow); padding:16px; position:relative; overflow:hidden;
}
.card h3{margin:0 0 3px; font-size:14px; font-weight:700; letter-spacing:-.01em}
.card .sub{font-size:11.5px; color:var(--muted); margin-bottom:12px; line-height:1.45}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr} .span2{grid-column:span 1}}

/* KPI */
.kpi{padding:14px 15px}
.kpi .lbl{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px}
.kpi .v{font-size:27px; font-weight:800; line-height:1.05; letter-spacing:-.035em}
@media(max-width:720px){.kpi .v{font-size:23px}}
.kpi .u{font-size:12px; color:var(--muted); font-weight:600; margin-left:3px}
.kpi .cmp{margin-top:8px; display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; font-size:11.5px}
.kpi .plain{margin-top:9px; font-size:11.5px; color:var(--muted); line-height:1.45; border-top:1px dashed var(--line); padding-top:8px}
.pill{display:inline-flex; align-items:center; gap:4px; padding:2.5px 8px; border-radius:99px; font-size:11px; font-weight:800; font-family:var(--mono)}
.pill.g{background:rgba(79,209,165,.16); color:var(--good)}
.pill.b{background:rgba(255,122,117,.16); color:var(--bad)}
.pill.n{background:var(--panel2); color:var(--muted)}
.up{color:var(--good)} .dn{color:var(--bad)} .mut{color:var(--muted)}

/* tables */
.tw{overflow:auto; border-radius:var(--r2); border:1px solid var(--line); -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:12.5px}
th{
  text-align:right; padding:9px 10px; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:700; background:var(--panel2); position:sticky; top:0; z-index:2; white-space:nowrap;
  border-bottom:1px solid var(--line);
}
th:first-child,td:first-child{text-align:left}
th.s{cursor:pointer; user-select:none} th.s:hover{color:var(--ink)}
td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:hover td{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
tr.sec td{background:var(--panel2); font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink2); cursor:pointer}
tr.tot td{font-weight:800; border-top:1px solid var(--line2); background:rgba(57,182,232,.05)}
tr.grand td{font-weight:900; font-size:13.5px; background:rgba(57,182,232,.11); border-top:2px solid var(--brand)}
td.name{max-width:280px; overflow:hidden; text-overflow:ellipsis}
.acct{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-right:7px}
.clip{cursor:pointer}

/* dropzone */
.dz{
  border:2px dashed var(--line2); border-radius:22px; padding:44px 24px; text-align:center;
  background:var(--panel); transition:.2s; cursor:pointer;
}
.dz:hover,.dz.over{border-color:var(--brand); background:var(--panel2); transform:translateY(-2px)}
.dz .ic{width:60px;height:60px;margin:0 auto 16px; border-radius:18px; display:grid; place-items:center;
  background:linear-gradient(145deg,rgba(57,182,232,.2),rgba(27,111,168,.1)); border:1px solid var(--line2)}
.dz .ic svg{width:28px;height:28px;color:var(--brand)}
.dz h2{margin:0 0 7px; font-size:20px; letter-spacing:-.02em}
.dz p{margin:0; color:var(--muted); font-size:13.5px; line-height:1.6}

/* file chips */
.files{display:flex; gap:8px; flex-wrap:wrap}
.fchip{
  display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel2); font-size:12px;
}
.fchip .dot{width:9px;height:9px;border-radius:50%; flex:none}
.fchip b{font-weight:700} .fchip span{color:var(--muted); font-size:11px}
.fchip button{color:var(--muted); padding:2px; display:grid; place-items:center; border-radius:6px}
.fchip button:hover{color:var(--bad); background:rgba(255,122,117,.12)}

/* signature: deviation tape */
.tape{display:flex; align-items:center; gap:2px; height:30px}
.tape .m{flex:1; min-width:4px; height:100%; position:relative; border-radius:2px; overflow:hidden; background:var(--panel2)}
.tape .m i{position:absolute; left:0; right:0; border-radius:2px; display:block}
.tape .m.now{outline:1.5px solid var(--warn); outline-offset:1px}

/* misc */
.bar{height:7px; border-radius:99px; background:var(--panel2); overflow:hidden; position:relative}
.bar i{display:block; height:100%; border-radius:99px; transition:width .5s cubic-bezier(.4,0,.2,1)}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:9px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.alert{display:flex; gap:11px; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--panel2); align-items:flex-start; margin-bottom:8px}
.alert .sev{width:4px; border-radius:4px; align-self:stretch; flex:none}
.alert h4{margin:0 0 3px; font-size:13px; font-weight:700}
.alert p{margin:0; font-size:11.5px; color:var(--muted); line-height:1.5}
.alert .amt{font-family:var(--mono); font-weight:800; font-size:13px; white-space:nowrap}
.tag{display:inline-block; padding:1.5px 7px; border-radius:99px; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--line2); color:var(--muted); margin-right:5px}
.inp{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px 11px; font-size:12.5px; outline:none; min-width:0}
.inp:focus{border-color:var(--brand)}
select.inp{cursor:pointer}
.empty{text-align:center; padding:46px 18px; color:var(--muted)}
.empty svg{width:38px;height:38px;opacity:.4;margin-bottom:12px}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); z-index:200;
  background:var(--panelSolid); border:1px solid var(--line2); border-radius:12px; padding:11px 16px; font-size:13px;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.25s; max-width:90vw}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.hint{font-size:11px; color:var(--muted); line-height:1.5; background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--brand); border-radius:8px; padding:9px 11px; margin-top:10px}
.narr{font-size:13.5px; line-height:1.75; color:var(--ink2)}
.narr b{color:var(--ink)} .narr h4{color:var(--ink); font-size:13px; margin:18px 0 6px; letter-spacing:.04em; text-transform:uppercase}
.narr ul{margin:6px 0; padding-left:18px} .narr li{margin-bottom:4px}
svg .gl{stroke:var(--line); stroke-width:1}
svg text{fill:var(--muted); font-family:var(--mono); font-size:9.5px}
svg text.lg{fill:var(--ink); font-size:11px; font-family:var(--ui); font-weight:600}
.scroll{max-height:520px; overflow:auto}
details>summary{cursor:pointer; list-style:none; padding:9px 0; font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›"; font-size:17px; color:var(--muted); transition:.2s; display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}
/* help chips */
.q{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--line2); color:var(--muted); font-size:9.5px; font-weight:800;
  cursor:help; position:relative; vertical-align:1px; margin-left:5px; flex:none; letter-spacing:0}
.q:hover,.q:focus{background:var(--brand); color:#fff; border-color:transparent; outline:none}
.qp{position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%) translateY(5px);
  width:min(250px,72vw); background:var(--panelSolid); border:1px solid var(--line2); border-radius:11px;
  padding:10px 12px; font-size:11.5px; font-weight:500; line-height:1.55; color:var(--ink2);
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:.16s; z-index:90;
  text-align:left; letter-spacing:0; text-transform:none}
.qp::after{content:""; position:absolute; top:100%; left:50%; margin-left:-5px; border:5px solid transparent; border-top-color:var(--line2)}
.q:hover .qp,.q:focus .qp{opacity:1; transform:translateX(-50%) translateY(0)}

/* stacked metric rows — one bar per figure, never two colours on one line */
.mb{margin-bottom:15px}
.mb+.mb{padding-top:14px; border-top:1px solid var(--line)}
.mb .hd{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.mb .hd b{font-size:13px; letter-spacing:-.01em}
.mb .r{display:grid; grid-template-columns:82px 1fr 78px; gap:10px; align-items:center; margin-bottom:6px}
.mb .r .l{font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:700}
.mb .r .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:800; text-align:right}
.mb .r .bar{height:9px}
@media(max-width:520px){.mb .r{grid-template-columns:70px 1fr 68px; gap:7px} .mb .r .v{font-size:11.5px}}

/* headline verdict */
.verdict{padding:20px 22px; background:
  linear-gradient(135deg,rgba(57,182,232,.14),rgba(79,209,165,.07) 55%,transparent),var(--panel)}
.verdict .big{font-size:26px; font-weight:800; letter-spacing:-.035em; line-height:1.22; margin:6px 0 10px}
.verdict .facts{display:flex; gap:8px 20px; flex-wrap:wrap; font-size:12.5px; color:var(--ink2)}
.verdict .facts b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink)}
@media(max-width:720px){.verdict .big{font-size:20px} .verdict{padding:16px}}

.chartbox{overflow-x:auto; margin:0 -4px; padding:0 4px}

@media print{
  body::before,body::after{display:none} body{background:#fff; color:#000}
  .top,.fbar,.nav,.noprint{display:none!important}
  .card{break-inside:avoid; box-shadow:none; border:1px solid #ccc; background:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l2-7h14l2 7"/><path d="M12 11V4"/><path d="M8 6h8"/><path d="M2 21c1.5 0 2-1 3.5-1s2 1 3.5 1 2-1 3.5-1 2 1 3.5 1 2-1 3.5-1"/></svg></span>
      <span>Norröna Cockpit<small data-t="tagline">Månedstal · JetReports</small></span>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="perSeg"></div>
    <select class="inp" id="monthSel" style="display:none"></select>
    <div class="seg" id="unitSeg"></div>
    <button class="chip" id="langBtn">DA</button>
    <button class="chip" id="themeBtn" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button class="chip" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addFiles">Tilføj filer</span></button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<div class="fbar" id="fbar" style="display:none">
  <span class="eyebrow" data-t="depts">Afdelinger</span>
  <div id="deptChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div class="spacer"></div>
  <div class="files" id="fileChips"></div>
</div>

<main class="wrap" id="main"></main>

<input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" multiple style="display:none">
<input type="file" id="sessInput" accept=".json" style="display:none">
<div class="toast" id="toast"></div>
<script src="./xlsx.full.min.js" onerror="this.remove()"></script>
<script>
if(typeof XLSX==='undefined'){
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  document.head.appendChild(s);
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════════
   NORRÖNA FINANCIAL COCKPIT
   Reads JetReports "Mánaðartøl" workbooks (per department or combined)
   and turns them into a live management view. All parsing is local —
   nothing leaves the browser.
   ══════════════════════════════════════════════════════════════════ */

/* ---------- language ---------- */
const T={
 da:{
  tagline:"Månedstal · JetReports", addFiles:"Tilføj filer", depts:"Afdelinger",
  nav_over:"Overblik", nav_dept:"Afdelinger", nav_pl:"Resultat", nav_trend:"Udvikling",
  nav_acct:"Konti", nav_tx:"Posteringer", nav_pax:"Passagerer", nav_alert:"Opmærksomhed",
  nav_fc:"Prognose", nav_rec:"Afstemning", nav_rep:"Rapport",

  dropBtn:"Vælg filer", or:"eller", loadSess:"Åbn gemt session",
  income:"Omsætning", purchase:"Vareforbrug", galley:"Køkken (vareforbrug)", gp:"Dækningsbidrag",
  gppct:"DB %", consumer:"Driftsomkostninger", wages:"Løn", otherpers:"Øvrige personaleomk.",
  rbw:"Resultat før løn", result:"Resultat", pax:"Passagerer", revpax:"Omsætning pr. pax",
  costpax:"Omkostning pr. pax", gppax:"DB pr. pax", wagepct:"Løn i % af omsætning",
  budget:"Budget", actual:"Faktisk", dev:"Afvigelse", devpct:"Afv. %", ytd:"År til dato",
  month:"Måned", ofBudget:"af budget", vs:"mod", py:"Sidste år", full:"Fuldt år",
  best:"Største plusser", worst:"Største minusser", noData:"Ingen data",
  acct:"Konto", name:"Navn", dept:"Afdeling", amount:"Beløb", date:"Dato", doc:"Bilag",
  desc:"Tekst", search:"Søg…", all:"Alle", total:"I alt", shipTotal:"Skib i alt",
  share:"Andel", perPax:"Pr. pax", pctRev:"% af oms.",
  sev_high:"Høj", sev_med:"Middel", sev_low:"Lav",
  print:"Print / PDF", exportX:"Eksportér Excel", exportC:"Eksportér CSV", saveSess:"Gem session",
  copy:"Kopiér tekst", copied:"Kopieret", removed:"Fjernet", loaded:"indlæst",
  bridgeBtn:"Kabysbudget flyttet med", older:"ældre udtræk — gemt til side",
  bridgeTip:"Kabyssens madbudget står i F&B-rapporten, men udgiften bogføres i kabyssen. Slå fra for at se tallene præcis som JetReports viser dem.",

const MON_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];

function num(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v==='string'){
    const s=v.trim().replace(/\s|\u00a0/g,'');
    if(!s||!/[\d]/.test(s))return null;
    const f=parseFloat(s.replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));
    return isFinite(f)?f:null;
  }
  return null;
}
function grid(ws){
  if(!ws||!ws['!ref'])return [];
  const r=XLSX.utils.decode_range(ws['!ref']), out=[];
  for(let R=r.s.r;R<=r.e.r;R++){
    const row=[];
    for(let C=r.s.c;C<=r.e.c;C++){
      const c=ws[XLSX.utils.encode_cell({r:R,c:C})];
      row.push(c?(c.t==='d'?c.v:(c.v!==undefined?c.v:null)):null);
    }
    out.push(row);
  }
  return out;
}

function parseWB(wb,fileName){
  const G=n=>grid(wb.Sheets[n]);
  const gi=G('input'), gm=G('main');
  if(!gi.length||!gm.length) throw new Error('notJet');
  const C=(g,r,c)=>{const row=g[r-1]; return row?(row[c-1]===undefined?null:row[c-1]):null;};

  // metadata from input sheet (label in col C, value in col D)
  const meta={};
  gi.forEach(r=>{ if(r[2]!=null&&r[3]!=null&&meta[String(r[2]).trim()]===undefined) meta[String(r[2]).trim()]=r[3]; });
  const dep=String(meta['Department']||'');
  const codes=dep.split('|').filter(x=>x&&!/^\d+$/.test(x));
  const nums =dep.split('|').filter(x=>/^\d+$/.test(x));
  const combined=codes.length>1;
  const key=combined?'ALL':(codes[0]||'?');
  const year=+(meta['Year']||meta['YEAR:']||0)||new Date().getFullYear();
  const rMonth=+(meta['Month']||meta['Til MONTH:']||0)||12;

  // header row: the row where column I starts with "Budget"
  let rHdr=0;
  for(let r=1;r<=30;r++){const v=C(gm,r,9); if(typeof v==='string'&&/^budget/i.test(v.trim())){rHdr=r;break;}}
  if(!rHdr) throw new Error('notJet');
  const rTitle=rHdr-2;

  // column groups of three (budget / actual / deviation)
  const cols=[]; const W=Math.max(...gm.map(r=>r.length));
  for(let c=9;c<=W-2;){
    if(C(gm,rHdr,c)&&C(gm,rHdr,c+1)&&C(gm,rHdr,c+2)){
      const ttl=String(C(gm,rTitle,c)||'');
      let kind='other',m=null;
      MON_EN.forEach((mn,i)=>{ if(ttl.indexOf(mn)===0){kind='month';m=i;} });
      if(/year to date/i.test(ttl)) kind=/2025|prior|vs\./i.test(ttl)&&/vs\./i.test(ttl)?'prior':'ytd';
      cols.push({c,ttl,kind,m,vis:C(gm,2,c)});
      c+=3;
    } else c++;
  }
  const iM=[]; cols.forEach((g,i)=>{if(g.kind==='month')iM[g.m]=i;});
  const iY=cols.findIndex(g=>g.kind==='ytd');
  const iP=cols.findIndex(g=>g.kind==='prior');
  const active=[]; cols.forEach(g=>{ if(g.kind==='month'&&(g.vis==='Vis'||g.m<rMonth)) active.push(g.m); });
  const lastM=active.length?Math.max(...active):rMonth-1;

  const vals=r=>cols.map(g=>[num(C(gm,r,g.c)),num(C(gm,r,g.c+1)),num(C(gm,r,g.c+2))]);
  const pack=v=>({m:iM.map(i=>i==null?[null,null]:[v[i][0],v[i][1]]),
                  ytd:iY>=0?{b:v[iY][0],a:v[iY][1]}:null,
                  py :iP>=0?{p:v[iP][0],c:v[iP][1]}:null});

  const TOT={'income total':'income','galley expenses total':'galley','purchase total':'purchase',
    'gross-profit':'gp','gross-profit %':'gppct','consumer goods total':'consumer',
    'result before wages':'rbw','total':'result'};
  const sections=[]; let cur=null, kpi={}, pax=null, spp=null, persN=0;

  for(let r=rHdr;r<=gm.length;r++){
    const b=C(gm,r,2), c3=C(gm,r,3), g7=C(gm,r,7), h=C(gm,r,8);
    const hs=h==null?'':String(h).trim();
    if(hs==='Pax:'){ pax=pack(vals(r)); continue; }
    if(hs==='Sales pr. Pax:'){ spp=pack(vals(r)); continue; }
    if(typeof c3==='string'&&c3.trim()==='rubriknr.'){
      cur={name:hs,hidden:b==='Skjul',lines:[],total:null,memo:/gross profit only|for gp/i.test(hs)};
      sections.push(cur); continue;
    }
    if(g7!=null&&hs&&/^\d/.test(String(g7).trim())&&cur){
      cur.lines.push({acct:String(g7).trim(),name:hs,...pack(vals(r))}); continue;
    }
    if(hs){
      const k=hs.toLowerCase();
      if(k==='personnel expenses total'||k==='personnel expenses'){
        persN++; const kk=persN===1?'wages':'otherpers';
        kpi[kk]=pack(vals(r)); if(cur){cur.total={label:hs,...pack(vals(r))}; cur.kpiKey=kk;} continue;
      }
      if(TOT[k]){ kpi[TOT[k]]=pack(vals(r));
        if(cur&&/total$/.test(k)){cur.total={label:hs,...pack(vals(r))}; cur.kpiKey=TOT[k];} continue; }
    }
  }

  // GL entries — sheets named "1".."12" (one per month)
  const tx=[];
  wb.SheetNames.forEach(sn=>{
    if(!/^\d{1,2}$/.test(sn))return;
    const mi=+sn-1; if(mi<0||mi>11)return;
    const g=G(sn);
    for(let i=14;i<g.length;i++){
      const row=g[i]; if(!row)continue;
      const d=row[7], amt=num(row[16]);
      if(amt==null)continue;
      let dt=null;
      if(d instanceof Date)dt=d;
      else if(typeof d==='number'&&d>20000&&d<80000){const o=XLSX.SSF.parse_date_code(d); if(o)dt=new Date(o.y,o.m-1,o.d);}
      if(!dt)continue;
      const af=String(row[13]||''); const p=af.split(' - ');
      tx.push({m:mi,d:dt.toISOString().slice(0,10),
        dt:String(row[8]||'').trim(), doc:String(row[9]||'').trim(), ext:String(row[12]||'').trim(),
        acct:(p[0]||'').trim(), an:(p.length>1?p.slice(1).join(' - '):'').trim(),
        desc:String(row[14]||'').trim(), dep:String(row[15]||'').trim()||key, amt:-amt});
    }
  });

  const rd=meta['Report date']||C(gm,12,8);
  let repDate=null;
  if(rd instanceof Date)repDate=rd;
  else if(typeof rd==='number'){const o=XLSX.SSF.parse_date_code(rd); if(o)repDate=new Date(o.y,o.m-1,o.d,o.H||0,o.M||0);}

  return {
    id:key+'|'+year+'|'+Math.random().toString(36).slice(2,7),
    fileName, key, combined, codes, nums, year, rMonth, lastM, active,
    title: combined?null:String(meta['Title:']||'').trim(),
    location:String(meta['Location']||'').trim(),
    ledger:String(meta['Ledger']||'').trim(),
    budgetName:String(meta['Budget:']||'').trim(),
    currency:String(C(gm,14,8)||'DKK').trim(),
    reportDate: repDate?repDate.toISOString():null,
    cols:cols.map(c=>({ttl:c.ttl,kind:c.kind,m:c.m})),
    sections, kpi, pax, spp, tx
  };
}

const KPIS=['income','galley','purchase','consumer','wages','otherpers'];

function periodMonths(){
  const lm=maxMonth();
  if(S.period.mode==='month') return [clamp(S.period.m,0,11)];
  return Array.from({length:lm+1},(_,i)=>i);
}
function periodLabel(){
  const ms=periodMonths();
  if(ms.length===1) return t('months')[ms[0]]+' '+(S.files[0]?S.files[0].year:'');
  return t('ytd')+' · '+t('mshort')[ms[0]]+'–'+t('mshort')[ms[ms.length-1]]+' '+(S.files[0]?S.files[0].year:'');
}
function isFullYTD(){ const ms=periodMonths(); return ms.length>1 && ms[0]===0 && ms[ms.length-1]===maxMonth(); }

function pick(pack,ms,i){ if(!pack)return null; let s=0,any=false;
  ms.forEach(m=>{const v=pack.m[m]; if(v&&v[i]!=null){s+=v[i]; any=true;}}); return any?s:null; }

function aggFile(f,ms){
  const o={};
  KPIS.concat(['rbw','result']).forEach(k=>{ o[k]={b:pick(f.kpi[k],ms,0)||0, a:pick(f.kpi[k],ms,1)||0}; });
  o.gp={b:o.income.b+o.galley.b+o.purchase.b, a:o.income.a+o.galley.a+o.purchase.a};
  o.pax={b:pick(f.pax,ms,0)||0, a:pick(f.pax,ms,1)||0};
  return o;
}
function aggPY(f){ // prior-year YTD (only meaningful for full YTD)
  const o={};
  KPIS.concat(['rbw','result']).forEach(k=>{ const p=f.kpi[k]&&f.kpi[k].py; o[k]={p:p?p.p:null,c:p?p.c:null}; });
  o.gp={p:(o.income.p||0)+(o.galley.p||0)+(o.purchase.p||0), c:(o.income.c||0)+(o.galley.c||0)+(o.purchase.c||0)};
  o.pax=f.pax&&f.pax.py?{p:f.pax.py.p,c:f.pax.py.c}:{p:null,c:null};
  return o;
}
function combineAgg(list,ms){
  const o={}; KPIS.concat(['rbw','result','gp','pax']).forEach(k=>o[k]={b:0,a:0});
  list.forEach(f=>{ const a=aggFile(f,ms);
    Object.keys(o).forEach(k=>{ o[k].b+=a[k].b; o[k].a+=a[k].a; }); });
  return o;
}

function shipTotal(ms){

  if(all) return {a:aggFile(all,ms), src:'file', f:all};
  const list=S.files.filter(f=>!f.combined);
  if(!list.length) return null;
  const o=combineAgg(list,ms);
  const memo=list.reduce((s,f)=>{const a=aggFile(f,ms); return {b:s.b+a.galley.b,a:s.a+a.galley.a};},{b:0,a:0});
  const gal=list.find(f=>f.key==='GAL');
  if(gal){ o.result.b-=memo.b; o.result.a-=memo.a; o.rbw.b-=memo.b; o.rbw.a-=memo.a; }
  return {a:o, src:'calc', memo, list};
}
function activeFiles(){ return S.files.filter(f=>!f.combined && (!S.sel.size||S.sel.has(f.key))); }
function deptFiles(){ return S.files.filter(f=>!f.combined); }


/* ══════════════ budget bridge ══════════════
   The galley's food cost is booked in the galley department, but its budget sits
   in the F&B report, where it is used to work out gross profit. Left alone the
   galley looks millions over budget and F&B looks flattered. This moves the
   budget across to the department that actually carries the cost. */
function unbridge(){
  S.files.forEach(f=>{ if(f._bridged){ bridgeAdj(f,f._bridged,-1); f._bridged=null; } });
}
function bridgeAdj(f,list,sign){
  list.forEach(({sec,line,b})=>{
    if(sign<0) delete line.bridged;
    b.forEach((v,m)=>{
      if(!v)return;
      if(!line.m[m])line.m[m]=[0,0];
      line.m[m][0]=(line.m[m][0]||0)+sign*v;
      if(sec.total){ if(!sec.total.m[m])sec.total.m[m]=[0,0]; sec.total.m[m][0]=(sec.total.m[m][0]||0)+sign*v; }
      if(sec.kpiKey&&f.kpi[sec.kpiKey]){ const k=f.kpi[sec.kpiKey]; if(!k.m[m])k.m[m]=[0,0]; k.m[m][0]=(k.m[m][0]||0)+sign*v; }
      ['result'].concat(['income','galley','purchase','consumer'].includes(sec.kpiKey)?['rbw']:[]).forEach(kk=>{
        const k=f.kpi[kk]; if(k){ if(!k.m[m])k.m[m]=[0,0]; k.m[m][0]=(k.m[m][0]||0)+sign*v; }});
    });
  });
}
function applyBridge(){
  unbridge();
  if(!S.bridge)return;
  const memo={};
  S.files.forEach(f=>{ if(f.combined)return;
    f.sections.filter(s=>s.memo).forEach(s=>s.lines.forEach(l=>{
      const b=l.m.map(v=>v?(v[0]||0):0);
      if(b.some(x=>x)) memo[l.acct]={b,from:f.key,name:l.name};
    }));});
  S.files.forEach(f=>{ if(f.combined)return;
    const list=[];
    f.sections.filter(s=>!s.memo).forEach(s=>s.lines.forEach(l=>{
      const m=memo[l.acct]; if(!m||m.from===f.key)return;
      if(l.m.some(v=>v&&v[0]))return;          // it already has its own budget
      if(!l.m.some(v=>v&&v[1]))return;         // nothing booked here either
      l.bridged=m.from; list.push({sec:s,line:l,b:m.b,from:m.from});
    }));
    if(list.length){ bridgeAdj(f,list,1); f._bridged=list; }
  });
}
function bridgeInfo(){
  const out=[];
  S.files.forEach(f=>{ (f._bridged||[]).forEach(x=>out.push({to:f.key,from:x.from,acct:x.line.acct,name:x.line.name,b:sum(x.b)})); });
  return out;
}

/* every account line across the selected departments, aggregated over the period */
function accountRows(ms,files){
  const out=[];
  (files||activeFiles()).forEach(f=>{
    f.sections.forEach(sec=>{
      sec.lines.forEach(l=>{
        const b=pick(l,ms,0)||0, a=pick(l,ms,1)||0;
        const py=l.py?l.py.p:null;
        if(b===0&&a===0&&!py)return;
        out.push({dept:f.key,file:f,sec:sec.name,memo:sec.memo,acct:l.acct,name:l.name,b,a,dev:a-b,
                  devp:b!==0?((a-b)/Math.abs(b))*100:null, py, line:l});
      });
    });
  });
  return out;
}

const NS='http://www.w3.org/2000/svg';

function svR(w,h,body){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block" preserveAspectRatio="xMidYMid meet">${body}</svg>`; }

/* signature device: a deviation tape — one small bar per month above/below a
   centre line. Green above = better than budget. Used on cards, rows, anywhere. */
function tape(months,vals,now){
  const mx=Math.max(1,...vals.map(v=>Math.abs(v||0)));
  let h='';
  months.forEach((m,i)=>{
    const v=vals[i]||0, r=Math.abs(v)/mx*46, up=v>=0;
    h+=`<div class="m${m===now?' now':''}" title="${esc(t('mshort')[m])}: ${sgn(v)}${fmtFull(v)}">
      <i style="${up?'bottom:50%':'top:50%'};height:${r}%;background:${up?'var(--good)':'var(--bad)'};opacity:${.45+.55*(Math.abs(v)/mx)}"></i>
      <i style="top:50%;height:1px;background:var(--line2);opacity:.8"></i></div>`;
  });
  return `<div class="tape">${h}</div>`;
}

let _gid=0;
function niceTicks(lo,hi,n){
  const rg=(hi-lo)||1, raw=rg/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+step*0.01; v+=step) out.push(+v.toFixed(6));
  if(lo<=0&&hi>=0&&!out.some(v=>Math.abs(v)<step*1e-6)) out.push(0);
  return out.sort((a,b)=>a-b);
}

  const bw=(w-padL-padR)/months.length;

  });
  return sv(w,h,g,'min-width:'+w+'px');

function lineChart(months,series,h=214){

function donut(pctv,label,color,size=124){
  const r=size/2-11, c=2*Math.PI*r, p=clamp(pctv,0,150)/100;

   <text x="${size/2}" y="${size/2+15}" text-anchor="middle" style="font-size:9px">${esc(label)}</text>`);

function waterfall(steps,h=210){
  const w=Math.max(340,steps.length*84), pad=30;
  let run=0; const pts=steps.map(s=>{const from=run; if(!s.total)run+=s.v; const to=s.total?s.v:run; return {...s,from:s.total?0:from,to};});
  const mx=Math.max(...pts.map(p=>Math.max(p.from,p.to)),0), mn=Math.min(...pts.map(p=>Math.min(p.from,p.to)),0);
  const rg=(mx-mn)||1, Y=v=>h-34-((v-mn)/rg)*(h-52), bw=(w-pad*2)/steps.length;
  let g='';
  pts.forEach((p,i)=>{
    const x=pad+i*bw+bw*0.16, ww=bw*0.68;
    const y1=Y(p.from), y2=Y(p.to), y=Math.min(y1,y2), hh=Math.max(2,Math.abs(y2-y1));
    const c=p.total?'var(--brand)':(p.v>=0?'var(--good)':'var(--bad)');
    g+=`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="3" fill="${c}" opacity="${p.total?1:.85}"><title>${esc(p.n)}: ${fmtFull(p.v)}</title></rect>`;
    if(i<pts.length-1&&!pts[i+1].total) g+=`<line x1="${x+ww}" y1="${Y(p.to)}" x2="${pad+(i+1)*bw+bw*0.16}" y2="${Y(p.to)}" stroke="var(--line2)" stroke-dasharray="3 3"/>`;
    g+=`<text x="${x+ww/2}" y="${h-18}" text-anchor="middle" style="font-size:8.5px">${esc(p.n.length>13?p.n.slice(0,12)+'…':p.n)}</text>`;
    g+=`<text x="${x+ww/2}" y="${h-6}" text-anchor="middle" style="fill:${p.total?'var(--ink)':'var(--muted)'};font-weight:700">${fmt(p.v)}</text>`;
  });
  g+=`<line class="gl" x1="0" y1="${Y(0)}" x2="${w}" y2="${Y(0)}"/>`;
  return sv(w,h,g,'min-width:'+w+'px');
}

/* ══════════════ what needs attention ══════════════ */
let _alCache=null,_alKey='';
function buildAlerts(){
  const key=S.files.map(f=>f.id).join()+'|'+S.period.mode+S.period.m+'|'+LANG+'|'+S.bridge;
  if(_alKey===key&&_alCache)return _alCache;
  const R=_buildAlerts(); _alKey=key; _alCache=R; return R;
}
function _buildAlerts(){
  const ms=periodMonths(), lm=maxMonth(), A=[];
  const add=(sev,cat,title,body,amt,dept,acct)=>A.push({sev,cat,title,body,amt:amt||0,dept,acct});
  const L=LANG;
  const rows=accountRows(ms,deptFiles());

  bridgeInfo().forEach(x=>add('low','bridge',
    L==='da'?`Budget flyttet: ${x.name}`:`Budget moved: ${x.name}`,
    L==='da'?`Budgettet på ${fmtFull(Math.abs(x.b))} står i ${dName(x.from)}, men udgiften bogføres i ${dName(x.to)}. Det er lagt over på ${dName(x.to)}, så afvigelsen bliver retvisende.`
            :`The ${fmtFull(Math.abs(x.b))} budget sits in ${dName(x.from)} while the cost is booked in ${dName(x.to)}. It has been moved onto ${dName(x.to)} so the deviation reads true.`,
    0,x.to,x.acct));

  rows.forEach(r=>{
    if(r.memo)return;
    const rev=r.b>0||r.a>0;
    const dev=r.dev, mag=Math.abs(dev);
    if(rev){
      if(dev<0&&mag>40000&&r.b!==0&&Math.abs(dev/r.b)>0.05)
        add(mag>400000?'high':'med','rev',
          L==='da'?`Manglende omsætning: ${r.name}`:`Revenue shortfall: ${r.name}`,
          L==='da'?`${dName(r.dept)} · omsætning ${fmtFull(r.a)} mod budget ${fmtFull(r.b)} (${pct(r.devp)}).`
                  :`${dName(r.dept)} · revenue ${fmtFull(r.a)} against budget ${fmtFull(r.b)} (${pct(r.devp)}).`,
          dev,r.dept,r.acct);
    }else{
      if(dev<0&&mag>25000&&(r.b===0||Math.abs(dev/r.b)>0.10))
        add(mag>300000?'high':(mag>90000?'med':'low'),'cost',
          L==='da'?`Merforbrug: ${r.name}`:`Overspend: ${r.name}`,
          r.b===0
            ? (L==='da'?`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} brugt uden budget på konto ${r.acct}.`
                       :`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} spent with no budget on account ${r.acct}.`)
            : (L==='da'?`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} mod budget ${fmtFull(Math.abs(r.b))} — ${fmtFull(mag)} over (${pct(r.devp)}).`
                       :`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} against budget ${fmtFull(Math.abs(r.b))} — ${fmtFull(mag)} over (${pct(r.devp)}).`),
          dev,r.dept,r.acct);
      if(r.b!==0&&Math.abs(r.a)<Math.abs(r.b)*0.15&&Math.abs(r.b)>60000)
        add('low','unused',
          L==='da'?`Ubrugt budget: ${r.name}`:`Unused budget: ${r.name}`,
          L==='da'?`${dName(r.dept)} · kun ${fmtFull(Math.abs(r.a))} brugt af ${fmtFull(Math.abs(r.b))}. Budgettet ligger måske forkert.`
                  :`${dName(r.dept)} · only ${fmtFull(Math.abs(r.a))} used of ${fmtFull(Math.abs(r.b))}. The budget may sit in the wrong place.`,
          dev,r.dept,r.acct);
    }
    // three months running the wrong way
    if(ms.length>=3){
      const last3=ms.slice(-3).map(m=>{const v=r.line.m[m]; return v?(v[1]||0)-(v[0]||0):0;});
      if(last3.every(d=>d<0)&&Math.abs(sum(last3))>60000)
        add('med','trend',
          L==='da'?`Tre måneder i træk over budget: ${r.name}`:`Three months running over budget: ${r.name}`,
          L==='da'?`${dName(r.dept)} · ${ms.slice(-3).map(m=>t('mshort')[m]).join(', ')} ligger alle værre end budget, i alt ${fmtFull(sum(last3))}.`
                  :`${dName(r.dept)} · ${ms.slice(-3).map(m=>t('mshort')[m]).join(', ')} are all worse than budget, ${fmtFull(sum(last3))} in total.`,
          sum(last3),r.dept,r.acct);
    }
    // a single month far outside its own pattern
    const series=ms.map(m=>{const v=r.line.m[m]; return v?(v[1]||0):0;}).filter(v=>v!==0);
    if(series.length>=4){
      const mu=sum(series)/series.length, sd=Math.sqrt(sum(series.map(v=>(v-mu)**2))/series.length);
      ms.forEach(m=>{ const v=r.line.m[m]?(r.line.m[m][1]||0):0;
        if(sd>0&&Math.abs(v-mu)>3*sd&&Math.abs(v-mu)>80000)
          add('med','spike',
            L==='da'?`Enkeltmåned skiller sig ud: ${r.name}`:`One month stands out: ${r.name}`,
            L==='da'?`${dName(r.dept)} · ${t('months')[m]} ligger på ${fmtFull(v)} mod et snit på ${fmtFull(mu)}.`
                    :`${dName(r.dept)} · ${t('months')[m]} is ${fmtFull(v)} against an average of ${fmtFull(mu)}.`,
            v-mu,r.dept,r.acct); });
    }
    // last year
    if(isFullYTD()&&r.line.py){
      const p=r.line.py.p, c=r.line.py.c;
      if(p!=null&&c!=null&&p!==0&&Math.abs(c-p)>150000&&Math.abs((c-p)/p)>0.12){
        const worse=(r.b>0||r.a>0)?(c<p):(c<p);
        add(Math.abs(c-p)>600000?'med':'low','py',
          L==='da'?`${worse?'Ned':'Op'} mod sidste år: ${r.name}`:`${worse?'Down':'Up'} on last year: ${r.name}`,
          L==='da'?`${dName(r.dept)} · ${fmtFull(c)} i år mod ${fmtFull(p)} sidste år (${pct((c-p)/Math.abs(p)*100)}).`
                  :`${dName(r.dept)} · ${fmtFull(c)} this year against ${fmtFull(p)} last year (${pct((c-p)/Math.abs(p)*100)}).`,
          c-p,r.dept,r.acct);
      }
      if((p==null||p===0)&&c&&Math.abs(c)>200000)
        add('low','py',
          L==='da'?`Ingen sammenligning sidste år: ${r.name}`:`No last-year comparison: ${r.name}`,
          L==='da'?`${dName(r.dept)} · konto ${r.acct} har ${fmtFull(c)} i år og intet sidste år. Tallene er ikke direkte sammenlignelige.`
                  :`${dName(r.dept)} · account ${r.acct} shows ${fmtFull(c)} this year and nothing last year. The figures are not directly comparable.`,
          0,r.dept,r.acct);
    }
  });

  // department level
  deptFiles().forEach(f=>{
    const a=aggFile(f,ms);
    if(a.income.a>0){
      const gpA=a.gp.a/a.income.a*100, gpB=a.income.b?a.gp.b/a.income.b*100:null;
      if(gpB!=null&&gpA<gpB-3)
        add(gpA<gpB-8?'high':'med','gp',
          L==='da'?`Dækningsbidrag under budget · ${dName(f.key)}`:`Gross profit below budget · ${dName(f.key)}`,
          L==='da'?`DB ligger på ${gpA.toFixed(1)}% mod budgetteret ${gpB.toFixed(1)}%. Hvert procentpoint svarer til ${fmtFull(a.income.a/100)}.`
                  :`GP is ${gpA.toFixed(1)}% against a budgeted ${gpB.toFixed(1)}%. Each point is worth ${fmtFull(a.income.a/100)}.`,
          (gpA-gpB)/100*a.income.a,f.key);
      const wA=Math.abs(a.wages.a+a.otherpers.a)/a.income.a*100, wB=a.income.b?Math.abs(a.wages.b+a.otherpers.b)/a.income.b*100:null;
      if(wB!=null&&wA>wB+3)
        add('med','wage',
          L==='da'?`Løn fylder mere end budgetteret · ${dName(f.key)}`:`Wages heavier than budgeted · ${dName(f.key)}`,
          L==='da'?`Løn udgør ${wA.toFixed(1)}% af omsætningen mod budgetteret ${wB.toFixed(1)}%.`
                  :`Wages are ${wA.toFixed(1)}% of revenue against a budgeted ${wB.toFixed(1)}%.`,
          -(wA-wB)/100*a.income.a,f.key);
    }
    const res=a.result.a-a.result.b;
    if(Math.abs(res)>250000)
      add(Math.abs(res)>1e6?'high':'med','result',
        L==='da'?`${dName(f.key)} — bundlinje ${res>0?'bedre':'dårligere'} end budget`
                :`${dName(f.key)} — bottom line ${res>0?'better':'worse'} than budget`,
        L==='da'?`Resultat ${fmtFull(a.result.a)} mod budget ${fmtFull(a.result.b)}.${a.income.a>0?` Omsætning ${fmtFull(a.income.a)} mod budget ${fmtFull(a.income.b)}, samlede omkostninger ${fmtFull(a.galley.a+a.purchase.a+a.consumer.a+a.wages.a+a.otherpers.a)}.`:''}`
                :`Result ${fmtFull(a.result.a)} against budget ${fmtFull(a.result.b)}.${a.income.a>0?` Revenue ${fmtFull(a.income.a)} against budget ${fmtFull(a.income.b)}, total costs ${fmtFull(a.galley.a+a.purchase.a+a.consumer.a+a.wages.a+a.otherpers.a)}.`:''}`,
        res,f.key);
  });

  // pax vs revenue
  const sh=shipTotal(ms);
  if(sh&&sh.a.pax.a>0&&sh.a.pax.b>0&&sh.a.income.b>0){
    const rpA=sh.a.income.a/sh.a.pax.a, rpB=sh.a.income.b/sh.a.pax.b;
    if(rpA<rpB*0.95)
      add('med','pax',
        L==='da'?'Omsætning pr. passager under budget':'Revenue per passenger below budget',
        L==='da'?`${fmtN(rpA,0)} kr. pr. pax mod budgetteret ${fmtN(rpB,0)} kr. Med ${fmtN(sh.a.pax.a)} passagerer svarer forskellen til ${fmtFull((rpA-rpB)*sh.a.pax.a)}.`
                :`${fmtN(rpA,0)} per pax against a budgeted ${fmtN(rpB,0)}. Across ${fmtN(sh.a.pax.a)} passengers that is ${fmtFull((rpA-rpB)*sh.a.pax.a)}.`,
        (rpA-rpB)*sh.a.pax.a);
  }

  // duplicate-looking entries
  const seen={}, dups=[];
  S.files.filter(f=>f.combined||S.files.every(x=>!x.combined)).forEach(f=>{
    f.tx.forEach(x=>{
      if(Math.abs(x.amt)<3000)return;
      const k=x.acct+'|'+Math.round(x.amt)+'|'+x.desc.toLowerCase().slice(0,26);
      if(seen[k]){ if(seen[k].doc!==x.doc) dups.push([seen[k],x]); } else seen[k]=x;
    });
  });
  dups.slice(0,14).forEach(([a,b])=>
    add('low','dup',
      L==='da'?`Ens beløb to gange: ${a.an||a.acct}`:`Same amount twice: ${a.an||a.acct}`,
      L==='da'?`${fmtFull(Math.abs(a.amt))} bogført ${a.d} (${a.doc}) og igen ${b.d} (${b.doc}) med samme tekst.`
              :`${fmtFull(Math.abs(a.amt))} posted ${a.d} (${a.doc}) and again ${b.d} (${b.doc}) with the same text.`,
      0,a.dep,a.acct));

  const ord={high:0,med:1,low:2};
  A.sort((x,y)=>ord[x.sev]-ord[y.sev]||Math.abs(y.amt)-Math.abs(x.amt));
  return A;
}

const CAT={
 rev :{da:'Omsætning',en:'Revenue'},        cost:{da:'Forbrug',en:'Spend'},
 result:{da:'Bundlinje',en:'Bottom line'},  unused:{da:'Ubrugt budget',en:'Unused budget'},
 trend:{da:'Skred over flere måneder',en:'Drift over several months'},
 spike:{da:'Enkelt måned',en:'Single month'}, py:{da:'Mod sidste år',en:'Against last year'},
 gp  :{da:'Dækningsbidrag',en:'Gross profit'}, wage:{da:'Løn',en:'Wages'},
 pax :{da:'Pr. passager',en:'Per passenger'},  dup:{da:'Muligt dobbelt',en:'Possible duplicate'},
 bridge:{da:'Budget flyttet',en:'Budget moved'},
};
function meaning(cat,amt){
  const d=LANG==='da', up=amt>0;
  switch(cat){
    case 'rev':    return d?(up?'Mere omsætning end budgetteret':'Mindre omsætning end budgetteret')
                           :(up?'More revenue than budgeted':'Less revenue than budgeted');
    case 'cost': case 'unused':
                   return d?(up?'Mindre brugt end budgetteret':'Mere brugt end budgetteret')
                           :(up?'Less spent than budgeted':'More spent than budgeted');
    case 'result': return d?(up?'Mere tilbage på bundlinjen end budgetteret':'Mindre tilbage på bundlinjen end budgetteret')
                           :(up?'More left on the bottom line than budgeted':'Less left on the bottom line than budgeted');
    case 'gp':     return d?'Lavere dækningsgrad end budgetteret':'Lower gross margin than budgeted';
    case 'wage':   return d?'Løn fylder mere af omsætningen end budgetteret':'Wages take more of revenue than budgeted';
    case 'pax':    return d?'Hver passager lægger mindre end budgetteret':'Each passenger spends less than budgeted';
    case 'trend':  return d?'Samme retning tre måneder i træk':'Same direction three months running';
    case 'spike':  return d?'Én måned falder helt uden for mønsteret':'One month falls right outside the pattern';
    case 'py':     return d?(up?'Højere end samme periode sidste år':'Lavere end samme periode sidste år')
                           :(up?'Higher than the same period last year':'Lower than the same period last year');
    default: return '';
  }
}

function kpiCard(o){
  const {label,val,bud,unitTxt,plain,inv,pctv,dec,noBud}=o;
  const dev=(val!=null&&bud!=null)?val-bud:null;
  const good=dev==null?null:(inv?dev<=0:dev>=0);
  const p=(bud!=null&&bud!==0)?Math.abs(val/bud)*100:null;
  return `<div class="card kpi">
   <div class="lbl"><span class="eyebrow">${esc(label)}${o.q?q(o.q):''}</span>${o.badge||''}</div>
   <div class="v num">${dec!=null?fmtN(val,dec):fmt(val)}<span class="u">${esc(unitTxt||'')}</span></div>
   ${noBud?'':`<div class="cmp">
     ${dev!=null?`<span class="pill ${good?'g':'b'}">${sgn(dev)}${dec!=null?fmtN(dev,dec):fmt(dev)}</span>`:''}
     <span class="mut">${t('budget')} <b class="num">${bud!=null?(dec!=null?fmtN(bud,dec):fmt(bud)):'–'}</b></span>
     ${p!=null?`<span class="mut">· ${Math.round(p)}% ${t('ofBudget')}</span>`:''}
   </div>`}
   ${pctv!=null?`<div class="bar" style="margin-top:9px"><i style="width:${clamp(pctv,0,100)}%;background:${good===false?'var(--bad)':'var(--good)'}"></i></div>`:''}
   ${plain?`<div class="plain">${plain}</div>`:''}
  </div>`;
}

  // monthly ship series
  const allM=Array.from({length:lm+1},(_,i)=>i);

    if(src){const v=src.kpi[k]&&src.kpi[k].m[m]; return v?[v[0]||0,v[1]||0]:[0,0];}

      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
        <span style="width:9px;height:9px;border-radius:3px;background:${dCol(f.key)}"></span>
        <b style="font-size:12.5px">${esc(dName(f.key))}</b>

        <span class="pill ${d>=0?'g':'b'}">${sgn(d)}${fmt(d)}</span>
      </div>
      ${g.income.a>0?row(t('income'),g.income.a,g.income.b):''}

      : `The commercial departments are <span class="${better?'up':'dn'}">${fmtFull(Math.abs(d))} ${better?'ahead of':'behind'}</span> budget`;
    const f=[[t('income'),fmt(a.income.a),a.income.b?pct((a.income.a-a.income.b)/Math.abs(a.income.b)*100,1):null],
             [t('gppct'),gpP!=null?gpP.toFixed(1)+'%':'–',gpB!=null?pct(gpP-gpB,1)+'p':null],
             [t('result'),fmt(a.result.a),a.result.b?pct(d/Math.abs(a.result.b)*100,1):null],
             [t('pax'),fmtN(a.pax.a,0),a.pax.b?pct((a.pax.a-a.pax.b)/a.pax.b*100,1):null],
             [t('revpax'),rp!=null?fmtN(rp,0)+' kr.':'–',rpB?pct((rp-rpB)/rpB*100,1):null]];
    return `<div class="card verdict" style="margin-bottom:12px">

    ${kpiCard({label:t('gp'),q:'gp',val:a.gp.a,bud:a.gp.b,

      plain:L==='da'?`Omsætning minus vareforbrug. Budget ${gpB!=null?gpB.toFixed(1)+'%':'–'}.`:`Revenue less cost of goods. Budget ${gpB!=null?gpB.toFixed(1)+'%':'–'}.`})}
    ${kpiCard({label:t('result'),q:'result',val:a.result.a,bud:a.result.b,
      plain:L==='da'?'Bundlinjen for de kommercielle afdelinger, efter løn.':'Bottom line for the commercial departments, after wages.'})}
    ${kpiCard({label:t('revpax'),q:'revpax',val:rp,bud:rpB,dec:0,unitTxt:'kr.',
      plain:L==='da'?`${fmtN(a.pax.a)} passagerer i perioden (budget ${fmtN(a.pax.b)}).`:`${fmtN(a.pax.a)} passengers in the period (budget ${fmtN(a.pax.b)}).`})}
  </div>

  <div class="grid g2" style="margin-bottom:12px">
    <div class="card">
      <h3>${L==='da'?'Fra omsætning til bundlinje':'From revenue to bottom line'}${q('waterfall')}</h3>
      <div class="sub">${L==='da'?'Hver søjle viser hvad der lægges til eller trækkes fra undervejs.':'Each bar shows what is added or taken out along the way.'}</div>
      <div class="chartbox">${waterfall(wf)}</div>
    </div>
    <div class="card">
      <h3>${L==='da'?'Resultat pr. måned':'Result by month'}</h3>
      <div class="sub">${L==='da'?'Lys søjle = budget, blå = faktisk. Tallet over søjlen er det faktiske.':'Pale bar = budget, blue = actual. The figure above each bar is the actual.'}</div>
      <div class="chartbox">${barsBA(allM,resM.map(v=>v[0]),resM.map(v=>v[1]))}</div>
      <div class="legend"><span><i style="background:var(--line2)"></i>${t('budget')}</span><span><i style="background:var(--brand)"></i>${t('actual')}</span></div>
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:12px">${deptCards}</div>

  <div class="grid g4" style="margin-bottom:12px">
    <div class="card">
      <h3>${L==='da'?'Hvor langt er vi':'How far along are we'}${q('attain')}</h3>
      <div class="sub">${L==='da'?'Faktisk i procent af budget for perioden. 100% = præcis på budget.':'Actual as a percentage of budget for the period. 100% = exactly on budget.'}</div>
      <div style="display:flex;gap:6px;justify-content:space-around;align-items:flex-start">
        ${[[t('income'),a.income.b?a.income.a/a.income.b*100:null,'var(--brand)'],
           [t('gp'),a.gp.b?a.gp.a/a.gp.b*100:null,'var(--good)'],
           [t('result'),a.result.b?a.result.a/a.result.b*100:null,'var(--warn)']]
          .map(([l,v,c])=>`<div style="flex:1;min-width:0">${donut(v,l,c,104)}</div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3 class="up">${t('best')}</h3>
      <div class="sub">${L==='da'?'Konti der ligger bedst i forhold til budget.':'Accounts sitting furthest ahead of budget.'}</div>
      ${wins.length?hbars(wins):'<div class="mut" style="font-size:12px">'+t('noData')+'</div>'}
    </div>
    <div class="card">
      <h3 class="dn">${t('worst')}</h3>
      <div class="sub">${L==='da'?'Konti der trækker mest ned.':'Accounts pulling hardest the other way.'}</div>
      ${miss.length?hbars(miss):'<div class="mut" style="font-size:12px">'+t('noData')+'</div>'}
    </div>
    <div class="card">
      <h3>${t('nav_alert')}${q('alerts')} ${hi?`<span class="pill b">${hi}</span>`:''}</h3>
      <div class="sub">${L==='da'?'De tre ting der først er værd at kigge på.':'The first three things worth a look.'}</div>
      ${alerts.slice(0,3).map(alertHTML).join('')||'<div class="mut" style="font-size:12px">'+(L==='da'?'Intet at bemærke.':'Nothing to flag.')+'</div>'}
      <button class="chip" style="margin-top:6px" onclick="go('alert')">${L==='da'?'Se alle '+alerts.length:'See all '+alerts.length} →</button>
    </div>
  </div>`;
}

function alertHTML(x){
  const c=x.amt>0?'var(--good)':x.amt<0?'var(--bad)':'var(--info)';
  const kind=CAT[x.cat]?CAT[x.cat][LANG]||CAT[x.cat].en:'';
  const mean=meaning(x.cat,x.amt);
  return `<div class="alert">
   <div class="sev" style="background:${c}"></div>
   <div style="flex:1;min-width:0">
     <div style="margin-bottom:4px">
       ${kind?`<span class="tag">${esc(kind)}</span>`:''}
       ${x.dept?`<span class="tag" style="color:${dCol(x.dept)};border-color:${dCol(x.dept)}55">${esc(dName(x.dept))}</span>`:''}
       ${x.sev==='high'?`<span class="tag" style="color:var(--warn);border-color:var(--warn)66">${esc(t('sev_high'))}</span>`:''}
     </div>
     <h4>${esc(x.title)}</h4>
     <p>${esc(x.body)}</p>
     ${mean?`<p style="margin-top:4px;color:${c};font-weight:600">${x.amt>0?'▲':'▼'} ${esc(mean)}</p>`:''}
   </div>
   ${x.amt?`<div class="amt ${x.amt>=0?'up':'dn'}">${sgn(x.amt)}${fmt(x.amt)}</div>`:''}
  </div>`;
}

function vDept(){
  const ms=periodMonths(), lm=maxMonth(), files=deptFiles(), L=LANG;
  if(!files.length) return '<div class="empty">'+t('noData')+'</div>';
  const allM=Array.from({length:lm+1},(_,i)=>i);
  const sh=shipTotal(ms);

    ${bridgeInfo().length?`<div class="hint">${L==='da'
      ?'<b>'+t('bridgeH')+'.</b> '+bridgeInfo().map(x=>`${esc(x.name)} (${fmtFull(Math.abs(x.b))}) er flyttet fra ${dName(x.from)} til ${dName(x.to)}, hvor udgiften faktisk bogføres. Uden det ville ${dName(bridgeInfo()[0].to)} se ud til at ligge millioner over budget. Slå det fra i toppen for at se rå JetReports-tal.`).join(' ')

    ${sh&&sh.src==='calc'?`<div class="hint">${L==='da'
      ?'Skib i alt er lagt sammen af afdelingsfilerne. Kabyssens vareforbrug er kun talt én gang — det står også under F&amp;B, hvor det bruges til at regne dækningsbidrag.'

/* ---------- P&L ---------- */
function vPL(){
  const ms=periodMonths(), files=activeFiles(), L=LANG;
  if(!files.length) return '<div class="empty">'+t('noData')+'</div>';
  const showPY=isFullYTD();
  const blocks=files.map(f=>{
    const a=aggFile(f,ms), inc=a.income.a||1;
    const secRow=(sec)=>{
      const lines=sec.lines.map(l=>{
        const b=pick(l,ms,0)||0, x=pick(l,ms,1)||0, d=x-b;
        if(b===0&&x===0)return '';
        const py=showPY&&l.py?l.py.p:null;
        return `<tr>
         <td class="name"><span class="acct">${esc(l.acct)}</span>${esc(l.name)}${l.bridged?`<span class="tag" style="margin-left:6px">${t('bridged')} ${esc(l.bridged)}</span>`:''}</td>
         <td class="num mut">${fmt(b)}</td><td class="num">${fmt(x)}</td>
         <td class="num ${d>=0?'up':'dn'}">${sgn(d)}${fmt(d)}</td>
         <td class="num mut">${b?pct(d/Math.abs(b)*100,0):'–'}</td>
         ${showPY?`<td class="num mut">${py!=null?fmt(py):'–'}</td>`:''}
         <td class="num mut">${(Math.abs(x)/inc*100).toFixed(1)}%</td>
         <td style="width:110px">${tape(ms,ms.map(m=>{const v=l.m[m];return v?(v[1]||0)-(v[0]||0):0;}),ms[ms.length-1])}</td>
        </tr>`;
      }).join('');
      if(!lines)return '';
      const tb=pick(sec.total,ms,0)||0, ta=pick(sec.total,ms,1)||0;
      return `<tr class="sec"><td colspan="${showPY?8:7}">${esc(sec.name)}${sec.memo?' · '+(L==='da'?'kun til DB-beregning':'for GP calculation only'):''}</td></tr>
        ${lines}
        <tr class="tot"><td>${esc(sec.total?sec.total.label:sec.name)}</td>
          <td class="num">${fmt(tb)}</td><td class="num">${fmt(ta)}</td>
          <td class="num ${ta-tb>=0?'up':'dn'}">${sgn(ta-tb)}${fmt(ta-tb)}</td>
          <td class="num mut">${tb?pct((ta-tb)/Math.abs(tb)*100,0):'–'}</td>
          ${showPY?`<td class="num mut">${sec.total&&sec.total.py?fmt(sec.total.py.p):'–'}</td>`:''}
          <td class="num mut">${(Math.abs(ta)/inc*100).toFixed(1)}%</td><td></td></tr>`;
    };
    const gpb=a.gp.b,gpa=a.gp.a;
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">
        <span style="width:10px;height:10px;border-radius:3px;background:${dCol(f.key)}"></span>
        <h3 style="margin:0">${esc(dName(f.key))}</h3>
        <span class="tag">${esc(f.key)}${f.nums.length?' · '+f.nums.join('/'):''}</span>
      </div>
      <div class="sub">${esc(periodLabel())} · ${esc(f.currency)} · ${esc(f.budgetName)}</div>
      <div class="tw"><table>
        <thead><tr><th>${t('acct')}</th><th>${t('budget')}</th><th>${t('actual')}</th><th>${t('dev')}</th><th>${t('devpct')}</th>
        ${showPY?`<th>${t('py')}</th>`:''}<th>${t('pctRev')}</th><th>${L==='da'?'Måned':'Month'}</th></tr></thead>
        <tbody>
          ${f.sections.map(secRow).join('')}
          <tr class="tot"><td>${t('gp')}</td><td class="num">${fmt(gpb)}</td><td class="num">${fmt(gpa)}</td>
            <td class="num ${gpa-gpb>=0?'up':'dn'}">${sgn(gpa-gpb)}${fmt(gpa-gpb)}</td>
            <td class="num mut">${a.income.a?(gpa/a.income.a*100).toFixed(1)+'%':'–'}</td>${showPY?'<td></td>':''}<td></td><td></td></tr>
          <tr class="grand"><td>${t('result')}</td><td class="num">${fmt(a.result.b)}</td><td class="num">${fmt(a.result.a)}</td>
            <td class="num ${a.result.a-a.result.b>=0?'up':'dn'}">${sgn(a.result.a-a.result.b)}${fmt(a.result.a-a.result.b)}</td>
            <td class="num mut">${a.result.b?pct((a.result.a-a.result.b)/Math.abs(a.result.b)*100,0):'–'}</td>
            ${showPY?`<td class="num mut">${f.kpi.result.py?fmt(f.kpi.result.py.p):'–'}</td>`:''}<td></td><td></td></tr>
        </tbody></table></div>
    </div>`;
  }).join('');
  return blocks;
}

/* ---------- trend ---------- */
function vTrend(){
  const lm=maxMonth(), allM=Array.from({length:lm+1},(_,i)=>i), files=activeFiles(), L=LANG;
  if(!files.length) return '<div class="empty">'+t('noData')+'</div>';
  const src=S.files.find(f=>f.combined);
  const use=(S.sel.size||!src)?files:[src];
  const ser=k=>allM.map(m=>{let b=0,a=0; use.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m]; if(v){b+=v[0]||0;a+=v[1]||0;}}); return [b,a];});
  const inc=ser('income'), res=ser('result');
  const paxS=allM.map(m=>{let b=0,a=0; (use[0]?[use[0]]:[]).forEach(f=>{const v=f.pax&&f.pax.m[m]; if(v){b+=v[0]||0;a+=v[1]||0;}}); return [b,a];});
  let cb=0,ca=0; const cum=allM.map((m,i)=>{cb+=res[i][0];ca+=res[i][1];return [cb,ca];});
  const heatRows=[];
  use.forEach(f=>f.sections.forEach(s=>s.lines.forEach(l=>{
    const v=allM.map(m=>{const x=l.m[m];return x?(x[1]||0)-(x[0]||0):0;});
    if(v.some(x=>Math.abs(x)>1)) heatRows.push({n:(use.length>1?f.key+' · ':'')+l.name,v,mag:Math.max(...v.map(Math.abs))});
  })));
  heatRows.sort((a,b)=>b.mag-a.mag);
  return `
  <div class="grid g2" style="margin-bottom:12px">
    <div class="card"><h3>${t('income')}${q('income')}</h3>
      <div class="sub">${L==='da'?'Måned for måned mod budget':'Month by month against budget'}</div>
      <div class="chartbox">${barsBA(allM,inc.map(v=>v[0]),inc.map(v=>v[1]))}</div>
      <div class="legend"><span><i style="background:var(--line2)"></i>${t('budget')}</span><span><i style="background:var(--brand)"></i>${t('actual')}</span></div>
    </div>
    <div class="card"><h3>${L==='da'?'Resultat, opsummeret hen over året':'Result, adding up across the year'}</h3>
      <div class="sub">${L==='da'?'Stiplet = budget. Afstanden mellem linjerne er det du har i overskud eller mangler.':'Dashed = budget. The gap between the lines is what you are up or down.'}</div>
      <div class="chartbox">${lineChart(allM,[
        {n:t('budget'),v:cum.map(v=>v[0]),c:'var(--muted)',dash:1},
        {n:t('actual'),v:cum.map(v=>v[1]),c:'var(--brand)',area:1}])}</div>
    </div>
  </div>
  <div class="grid g2" style="margin-bottom:12px">
    <div class="card"><h3>${t('result')}${q('result')}</h3>
      <div class="chartbox">${barsBA(allM,res.map(v=>v[0]),res.map(v=>v[1]))}</div></div>
    <div class="card"><h3>${t('pax')}${q('pax')}</h3>
      <div class="sub">${L==='da'?'Passagerer om bord pr. måned':'Passengers on board per month'}</div>
      <div class="chartbox">${barsBA(allM,paxS.map(v=>v[0]),paxS.map(v=>v[1]))}</div></div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <h3>${t('numbers')}${q('dev')}</h3>
    <div class="sub">${L==='da'?'Samme tal som graferne ovenfor, måned for måned. Klik på en kolonneoverskrift i Konti-fanen for at gå dybere.':'The same figures as the charts above, month by month. Go to the Accounts tab to dig further.'}</div>
    ${monthTable(allM,[
      {h:t('pax'),v:paxS.map(v=>v[1]),f:v=>fmtN(v,0)},
      {h:t('income')+' · '+t('budget'),v:inc.map(v=>v[0]),cls:()=>'mut'},
      {h:t('income')+' · '+t('actual'),v:inc.map(v=>v[1])},
      {h:t('income')+' · '+t('dev'),v:inc.map(v=>v[1]-v[0]),f:v=>sgn(v)+fmt(v),cls:v=>v>=0?'up':'dn'},
      {h:t('revpax'),v:allM.map((m,i)=>paxS[i][1]?inc[i][1]/paxS[i][1]:null),f:v=>v==null?'–':fmtN(v,0)},
      {h:t('result')+' · '+t('budget'),v:res.map(v=>v[0]),cls:()=>'mut'},
      {h:t('result')+' · '+t('actual'),v:res.map(v=>v[1])},
      {h:t('result')+' · '+t('dev'),v:res.map(v=>v[1]-v[0]),f:v=>sgn(v)+fmt(v),cls:v=>v>=0?'up':'dn'},
    ],{label:t('total'),v:[
      sum(paxS.map(v=>v[1])), sum(inc.map(v=>v[0])), sum(inc.map(v=>v[1])), sum(inc.map(v=>v[1]-v[0])),
      sum(paxS.map(v=>v[1]))?sum(inc.map(v=>v[1]))/sum(paxS.map(v=>v[1])):null,
      sum(res.map(v=>v[0])), sum(res.map(v=>v[1])), sum(res.map(v=>v[1]-v[0]))]})}
    <div style="margin-top:10px"><button class="chip" onclick="exportCSV(window.__trendRows,'udvikling')">${t('exportC')}</button></div>
  </div>

  <div class="card">
    <h3>${L==='da'?'Hvor afvigelserne ligger':'Where the deviations sit'}</h3>
    <div class="sub">${L==='da'?'Grøn = bedre end budget, rød = værre. Jo kraftigere farve, jo større beløb.':'Green = better than budget, red = worse. Stronger colour, bigger amount.'}</div>
    <div class="scroll" style="overflow-x:auto">${heat(heatRows.slice(0,34),allM)}</div>
  </div>`;
}

/* ---------- transactions ---------- */
function allTx(){
  const src=S.files.find(f=>f.combined);
  const list=src?src.tx:[].concat(...S.files.map(f=>f.tx));
  const ms=new Set(periodMonths());
  return list.filter(x=>ms.has(x.m)&&(!S.sel.size||S.sel.has(x.dep)));
}
function vTx(){
  const L=LANG; let tx=allTx();
  const q=S.txq.toLowerCase().trim();
  if(q) tx=tx.filter(x=>(x.desc+' '+x.an+' '+x.acct+' '+x.doc+' '+x.ext+' '+x.dep).toLowerCase().includes(q));
  const k=S.sortTx.k,d=S.sortTx.d;
  const sorted=[...tx].sort((a,b)=>{
    if(k==='amt')return d*(Math.abs(b.amt)-Math.abs(a.amt));
    if(k==='d')return d*String(b.d).localeCompare(String(a.d));
    return d*String(b[k]||'').localeCompare(String(a[k]||''));});
  const byDoc={}; tx.forEach(x=>{const kk=x.ext||x.doc||'—'; (byDoc[kk]=byDoc[kk]||{n:kk,v:0,c:0}); byDoc[kk].v+=x.amt; byDoc[kk].c++;});
  const topDocs=Object.values(byDoc).filter(x=>x.v<0).sort((a,b)=>a.v-b.v).slice(0,8).map(x=>({n:`${x.n} · ${x.c} ${L==='da'?'poster':'entries'}`,v:x.v}));
  const th=(key,lbl)=>`<th class="s" onclick="sortT('${key}')">${lbl}${S.sortTx.k===key?(S.sortTx.d>0?' ↓':' ↑'):''}</th>`;

/* ---------- forecast ---------- */
function vFC(){
  const lm=maxMonth(), L=LANG, allM=Array.from({length:lm+1},(_,i)=>i);
  const files=deptFiles(); const src=S.files.find(f=>f.combined);
  const use=src?[src]:files;
  const ser=k=>Array.from({length:12},(_,m)=>{let b=0,a=0;use.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m];if(v){b+=v[0]||0;a+=v[1]||0;}});return [b,a];});
  const res=ser('result'), inc=ser('income'), gpS=Array.from({length:12},(_,m)=>{
    let b=0,a=0; ['income','galley','purchase'].forEach(k=>use.forEach(f=>{
      const v=f.kpi[k]&&f.kpi[k].m[m]; if(v){b+=v[0]||0;a+=v[1]||0;}})); return [b,a];});
  const paxA=Array.from({length:12},(_,m)=>{const v=use[0].pax&&use[0].pax.m[m];return v?v[1]||0:0;});
  const ytdA=sum(res.slice(0,lm+1).map(v=>v[1])), ytdB=sum(res.slice(0,lm+1).map(v=>v[0]));
  const incA=sum(inc.slice(0,lm+1).map(v=>v[1])), incB=sum(inc.slice(0,lm+1).map(v=>v[0]));
  const gpA =sum(gpS.slice(0,lm+1).map(v=>v[1]));
  // seasonal weights from the passenger curve where we have it, otherwise flat
  const paxYear=[0.028,0.022,0.055,0.085,0.105,0.155,0.205,0.155,0.075,0.045,0.032,0.038];
  const doneW=sum(paxYear.slice(0,lm+1));
  const projSeason=doneW>0?ytdA/doneW:null;
  const projRun=ytdA/(lm+1)*12;
  const fut=Array.from({length:12},(_,m)=>m<=lm?res[m][1]:(projSeason!=null?projSeason*paxYear[m]:projRun/12));
  const projInc=doneW>0?incA/doneW:null, projGP=doneW>0?gpA/doneW:null;
  const futI=Array.from({length:12},(_,m)=>m<=lm?inc[m][1]:(projInc!=null?projInc*paxYear[m]:0));
  let ci=0; const cumFI=futI.map(v=>ci+=v);
  let cbi=0; const cumAI=Array.from({length:12},(_,m)=>m<=lm?(cbi+=inc[m][1]):null);
  let c=0; const cumF=fut.map(v=>c+=v);
  let cb=0; const cumA=Array.from({length:12},(_,m)=>m<=lm?(cb+=res[m][1]):null);
  return `
  <div class="grid g3" style="margin-bottom:12px">
    ${kpiCard({label:L==='da'?'År til dato, omsætning':'Revenue year to date',val:incA,bud:incB,
      plain:L==='da'?`De første ${lm+1} måneder. Dækningsbidrag ${incA?(gpA/incA*100).toFixed(1)+'%':'–'}.`:`The first ${lm+1} months. Gross profit ${incA?(gpA/incA*100).toFixed(1)+'%':'–'}.`})}
    ${kpiCard({label:L==='da'?'Fuldt år, omsætning':'Full year, revenue',q:'season',val:projInc,bud:null,noBud:true,
      plain:L==='da'?'Sæsonvægtet fremskrivning. Juli og august vejer tungest.':'Season-weighted projection. July and August carry most weight.'})}
    ${kpiCard({label:L==='da'?'Fuldt år, dækningsbidrag':'Full year, gross profit',q:'gp',val:projGP,bud:null,noBud:true,
      plain:L==='da'?'Samme fremskrivning på dækningsbidraget.':'The same projection applied to gross profit.'})}
  </div>
  <div class="grid g3" style="margin-bottom:12px">
    ${kpiCard({label:L==='da'?'År til dato, resultat':'Result year to date',val:ytdA,bud:ytdB,
      plain:L==='da'?`De første ${lm+1} måneder.`:`The first ${lm+1} months.`})}
    ${kpiCard({label:L==='da'?'Fuldt år, sæsonvægtet':'Full year, season-weighted',q:'season',val:projSeason,bud:null,noBud:true,
      plain:L==='da'?'År til dato skaleret op efter skibets normale passagerkurve — juli og august vejer tungt.':'Year to date scaled up on the ship\'s usual passenger curve — July and August carry most of the weight.'})}
    ${kpiCard({label:L==='da'?'Fuldt år, lige fordelt':'Full year, flat run-rate',q:'runrate',val:projRun,bud:null,noBud:true,
      plain:L==='da'?'Samme resultat hver måned resten af året. Konservativt for et sæsonskib.':'Same result every month for the rest of the year. Conservative for a seasonal ship.'})}
  </div>
  <div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Hvor omsætningen lander':'Where revenue lands'}</h3>
    <div class="sub">${L==='da'?'Opsummeret omsætning. Fast linje = bogført, stiplet = fremskrevet.':'Cumulative revenue. Solid = booked, dashed = projected.'}</div>
    <div class="chartbox">${lineChart(Array.from({length:12},(_,i)=>i),[
      {n:t('projected'),v:cumFI,c:'var(--warn)',dash:1},
      {n:t('actual'),v:cumAI,c:'var(--good)',area:1,w:2.6}],200)}</div>
    ${monthTable(Array.from({length:12},(_,i)=>i),[
      {h:t('income'),v:futI,cls:(v,i)=>i>lm?'mut':''},
      {h:L==='da'?'Opsummeret':'Cumulative',v:cumFI,cls:(v,i)=>i>lm?'mut':''},
      {h:t('result'),v:fut,cls:(v,i)=>i>lm?'mut':''},
      {h:L==='da'?'Bogført?':'Booked?',v:Array.from({length:12},(_,i)=>i),
       f:v=>v<=lm?'✓':(L==='da'?'fremskrevet':'projected'),cls:v=>v<=lm?'up':'mut'},
    ])}
  </div>
  <div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Hvor bundlinjen lander':'Where the bottom line lands'}</h3>
    <div class="sub">${L==='da'?'Fast linje = bogført. Stiplet = fremskrivning efter passagerkurven.':'Solid = booked. Dashed = projected on the passenger curve.'}</div>
    <div class="chartbox">${lineChart(Array.from({length:12},(_,i)=>i),[
      {n:L==='da'?'Fremskrevet':'Projected',v:cumF,c:'var(--warn)',dash:1},
      {n:t('actual'),v:cumA,c:'var(--brand)',area:1,w:2.6}],200)}</div>
    <div class="hint">${L==='da'
      ?'JetReports-udtrækket indeholder kun budget for de måneder der er lukket, så der er ikke noget helårsbudget at måle op imod her. Fremskrivningen bygger udelukkende på det der faktisk er bogført.'
      :'The JetReports extract only carries budget for the months that are closed, so there is no full-year budget to measure against here. The projection is built purely on what has actually been booked.'}</div>
  </div>
  <div class="card">
    <h3>${L==='da'?'Afdeling for afdeling':'Department by department'}</h3>
    <div class="sub">${L==='da'?'Omsætning og resultat år til dato, og hvad det bliver til på et helt år.':'Revenue and result year to date, and what that becomes across a full year.'}</div>
    <div class="tw"><table><thead><tr><th>${t('dept')}</th>
      <th>${t('income')} ${t('ytd')}</th><th>${t('gppct')}</th>
      <th>${t('result')} ${t('ytd')}</th><th>${t('budget')}</th><th>${t('dev')}</th>
      <th>${t('projected')} ${t('income')}</th><th>${t('projected')} ${t('result')}</th></tr></thead><tbody>
      ${files.map(f=>{const A=aggFile(f,allM);
        const pr=doneW>0?A.result.a/doneW:null, pi=doneW>0?A.income.a/doneW:null;
        return `<tr><td class="name"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${dCol(f.key)};margin-right:8px"></span>${esc(dName(f.key))}</td>
        <td class="num">${A.income.a?fmt(A.income.a):'–'}</td>
        <td class="num mut">${A.income.a?(A.gp.a/A.income.a*100).toFixed(1)+'%':'–'}</td>
        <td class="num">${fmt(A.result.a)}</td><td class="num mut">${fmt(A.result.b)}</td>
        <td class="num ${A.result.a-A.result.b>=0?'up':'dn'}">${sgn(A.result.a-A.result.b)}${fmt(A.result.a-A.result.b)}</td>
        <td class="num">${A.income.a?fmt(pi):'–'}</td>
        <td class="num"><b>${fmt(pr)}</b></td></tr>`;}).join('')}
      ${(()=>{const T=files.reduce((s,f)=>{const A=aggFile(f,allM);return {i:s.i+A.income.a,r:s.r+A.result.a,rb:s.rb+A.result.b};},{i:0,r:0,rb:0});
        return `<tr class="grand"><td>${t('total')}</td><td class="num">${fmt(T.i)}</td><td></td>
          <td class="num">${fmt(T.r)}</td><td class="num">${fmt(T.rb)}</td>
          <td class="num ${T.r-T.rb>=0?'up':'dn'}">${sgn(T.r-T.rb)}${fmt(T.r-T.rb)}</td>
          <td class="num">${fmt(doneW>0?T.i/doneW:null)}</td><td class="num"><b>${fmt(doneW>0?T.r/doneW:null)}</b></td></tr>`;})()}
    </tbody></table></div>
  </div>`;
}

/* ---------- reconcile ---------- */
function vRec(){
  const ms=periodMonths(), L=LANG;
  const all=S.files.find(f=>f.combined), deps=deptFiles();
  const versions=S.shadow;
  let body='';
  if(all&&deps.length){
    const A={}, B={};
    const grab=(f,tgt)=>f.sections.forEach(s=>s.lines.forEach(l=>{

function loadSession(txt){
  try{const o=JSON.parse(txt); if(!o.files)throw 0;
    S.files=o.files; S.shadow=o.shadow||[]; S.sel=new Set();
    S.files.forEach(f=>f._bridged=null); applyBridge();
    S.period={mode:'ytd',m:maxMonth()}; render(); toast(S.files.length+' '+t('loaded'));
  }catch(e){toast(t('nofile'));}
}

/* ---------- file intake ---------- */
async function handleFiles(list){
  for(let i=0;i<60&&typeof XLSX==='undefined';i++) await new Promise(r=>setTimeout(r,150));
  if(typeof XLSX==='undefined'){toast(LANG==='da'?'Kunne ikke indlæse Excel-læseren. Tjek netværket, eller læg xlsx.full.min.js ved siden af filen.':'Could not load the Excel reader. Check the network, or place xlsx.full.min.js next to this file.');return;}
  let n=0;
  for(const file of list){
    if(/\.json$/i.test(file.name)){ loadSession(await file.text()); continue; }
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
      const p=parseWB(wb,file.name);
      const ex=S.files.findIndex(f=>f.key===p.key&&f.year===p.year);
      if(ex>=0){
        const old=S.files[ex];
        const newer=(p.rMonth>old.rMonth)||(p.rMonth===old.rMonth&&String(p.reportDate||'')>=String(old.reportDate||''));
        if(newer){ S.shadow.push(old); S.files[ex]=p; toast(dName(p.key)+' — '+t('replaced')); }
        else { S.shadow.push(p); toast(dName(p.key)+' — '+t('older')); }
      } else S.files.push(p);
      n++;
    }catch(e){ console.error(e); toast(file.name+': '+(e.message==='notJet'?t('notJet'):t('nofile'))); }
  }
  if(n){
    const order=['ALL','TFS','FNB','GAL','ACC','REC'];
    S.files.sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
    applyBridge();
    S.period={mode:'ytd',m:maxMonth()};
    toast(n+' '+t('loaded'));
  }
  render();
}

  msel.style.display=(has&&S.period.mode==='month')?'':'none';
  if(has&&S.period.mode==='month'){
    msel.innerHTML=Array.from({length:lm+1},(_,i)=>`<option value="${i}" ${S.period.m===i?'selected':''}>${t('months')[i]}</option>`).join('');
  }
  $('#unitSeg').innerHTML=has?['auto','k','m'].map(u=>
    `<button class="${S.unit===u?'on':''}" onclick="S.unit='${u}';render()">${u==='auto'?'1.2k':(u==='k'?'k':'M')}</button>`).join(''):'';
  $('#unitSeg').style.display=has?'':'none';
  $('#langBtn').textContent=LANG.toUpperCase();
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>e.innerHTML=t(e.dataset.t));

  $('#fbar').style.display=has?'':'none';
  if(has){
    $('#deptChips').innerHTML=deptFiles().map(f=>
      `<button class="chip ${S.sel.has(f.key)?'on':''}" onclick="togDept('${f.key}')">
        <span style="width:8px;height:8px;border-radius:2px;background:${dCol(f.key)};display:inline-block"></span>${esc(dName(f.key))}</button>`).join('')
      +(S.sel.size?`<button class="chip" onclick="S.sel.clear();render()">${t('all')}</button>`:'')
      +(bridgeInfo().length||!S.bridge?`<button class="chip ${S.bridge?'on':''}" onclick="S.bridge=!S.bridge;applyBridge();render()" title="${esc(t('bridgeTip'))}">${t('bridgeBtn')}</button>`:'');
    $('#fileChips').innerHTML=S.files.map(f=>
      `<span class="fchip"><span class="dot" style="background:${dCol(f.key)}"></span>
        <b>${esc(dName(f.key))}</b><span>${esc(t('mshort')[f.lastM])} ${f.year}${f.combined?' · total':''}</span>
        <button onclick="rmFile('${f.id}')" title="${t('removed')}">✕</button></span>`).join('')
      +`<button class="chip" onclick="saveSession()">${t('saveSess')}</button>`;
  }
}
function setPer(m){ S.period.mode=m; if(m==='month'&&S.period.m>maxMonth())S.period.m=maxMonth(); render(); }
function togDept(k){ S.sel.has(k)?S.sel.delete(k):S.sel.add(k); render(); }
function rmFile(id){
  unbridge();
  S.files=S.files.filter(f=>f.id!==id);
  if(!S.files.length){S.view='over'; S.sel.clear();}
  applyBridge(); toast(t('removed')); render();
}

function dropzone(){
  const L=LANG;
  return `<div class="dz" id="dz" onclick="document.getElementById('fileInput').click()">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h4"/></svg></div>
    <h2>${t('dropTitle')}</h2>
    <p>${t('dropSub')}</p>
    <div style="margin-top:18px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      <button class="chip on">${t('dropBtn')}</button>
      <button class="chip" onclick="event.stopPropagation();document.getElementById('sessInput').click()">${t('loadSess')}</button>
    </div>
  </div>
  <div class="grid g3" style="margin-top:16px">
    ${[[L==='da'?'Et hurtigt overblik':'A quick read',L==='da'?'Omsætning, dækningsbidrag, resultat og passagerer for hele skibet — og for hver afdeling for sig.':'Revenue, gross profit, result and passengers for the whole ship — and for each department on its own.'],
       [L==='da'?'Helt ned i posteringerne':'All the way to the entries',L==='da'?'Rapporternes finanskladde læses med, så du kan søge på leverandør, bilag eller tekst uden at åbne Excel.':'The ledger detail inside the reports is read too, so you can search supplier, document or text without opening Excel.'],
       [L==='da'?'Det der stikker ud':'What stands out',L==='da'?'Hver konto gennemgås for merforbrug, manglende omsætning, skæve måneder og skred over flere måneder.':'Every account is checked for overspend, missing revenue, odd months and drift across several months.']]
      .map(([h,p])=>`<div class="card"><h3>${h}</h3><div class="sub" style="margin:0">${p}</div></div>`).join('')}
  </div>`;
}

function render(){
  renderChrome();
  const m=$('#main');
  if(!S.files.length){ m.innerHTML=dropzone(); wireDrop(); return; }
  const V={over:vOverview,dept:vDept,pl:vPL,trend:vTrend,acct:vAcct,tx:vTx,pax:vPax,alert:vAlert,fc:vFC,rec:vRec,rep:vRep};
  try{ m.innerHTML=(V[S.view]||vOverview)(); }
  catch(e){ console.error(e); m.innerHTML=`<div class="card"><div class="empty">${esc(e.message)}</div></div>`; }
  // export caches
  const ms=periodMonths();
  window.__acctRows=accountRows(ms,activeFiles()).map(r=>({konto:r.acct,navn:r.name,afdeling:r.dept,budget:r.b,faktisk:r.a,afvigelse:r.dev}));
  (function(){
    const lm=maxMonth(), aM=Array.from({length:lm+1},(_,i)=>i);
    const src=S.files.find(f=>f.combined), fl=activeFiles();
    const use=(S.sel.size||!src)?fl:[src];
    if(!use.length){window.__trendRows=[];return;}
    const ser=k=>aM.map(m=>{let b=0,a=0;use.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m];if(v){b+=v[0]||0;a+=v[1]||0;}});return [b,a];});
    const inc=ser('income'), res=ser('result');
    window.__trendRows=aM.map(m=>{
      const p=use[0].pax&&use[0].pax.m[m]?use[0].pax.m[m][1]||0:0;
      return {måned:t('months')[m],passagerer:p,
        omsætning_budget:Math.round(inc[m][0]),omsætning_faktisk:Math.round(inc[m][1]),
        omsætning_afvigelse:Math.round(inc[m][1]-inc[m][0]),
        oms_pr_pax:p?Math.round(inc[m][1]/p):0,
        resultat_budget:Math.round(res[m][0]),resultat_faktisk:Math.round(res[m][1]),
        resultat_afvigelse:Math.round(res[m][1]-res[m][0])};});
  })();
  window.__txRows=allTx().map(x=>({dato:x.d,bilag:x.doc,eksternt:x.ext,konto:x.acct,kontonavn:x.an,tekst:x.desc,afdeling:x.dep,beløb:x.amt}));
  const aq=$('#acctq'); if(aq){aq.oninput=e=>{S.acctq=e.target.value; const p=e.target.selectionStart; render(); const n=$('#acctq'); if(n){n.focus();n.setSelectionRange(p,p);} };}
  const tq=$('#txq'); if(tq){tq.oninput=e=>{S.txq=e.target.value; const p=e.target.selectionStart; render(); const n=$('#txq'); if(n){n.focus();n.setSelectionRange(p,p);} };}
}

function wireDrop(){
  const dz=$('#dz'); if(!dz)return;
  ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over');}));
}

/* ---------- boot ---------- */
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault(); if(e.dataTransfer&&e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});
$('#fileInput').addEventListener('change',e=>{handleFiles(e.target.files); e.target.value='';});
$('#sessInput').addEventListener('change',async e=>{ if(e.target.files[0])loadSession(await e.target.files[0].text()); e.target.value='';});
$('#addBtn').addEventListener('click',()=>$('#fileInput').click());
$('#monthSel').addEventListener('change',e=>{S.period.m=+e.target.value; render();});
$('#langBtn').addEventListener('click',()=>{LANG=LANG==='da'?'en':'da'; render();});
$('#themeBtn').addEventListener('click',()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
});
window.addEventListener('keydown',e=>{
  if(!S.files.length)return;
  if(e.key==='ArrowRight'&&S.period.mode==='month'&&S.period.m<maxMonth()){S.period.m++;render();}
  if(e.key==='ArrowLeft'&&S.period.mode==='month'&&S.period.m>0){S.period.m--;render();}
});
render();
</script>
</body>
</html>

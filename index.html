<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JetReport Overview · MS Norröna</title>
<style>
:root{
  --bg:#080F16; --bg2:#0C1922;
  --surface:rgba(255,255,255,.035); --surface2:rgba(255,255,255,.055); --solid:#111F2A;
  --hair:rgba(255,255,255,.075); --hair2:rgba(255,255,255,.14);
  --ink:#EDF4F7; --ink2:#A9C0CD; --muted:#6D8798;
  --good:#3FCF9A; --goodDim:rgba(63,207,154,.14);
  --bad:#F2726C;  --badDim:rgba(242,114,108,.14);
  --warn:#F0B34A; --info:#6BA5F0;
  --accent:#2CA6DC; --accent2:#17698F;
  --sh:0 1px 2px rgba(0,0,0,.24), 0 12px 34px -12px rgba(0,0,0,.5);
  --r:18px; --r2:12px; --r3:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#F2F5F7; --bg2:#E9EFF3;
  --surface:rgba(255,255,255,.86); --surface2:rgba(14,45,64,.045); --solid:#FFFFFF;
  --hair:rgba(14,45,64,.10); --hair2:rgba(14,45,64,.2);
  --ink:#0A1C26; --ink2:#33586C; --muted:#6A8496;
  --good:#0C9C72; --goodDim:rgba(12,156,114,.12);
  --bad:#CF4A44;  --badDim:rgba(207,74,68,.12);
  --warn:#A8720C; --info:#2E6BC7;
  --accent:#17698F; --accent2:#0E4E6C;
  --sh:0 1px 2px rgba(14,45,64,.06), 0 10px 28px -14px rgba(14,45,64,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.55 var(--ui); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-25% -15% auto -15%; height:80vh; z-index:-2; pointer-events:none;
  background:
    radial-gradient(48% 62% at 14% 0%, rgba(44,166,220,.20), transparent 68%),
    radial-gradient(42% 55% at 84% 4%, rgba(63,207,154,.11), transparent 66%);
  filter:blur(28px);
}
body::after{content:""; position:fixed; inset:0; z-index:-3; background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg))}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; border:none; background:none; padding:0}
a{color:var(--accent)}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--hair2); border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}

/* numbers: tight sans for display, mono only where columns must line up */
.num{font-variant-numeric:tabular-nums; letter-spacing:-.015em}
table .num,.acct,.amt,.mb .r .v{font-family:var(--mono); letter-spacing:-.03em}
.eyebrow{font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--muted); font-weight:700}

/* ═══ chrome ═══ */
.top{position:sticky; top:0; z-index:60;
  backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--hair)}
.topin{max-width:1400px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:700; letter-spacing:-.02em; white-space:nowrap}
.logo .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,var(--accent),var(--accent2));
  display:grid;place-items:center;box-shadow:0 4px 14px -4px rgba(44,166,220,.7)}
.logo .mk svg{width:16px;height:16px}
.logo small{display:block; font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:2px}
.spacer{flex:1}
.chip{display:inline-flex; align-items:center; gap:7px; padding:7px 13px; border-radius:10px;
  border:1px solid var(--hair); background:var(--surface); font-size:13px; font-weight:550; color:var(--ink2); transition:.15s; white-space:nowrap}
.chip:hover{border-color:var(--hair2); color:var(--ink)}
.chip.on{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}
.chip svg{width:15px;height:15px}
.chip .dot{width:7px;height:7px;border-radius:2px;flex:none}
.seg{display:inline-flex; background:var(--surface); border:1px solid var(--hair); border-radius:11px; padding:3px; gap:2px}
.seg button{padding:6px 13px; border-radius:8px; font-size:13px; font-weight:550; color:var(--muted); transition:.15s; white-space:nowrap}
.seg button:hover:not(.on){color:var(--ink)}
.seg button.on{background:var(--solid); color:var(--ink); font-weight:650; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg button[disabled]{opacity:.35; cursor:not-allowed}

.nav{max-width:1400px; margin:0 auto; padding:0 22px 10px; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; align-items:center}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px; border-radius:9px; font-size:14px; font-weight:550; color:var(--muted);
  white-space:nowrap; display:flex; align-items:center; gap:7px; transition:.15s}
.nav button:hover{color:var(--ink); background:var(--surface)}
.nav button.on{color:var(--ink); background:var(--surface2); font-weight:650}
.nav .b{background:var(--bad); color:#fff; font-size:10px; padding:1px 6px; border-radius:20px; font-weight:700}
.navsep{width:1px; height:18px; background:var(--hair); margin:0 10px; flex:none}

.fbar{max-width:1400px; margin:0 auto; padding:11px 22px; display:flex; gap:7px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--hair)}
.wrap{max-width:1400px; margin:0 auto; padding:24px 22px 110px}

/* file drawer */
.drawer{max-width:1400px; margin:0 auto; padding:0 22px; overflow:hidden; max-height:0; transition:max-height .3s ease}
.drawer.open{max-height:400px; padding-bottom:14px}
.files{display:flex; gap:7px; flex-wrap:wrap; padding-top:11px}
.fchip{display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:10px; border:1px solid var(--hair); background:var(--surface); font-size:12.5px}
.fchip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.fchip b{font-weight:600} .fchip span{color:var(--muted); font-size:11.5px}
.fchip button{color:var(--muted); width:18px;height:18px; display:grid; place-items:center; border-radius:5px; font-size:13px}
.fchip button:hover{color:var(--bad); background:var(--badDim)}

/* ═══ surfaces ═══ */
.card{background:var(--surface); border:1px solid var(--hair); border-radius:var(--r);
  box-shadow:var(--sh); padding:20px; position:relative; overflow:hidden}
html[data-theme="dark"] .card{backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.card h3{margin:0; font-size:15px; font-weight:650; letter-spacing:-.015em; display:flex; align-items:center; flex-wrap:wrap; gap:0}
.card .sub{font-size:12.5px; color:var(--muted); margin:5px 0 16px; line-height:1.5}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
@media(max-width:1120px){.g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr} .span2{grid-column:span 1} .wrap,.topin,.nav,.fbar,.drawer{padding-left:15px;padding-right:15px}}

.tabhead{margin:0 0 18px}
.tabhead h2{margin:0; font-size:23px; font-weight:700; letter-spacing:-.035em}
.tabhead p{margin:4px 0 0; font-size:13.5px; color:var(--muted); line-height:1.5; max-width:74ch}

/* ═══ KPI ═══ */
.kpi{padding:18px 19px}
.kpi .lbl{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; min-height:17px}
.kpi .v{font-size:30px; font-weight:700; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.kpi .u{font-size:14px; color:var(--muted); font-weight:550; margin-left:4px; letter-spacing:0}
.kpi .cmp{margin-top:11px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.kpi .cmp b{color:var(--ink2); font-weight:600; font-variant-numeric:tabular-nums}
.kpi .plain{margin-top:12px; padding-top:11px; border-top:1px solid var(--hair); font-size:12px; color:var(--muted); line-height:1.5}
.pill{display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.pill.g{background:var(--goodDim); color:var(--good)}
.pill.b{background:var(--badDim); color:var(--bad)}
.pill.n{background:var(--surface2); color:var(--muted)}
.up{color:var(--good)} .dn{color:var(--bad)} .mut{color:var(--muted)}

/* ═══ hero ═══ */
.verdict{padding:26px 28px 24px; border-radius:var(--r);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 62%),var(--surface);
  border:1px solid var(--hair); box-shadow:var(--sh)}
.verdict .big{font-size:31px; font-weight:700; letter-spacing:-.04em; line-height:1.2; margin:9px 0 0}
.verdict .big em{font-style:normal; font-variant-numeric:tabular-nums}
@media(max-width:700px){.verdict{padding:20px} .verdict .big{font-size:23px}}

/* ═══ tables ═══ */
.tw{overflow:auto; border-radius:var(--r2); border:1px solid var(--hair); -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:13px}
th{text-align:right; padding:10px 13px; font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:700; background:var(--surface2); position:sticky; top:0; z-index:2;
  white-space:nowrap; border-bottom:1px solid var(--hair)}
th:first-child,td:first-child{text-align:left}
th.s{cursor:pointer; user-select:none} th.s:hover{color:var(--ink)}
td{padding:10px 13px; text-align:right; border-bottom:1px solid var(--hair); white-space:nowrap}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:none}
tr.sec td{background:var(--surface2); font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2)}
tr.tot td{font-weight:700; border-top:1px solid var(--hair2)}
tr.grand td{font-weight:750; font-size:14px; background:color-mix(in srgb,var(--accent) 8%,transparent); border-top:1px solid var(--accent)}
td.name{max-width:330px; overflow:hidden; text-overflow:ellipsis}
.acct{font-size:11px; color:var(--muted); margin-right:8px}
.clip{cursor:pointer}

/* ═══ dropzone ═══ */
.dz{border:1.5px dashed var(--hair2); border-radius:24px; padding:56px 26px; text-align:center; background:var(--surface); transition:.22s; cursor:pointer}
.dz:hover,.dz.over{border-color:var(--accent); background:var(--surface2); transform:translateY(-2px)}
.dz .ic{width:62px;height:62px;margin:0 auto 18px; border-radius:19px; display:grid; place-items:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 26%,transparent),transparent); border:1px solid var(--hair2)}
.dz .ic svg{width:28px;height:28px;color:var(--accent)}
.dz h2{margin:0 0 8px; font-size:24px; font-weight:700; letter-spacing:-.03em}
.dz p{margin:0; color:var(--muted); font-size:14.5px; line-height:1.65}

/* ═══ deviation tape ═══ */
.tape{display:flex; align-items:center; gap:2.5px; height:34px}
.tape .m{flex:1; min-width:3px; height:100%; position:relative; border-radius:2px; background:var(--surface2)}
.tape .m i{position:absolute; left:0; right:0; border-radius:2px; display:block}
.tape .m.now{outline:1.5px solid var(--warn); outline-offset:1px; border-radius:3px}

/* ═══ bars ═══ */
.bar{height:9px; border-radius:20px; background:var(--surface2); overflow:hidden}
.bar i{display:block; height:100%; border-radius:20px; transition:width .55s cubic-bezier(.32,.72,0,1)}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:12px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

.mb{margin-bottom:18px}
.mb+.mb{padding-top:16px; border-top:1px solid var(--hair)}
.mb .hd{display:flex; align-items:center; gap:9px; margin-bottom:10px}
.mb .hd b{font-size:14px; font-weight:650; letter-spacing:-.015em}
.mb .r{display:grid; grid-template-columns:96px 1fr 86px; gap:12px; align-items:center; margin-bottom:7px}
.mb .r .l{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:650; display:flex; align-items:center}
.mb .r .v{font-size:13.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
@media(max-width:520px){.mb .r{grid-template-columns:78px 1fr 74px; gap:9px}}

/* ═══ alerts ═══ */
.alert{display:flex; gap:13px; padding:14px 15px; border-radius:var(--r2); border:1px solid var(--hair); background:var(--surface); align-items:flex-start; margin-bottom:8px}
.alert .sev{width:3px; border-radius:3px; align-self:stretch; flex:none}
.alert h4{margin:0 0 3px; font-size:14px; font-weight:650; letter-spacing:-.01em}
.alert p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.5}
.alert .amt{font-weight:700; font-size:14.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
.tag{display:inline-block; padding:2.5px 8px; border-radius:20px; font-size:10px; font-weight:650;
  letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--hair2); color:var(--muted); margin-right:5px}

/* ═══ misc ═══ */
.inp{background:var(--surface); border:1px solid var(--hair); border-radius:10px; padding:8px 13px; font-size:13.5px; outline:none; min-width:0}
.inp:focus{border-color:var(--accent)}
select.inp{cursor:pointer}
.empty{text-align:center; padding:58px 20px; color:var(--muted); font-size:14.5px}
.toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(18px); z-index:200;
  background:var(--solid); border:1px solid var(--hair2); border-radius:12px; padding:12px 18px; font-size:14px;
  box-shadow:var(--sh); opacity:0; pointer-events:none; transition:.24s; max-width:90vw}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.hint{font-size:12.5px; color:var(--muted); line-height:1.55; background:var(--surface2); border-radius:var(--r3);
  border-left:2px solid var(--accent); padding:10px 13px; margin-top:14px}
.narr{font-size:15px; line-height:1.8; color:var(--ink2)}
.narr b{color:var(--ink); font-weight:650}
.narr h4{color:var(--ink); font-size:11px; letter-spacing:.11em; text-transform:uppercase; margin:22px 0 7px}
.narr ul{margin:7px 0; padding-left:19px} .narr li{margin-bottom:5px}
.narr p{margin:0 0 12px}
svg text{fill:var(--muted); font-family:var(--ui); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums}
.scroll{max-height:600px; overflow:auto}
.chartbox{overflow-x:auto; margin:0 -3px; padding:0 3px}
details>summary{cursor:pointer; list-style:none; padding:9px 0; font-weight:650; font-size:13.5px; display:flex; align-items:center; gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›"; font-size:18px; color:var(--muted); transition:.2s; display:inline-block}
details[open]>summary::before{transform:rotate(90deg)}

/* ═══ help bubbles — drawn in a fixed layer, since cards clip overflow ═══ */
.q{display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%;
  border:1px solid var(--hair2); background:transparent; color:var(--muted); font-size:10px; font-weight:700;
  line-height:1; cursor:pointer; vertical-align:-2px; margin-left:6px; flex:none; letter-spacing:0;
  text-transform:none; transition:.14s}
.q:hover,.q:focus,.q.on{background:var(--accent); color:#fff; border-color:transparent; outline:none}
.qpop{position:fixed; z-index:300; background:var(--solid); border:1px solid var(--hair2); border-radius:13px;
  padding:14px 16px; font-size:13px; font-weight:400; line-height:1.6; color:var(--ink2); box-shadow:var(--sh);
  opacity:0; transform:translateY(5px); transition:.15s; pointer-events:none; text-align:left; letter-spacing:0; text-transform:none}
.qpop.on{opacity:1; transform:translateY(0)}

@media print{
  body::before,body::after{display:none} body{background:#fff; color:#000}
  .top,.fbar,.nav,.drawer,.noprint{display:none!important}
  .card,.verdict{break-inside:avoid; box-shadow:none; border:1px solid #ccc; background:#fff}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo">
      <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l2-7h14l2 7"/><path d="M12 11V4"/><path d="M8 6h8"/><path d="M2 21c1.5 0 2-1 3.5-1s2 1 3.5 1 2-1 3.5-1 2 1 3.5 1 2-1 3.5-1"/></svg></span>
      <span>JetReport Overview<small data-t="tagline">MS Norröna · Smyril Line</small></span>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="basisSeg"></div>
    <div class="seg" id="perSeg"></div>
    <select class="inp" id="monthSel" style="display:none"></select>
    <div class="seg" id="unitSeg"></div>
    <button class="chip" id="langBtn">DA</button>
    <button class="chip" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
    <button class="chip" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="addFiles">Tilføj filer</span></button>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<div class="fbar" id="fbar" style="display:none">
  <div id="deptChips" style="display:flex;gap:7px;flex-wrap:wrap;align-items:center"></div>
  <div class="spacer"></div>
  <button class="chip" id="filesBtn"></button>
</div>
<div class="drawer" id="drawer"><div class="files" id="fileChips"></div></div>

<main class="wrap" id="main"></main>

<input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls,.json" multiple style="display:none">
<input type="file" id="sessInput" accept=".json" style="display:none">
<div class="qpop" id="qpop" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════
   JETREPORT OVERVIEW · MS NORRÖNA
   Reads JetReports "Mánaðartøl" workbooks (per department or combined)
   and turns them into a live management view. All parsing is local —
   nothing leaves the browser.
   ══════════════════════════════════════════════════════════════════ */

/* ---------- language ---------- */
const T={
 da:{
  tagline:"MS Norröna · Smyril Line", addFiles:"Tilføj filer", depts:"Afdelinger",
  nav_over:"Overblik", nav_dept:"Afdelinger", nav_pl:"Resultat", nav_trend:"Udvikling",
  nav_acct:"Konti", nav_tx:"Posteringer", nav_pax:"Passagerer", nav_alert:"Opmærksomhed",
  nav_fc:"Prognose", nav_rec:"Afstemning", nav_rep:"Rapport", nav_chk:"Datakontrol",
  dropTitle:"Træk dine JetReports-filer herind",
  dropSub:"Slip en eller flere .xlsx-filer — én pr. afdeling, eller totalfilen for hele skibet.<br>Alt læses lokalt i browseren. Filerne forlader aldrig din computer.",
  dropBtn:"Vælg filer", or:"eller", loadSess:"Åbn gemt session",
  income:"Omsætning", purchase:"Vareforbrug", galley:"Køkken (vareforbrug)", gp:"Dækningsbidrag",
  gppct:"DB %", consumer:"Driftsomkostninger", wages:"Løn", otherpers:"Øvrige personaleomk.",
  rbw:"Resultat før løn", result:"Resultat", pax:"Passagerer", revpax:"Omsætning pr. pax",
  costpax:"Omkostning pr. pax", gppax:"DB pr. pax", wagepct:"Løn i % af omsætning",
  budget:"Budget", actual:"Faktisk", dev:"Afvigelse", devpct:"Afv. %", ytd:"År til dato",
  month:"Måned", ofBudget:"af budget", vs:"mod", py:"Sidste år", full:"Fuldt år",

const MON_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];

function num(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  if(typeof v==='string'){
    const s=v.trim().replace(/\s|\u00a0/g,'');
    if(!s||!/[\d]/.test(s))return null;
    const f=parseFloat(s.replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));
    return isFinite(f)?f:null;
  }
  return null;
}
function grid(ws){
  if(!ws||!ws['!ref'])return [];
  const r=XLSX.utils.decode_range(ws['!ref']), out=[];
  for(let R=r.s.r;R<=r.e.r;R++){
    const row=[];
    for(let C=r.s.c;C<=r.e.c;C++){
      const c=ws[XLSX.utils.encode_cell({r:R,c:C})];
      row.push(c?(c.t==='d'?c.v:(c.v!==undefined?c.v:null)):null);
    }
    out.push(row);
  }
  return out;
}

function parseWB(wb,fileName){

  gi.forEach(r=>{ if(r[2]!=null&&r[3]!=null&&meta[String(r[2]).trim()]===undefined) meta[String(r[2]).trim()]=r[3]; });

  const year=+(meta['Year']||meta['YEAR:']||0)||new Date().getFullYear();
  const rMonth=+(meta['Month']||meta['Til MONTH:']||0)||12;

  // header row: the row where column I starts with "Budget"
  let rHdr=0;
  for(let r=1;r<=30;r++){const v=C(gm,r,9); if(typeof v==='string'&&/^budget/i.test(v.trim())){rHdr=r;break;}}

  const rTitle=rHdr-2;

  for(let c=9;c<=W-2;){
    if(C(gm,rHdr,c)&&C(gm,rHdr,c+1)&&C(gm,rHdr,c+2)){
      const ttl=String(C(gm,rTitle,c)||'');
      let kind='other',m=null;
      MON_EN.forEach((mn,i)=>{ if(ttl.indexOf(mn)===0){kind='month';m=i;} });
      if(/year to date/i.test(ttl)) kind=/2025|prior|vs\./i.test(ttl)&&/vs\./i.test(ttl)?'prior':'ytd';
      cols.push({c,ttl,kind,m,vis:C(gm,2,c)});
      c+=3;
    } else c++;
  }
  const iM=[]; cols.forEach((g,i)=>{if(g.kind==='month')iM[g.m]=i;});
  const iY=cols.findIndex(g=>g.kind==='ytd');
  const iP=cols.findIndex(g=>g.kind==='prior');
  const active=[]; cols.forEach(g=>{ if(g.kind==='month'&&(g.vis==='Vis'||g.m<rMonth)) active.push(g.m); });
  const lastM=active.length?Math.max(...active):rMonth-1;

  const vals=r=>cols.map(g=>[num(C(gm,r,g.c)),num(C(gm,r,g.c+1)),num(C(gm,r,g.c+2))]);
  const pack=v=>({m:iM.map(i=>i==null?[null,null]:[v[i][0],v[i][1]]),
                  ytd:iY>=0?{b:v[iY][0],a:v[iY][1]}:null,
                  py :iP>=0?{p:v[iP][0],c:v[iP][1]}:null});

  const TOT={'income total':'income','galley expenses total':'galley','purchase total':'purchase',
    'gross-profit':'gp','gross-profit %':'gppct','consumer goods total':'consumer',
    'result before wages':'rbw','total':'result'};
  const sections=[]; let cur=null, kpi={}, pax=null, spp=null, persN=0;

  for(let r=rHdr;r<=gm.length;r++){
    const b=C(gm,r,2), c3=C(gm,r,3), g7=C(gm,r,7), h=C(gm,r,8);
    const hs=h==null?'':String(h).trim();
    if(hs==='Pax:'){ pax=pack(vals(r)); continue; }
    if(hs==='Sales pr. Pax:'){ spp=pack(vals(r)); continue; }
    if(typeof c3==='string'&&c3.trim()==='rubriknr.'){
      cur={name:hs,hidden:b==='Skjul',lines:[],total:null,memo:/gross profit only|for gp/i.test(hs)};

    }
    if(g7!=null&&hs&&/^\d/.test(String(g7).trim())&&cur){
      cur.lines.push({acct:String(g7).trim(),name:hs,...pack(vals(r))}); continue;
    }

        persN++; const kk=persN===1?'wages':'otherpers';

      }

        /* "Total" on its own is the report's grand total, not the total of the
           section we happen to be inside — it must not overwrite it. */
        if(cur&&k!=='total'&&/\stotal$/.test(k)){cur.total={label:hs,...pack(vals(r))}; cur.kpiKey=TOT[k];}
        continue; }
    }
  }

  // GL entries — sheets named "1".."12" (one per month)
  const tx=[];
  wb.SheetNames.forEach(sn=>{
    if(!/^\d{1,2}$/.test(sn))return;
    const mi=+sn-1; if(mi<0||mi>11)return;
    const g=G(sn);
    for(let i=14;i<g.length;i++){
      const row=g[i]; if(!row)continue;
      const d=row[7], amt=num(row[16]);
      if(amt==null)continue;
      let dt=null;
      if(d instanceof Date)dt=d;
      else if(typeof d==='number'&&d>20000&&d<80000){const o=XLSX.SSF.parse_date_code(d); if(o)dt=new Date(o.y,o.m-1,o.d);}
      if(!dt)continue;
      const af=String(row[13]||''); const p=af.split(' - ');
      tx.push({m:mi,d:dt.toISOString().slice(0,10),
        dt:String(row[8]||'').trim(), doc:String(row[9]||'').trim(), ext:String(row[12]||'').trim(),
        acct:(p[0]||'').trim(), an:(p.length>1?p.slice(1).join(' - '):'').trim(),
        desc:String(row[14]||'').trim(), dep:String(row[15]||'').trim()||key, amt:-amt});
    }
  });

  const rd=meta['Report date']||C(gm,12,8);
  let repDate=null;
  if(rd instanceof Date)repDate=rd;
  else if(typeof rd==='number'){const o=XLSX.SSF.parse_date_code(rd); if(o)repDate=new Date(o.y,o.m-1,o.d,o.H||0,o.M||0);}

  return {
    id:key+'|'+year+'|'+Math.random().toString(36).slice(2,7),
    fileName, key, combined, codes, nums, year, rMonth, lastM, active,
    title: combined?null:String(meta['Title:']||'').trim(),
    location:String(meta['Location']||'').trim(),
    ledger:String(meta['Ledger']||'').trim(),
    budgetName:String(meta['Budget:']||'').trim(),
    currency:String(C(gm,14,8)||'DKK').trim(),
    reportDate: repDate?repDate.toISOString():null,
    cols:cols.map(c=>({ttl:c.ttl,kind:c.kind,m:c.m})),
    sections, kpi, pax, spp, tx
  };
}
/* ══════════════ aggregation model ══════════════ */
const KPIS=['income','galley','purchase','consumer','wages','otherpers'];

const dev1=o=>(o.a||0)-(o.b||0);
function maxMonth(){ return S.files.length?Math.max(...S.files.map(f=>f.lastM)):-1; }
function periodMonths(){
  const lm=maxMonth();
  if(S.period.mode==='month') return [clamp(S.period.m,0,11)];
  return Array.from({length:lm+1},(_,i)=>i);
}
function periodLabel(){
  const ms=periodMonths();
  if(ms.length===1) return t('months')[ms[0]]+' '+(S.files[0]?S.files[0].year:'');
  return t('ytd')+' · '+t('mshort')[ms[0]]+'–'+t('mshort')[ms[ms.length-1]]+' '+(S.files[0]?S.files[0].year:'');
}
function isFullYTD(){ const ms=periodMonths(); return ms.length>1 && ms[0]===0 && ms[ms.length-1]===maxMonth(); }

function pick(pack,ms,i){ if(!pack)return null; let s=0,any=false;
  ms.forEach(m=>{const v=pack.m[m]; if(v&&v[i]!=null){s+=v[i]; any=true;}}); return any?s:null; }

/* The single place that decides what every figure is compared against.
   'budget' = this period's budget. 'py' = the same period last year, which the
   report only carries as a year-to-date total. */
function ref(pack,ms){
  if(!pack)return null;
  if(S.basis==='py') return pack.py?pack.py.p:null;
  return pick(pack,ms,0);
}
const refLabel=()=>S.basis==='py'?t('py'):t('budget');
const refShort=()=>S.basis==='py'?(LANG==='da'?'sidste år':'last year'):(LANG==='da'?'budget':'budget');
const hasMonthlyRef=()=>S.basis!=='py';

function aggFile(f,ms){
  const o={};
  KPIS.concat(['rbw','result']).forEach(k=>{ o[k]={b:ref(f.kpi[k],ms)||0, a:pick(f.kpi[k],ms,1)||0}; });
  o.gp={b:o.income.b+o.galley.b+o.purchase.b, a:o.income.a+o.galley.a+o.purchase.a};
  o.pax={b:ref(f.pax,ms)||0, a:pick(f.pax,ms,1)||0};
  return o;
}
function aggPY(f){ // prior-year YTD (only meaningful for full YTD)
  const o={};
  KPIS.concat(['rbw','result']).forEach(k=>{ const p=f.kpi[k]&&f.kpi[k].py; o[k]={p:p?p.p:null,c:p?p.c:null}; });
  o.gp={p:(o.income.p||0)+(o.galley.p||0)+(o.purchase.p||0), c:(o.income.c||0)+(o.galley.c||0)+(o.purchase.c||0)};
  o.pax=f.pax&&f.pax.py?{p:f.pax.py.p,c:f.pax.py.c}:{p:null,c:null};
  return o;
}
/* An account that carries a figure in one year and nothing at all in the other
   makes the two years uncomparable. The galley food cost is the live example:
   it sits inside F&B for 2026 and not for 2025, which alone makes F&B look
   millions worse. This returns what has to be set aside to compare like for like. */
function pyBreak(f){
  const items=[];
  f.sections.forEach(s=>s.lines.forEach(l=>{
    const p=l.py?l.py.p:null, c=l.py?l.py.c:null;
    if(p==null||c==null)return;
    if(Math.abs(p)<1&&Math.abs(c)>100000) items.push({name:l.name,acct:l.acct,prev:0,cur:c});
    else if(Math.abs(c)<1&&Math.abs(p)>100000) items.push({name:l.name,acct:l.acct,prev:p,cur:0});
  }));
  return {amt:sum(items.map(x=>x.cur-x.prev)), items};
}

function combineAgg(list,ms){
  const o={}; KPIS.concat(['rbw','result','gp','pax']).forEach(k=>o[k]={b:0,a:0});
  list.forEach(f=>{ const a=aggFile(f,ms);
    Object.keys(o).forEach(k=>{ o[k].b+=a[k].b; o[k].a+=a[k].a; }); });
  return o;
}
/* Ship total. The combined file is authoritative when present — but only when
   no department filter is on, since the combined file cannot be filtered.
   Otherwise we add the departments up and drop the galley memo block, which
   repeats the galley's own cost inside F&B so gross profit can be shown there. */
function shipTotal(ms){
  const all=!S.sel.size&&S.files.find(f=>f.combined);
  if(all) return {a:aggFile(all,ms), src:'file', f:all};
  const list=activeFiles();
  if(!list.length) return null;
  const o=combineAgg(list,ms);
  const memo=list.reduce((s,f)=>{const a=aggFile(f,ms); return {b:s.b+a.galley.b,a:s.a+a.galley.a};},{b:0,a:0});
  const gal=list.find(f=>f.key==='GAL');
  if(gal){ o.result.b-=memo.b; o.result.a-=memo.a; o.rbw.b-=memo.b; o.rbw.a-=memo.a; }
  return {a:o, src:'calc', memo, list};
}
/* activeFiles() honours the department filter and is what every view should use.
   deptFiles() ignores it and exists only for building the filter chips. */
function activeFiles(){ return S.files.filter(f=>!f.combined && (!S.sel.size||S.sel.has(f.key))); }
function deptFiles(){ return S.files.filter(f=>!f.combined); }
/* With only the all-ship file loaded there are no department files at all, so
   anything driven by activeFiles() came out empty. Fall back to the all-ship
   file for account-level work. */
function analysisFiles(){
  const a=activeFiles();
  if(a.length) return a;
  const all=S.files.find(f=>f.combined);
  return all?[all]:[];
}

/* The all-ship ledger carries a department code on every entry, so even with a
   single file we can still say who is ahead and who is behind — on actuals.
   There is no budget per department in that file, so hasRef stays false. */
function deptBreakdown(ms){
  const files=activeFiles();
  if(files.length) return files.map(f=>{const a=aggFile(f,ms);
    return {key:f.key, inc:a.income.a, incRef:a.income.b,
            buy:-(a.galley.a+a.purchase.a+a.consumer.a), pay:-(a.wages.a+a.otherpers.a),
            gp:a.gp.a, res:a.result.a, resRef:a.result.b, hasRef:true};});
  const all=S.files.find(f=>f.combined);
  if(!all||!all.tx.length) return [];
  const kind={};
  all.sections.forEach(s=>{ if(s.memo)return; s.lines.forEach(l=>kind[l.acct]=s.kpiKey); });
  const set=new Set(ms), acc={};
  all.tx.forEach(x=>{
    if(!set.has(x.m))return;
    if(S.sel.size&&!S.sel.has(x.dep))return;
    const k=kind[x.acct]; if(!k)return;
    const d=acc[x.dep]=acc[x.dep]||{key:x.dep,inc:0,buy:0,pay:0,gp:0,res:0,hasRef:false,fromLedger:true};
    if(k==='income') d.inc+=x.amt;
    else if(k==='wages'||k==='otherpers') d.pay-=x.amt;
    else d.buy-=x.amt;
    if(k==='income'||k==='galley'||k==='purchase') d.gp+=x.amt;
    d.res+=x.amt;
  });
  return Object.values(acc).filter(d=>DEPTS[d.key]).sort((a,b)=>b.res-a.res);
}

function who1(){
  if(S.sel.size) return scopeName();
  return LANG==='da'?'De kommercielle afdelinger':'The commercial departments';
}
function scopeName(){
  if(!S.sel.size) return t('shipTotal');
  const on=activeFiles().map(f=>dName(f.key));
  return on.length===1?on[0]:on.length+' '+(LANG==='da'?'afdelinger':'departments');
}


/* ══════════════ budget bridge ══════════════
   The galley's food cost is booked in the galley department, but its budget sits
   in the F&B report, where it is used to work out gross profit. Left alone the
   galley looks millions over budget and F&B looks flattered. This moves the
   budget across to the department that actually carries the cost. */
function unbridge(){
  S.files.forEach(f=>{ if(f._bridged){ bridgeAdj(f,f._bridged,-1); f._bridged=null; } });
}
function bridgeAdj(f,list,sign){
  list.forEach(({sec,line,b})=>{
    if(sign<0) delete line.bridged;
    b.forEach((v,m)=>{
      if(!v)return;
      if(!line.m[m])line.m[m]=[0,0];
      line.m[m][0]=(line.m[m][0]||0)+sign*v;
      if(sec.total){ if(!sec.total.m[m])sec.total.m[m]=[0,0]; sec.total.m[m][0]=(sec.total.m[m][0]||0)+sign*v; }
      if(sec.kpiKey&&f.kpi[sec.kpiKey]){ const k=f.kpi[sec.kpiKey]; if(!k.m[m])k.m[m]=[0,0]; k.m[m][0]=(k.m[m][0]||0)+sign*v; }
      ['result'].concat(['income','galley','purchase','consumer'].includes(sec.kpiKey)?['rbw']:[]).forEach(kk=>{
        const k=f.kpi[kk]; if(k){ if(!k.m[m])k.m[m]=[0,0]; k.m[m][0]=(k.m[m][0]||0)+sign*v; }});
    });
  });
}
function applyBridge(){
  unbridge();
  if(!S.bridge)return;
  const memo={};
  S.files.forEach(f=>{ if(f.combined)return;
    f.sections.filter(s=>s.memo).forEach(s=>s.lines.forEach(l=>{
      const b=l.m.map(v=>v?(v[0]||0):0);
      if(b.some(x=>x)) memo[l.acct]={b,from:f.key,name:l.name};
    }));});
  S.files.forEach(f=>{ if(f.combined)return;
    const list=[];
    f.sections.filter(s=>!s.memo).forEach(s=>s.lines.forEach(l=>{
      const m=memo[l.acct]; if(!m||m.from===f.key)return;
      if(l.m.some(v=>v&&v[0]))return;          // it already has its own budget
      if(!l.m.some(v=>v&&v[1]))return;         // nothing booked here either
      l.bridged=m.from; list.push({sec:s,line:l,b:m.b,from:m.from});
    }));
    if(list.length){ bridgeAdj(f,list,1); f._bridged=list; }
  });
}
function bridgeInfo(){
  const out=[];
  S.files.forEach(f=>{ (f._bridged||[]).forEach(x=>out.push({to:f.key,from:x.from,acct:x.line.acct,name:x.line.name,b:sum(x.b)})); });
  return out;
}

/* every account line across the selected departments, aggregated over the period */
function accountRows(ms,files){
  const out=[];
  (files||analysisFiles()).forEach(f=>{
    f.sections.forEach(sec=>{
      sec.lines.forEach(l=>{
        const b=ref(l,ms)||0, a=pick(l,ms,1)||0;
        const py=l.py?l.py.p:null;
        if(b===0&&a===0&&!py)return;
        out.push({dept:f.key,file:f,sec:sec.name,memo:sec.memo,acct:l.acct,name:l.name,b,a,dev:a-b,
                  devp:b!==0?((a-b)/Math.abs(b))*100:null, py, line:l});
      });
    });
  });
  return out;
}

/* ══════════════ svg chart toolkit ══════════════ */
const NS='http://www.w3.org/2000/svg';
function sv(w,h,body,extra){ return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;max-width:none;${extra||''}">${body}</svg>`; }
function svR(w,h,body){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block" preserveAspectRatio="xMidYMid meet">${body}</svg>`; }

/* signature device: a deviation tape — one small bar per month above/below a
   centre line. Green above = better than budget. Used on cards, rows, anywhere. */
function tape(months,vals,now){
  const mx=Math.max(1,...vals.map(v=>Math.abs(v||0)));
  let h='';
  months.forEach((m,i)=>{
    const v=vals[i]||0, r=Math.abs(v)/mx*46, up=v>=0;
    h+=`<div class="m${m===now?' now':''}" title="${esc(t('mshort')[m])}: ${sgn(v)}${fmtFull(v)}">
      <i style="${up?'bottom:50%':'top:50%'};height:${r}%;background:${up?'var(--good)':'var(--bad)'};opacity:${.45+.55*(Math.abs(v)/mx)}"></i>
      <i style="top:50%;height:1px;background:var(--hair2);opacity:.8"></i></div>`;
  });
  return `<div class="tape">${h}</div>`;
}

let _gid=0;
function niceTicks(lo,hi,n){
  const rg=(hi-lo)||1, raw=rg/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)||mag*10;
  const out=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+step*0.01; v+=step) out.push(+v.toFixed(6));
  if(lo<=0&&hi>=0&&!out.some(v=>Math.abs(v)<step*1e-6)) out.push(0);
  return out.sort((a,b)=>a-b);
}
function barsBA(months,bud,act,h=232,col){
  const id='g'+(++_gid);
  const w=Math.max(360,months.length*80), padL=68, padR=14, padT=26, padB=34;
  const solo=!bud||bud.every(v=>v==null);
  bud=solo?act.map(()=>0):bud;
  const hi=Math.max(0,...bud,...act), lo=Math.min(0,...bud,...act), rg=(hi-lo)||1;
  const Y=v=>padT+(hi-(v||0))/rg*(h-padT-padB);
  const bw=(w-padL-padR)/months.length;
  const C=col||'var(--accent)';
  let g=`<defs>
    <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C}" stop-opacity="1"/><stop offset="100%" stop-color="${C}" stop-opacity=".55"/>
    </linearGradient></defs>`;
  niceTicks(lo,hi,4).forEach(v=>{
    const y=Y(v), zero=Math.abs(v)<rg*1e-9;
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="${zero?'var(--hair2)':'var(--hair)'}" stroke-width="1" ${zero?'':'stroke-dasharray="2 5"'}/>`;
    g+=`<text x="${padL-10}" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  });
  months.forEach((m,i)=>{
    const x=padL+i*bw, gap=bw*0.16, bwd=(bw-gap*2)*0.42, z=Y(0);
    const pairs=solo
      ? [[act[i],x+gap+(bw-gap*2)*0.22,`url(#${id}a)`,t('actual'),(bw-gap*2)*0.56]]
      : [[bud[i],x+gap,'var(--hair2)',refLabel(),bwd],[act[i],x+gap+bwd+(bw-gap*2)*0.16,`url(#${id}a)`,t('actual'),bwd]];
    pairs.forEach(([v,xx,c,lbl,ww])=>{
      const y1=Y(v||0), y=Math.min(y1,z), hh=Math.max(1.5,Math.abs(y1-z));
      g+=`<rect x="${xx.toFixed(1)}" y="${y.toFixed(1)}" width="${ww.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${c}"><title>${esc(t('mshort')[m])} · ${esc(lbl)}: ${fmtFull(v)}</title></rect>`;
    });
    const av=act[i]||0, ay=Y(av);
    if(months.length<=12) g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(av>=0?ay-9:ay+17).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font-weight:800;font-size:11.5px">${fmt(av)}</text>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-11}" text-anchor="middle" style="font-size:12px;fill:var(--ink2)">${esc(t('mshort')[m])}</text>`;
  });
  return sv(w,h,g,'min-width:'+w+'px');
}

function lineChart(months,series,h=232){
  const id='g'+(++_gid);
  const w=Math.max(360,months.length*80), padL=68, padR=16, padT=24, padB=34;
  const allv=[].concat(...series.map(s=>s.v)).filter(v=>v!=null);
  const mx=Math.max(...allv,0), mn=Math.min(...allv,0), rg=(mx-mn)||1;
  const X=i=>padL+i*((w-padL-padR)/Math.max(1,months.length-1));
  const Y=v=>padT+(mx-v)/rg*(h-padT-padB);
  let g=`<defs>${series.map((s,si)=>`<linearGradient id="${id}_${si}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.c}" stop-opacity=".34"/><stop offset="100%" stop-color="${s.c}" stop-opacity="0"/>
    </linearGradient>`).join('')}</defs>`;
  niceTicks(mn,mx,4).forEach(v=>{
    const y=Y(v), zero=Math.abs(v)<rg*1e-9;
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="${zero?'var(--hair2)':'var(--hair)'}" stroke-width="1" ${zero?'':'stroke-dasharray="2 5"'}/>`;
    g+=`<text x="${padL-10}" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  });
  series.forEach((s,si)=>{
    const pts=s.v.map((v,i)=>v==null?null:`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ');
    let last=-1; s.v.forEach((v,i)=>{if(v!=null)last=i;});

    g+=`<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="${s.w||3}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    s.v.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4.5" fill="var(--bg)" stroke="${s.c}" stroke-width="2.6"><title>${esc(s.n)} ${esc(t('mshort')[months[i]])}: ${fmtFull(v)}</title></circle>`; });
  });
  months.forEach((m,i)=>{ g+=`<text x="${X(i).toFixed(1)}" y="${h-11}" text-anchor="middle" style="font-size:12px;fill:var(--ink2)">${esc(t('mshort')[m])}</text>`; });
  return sv(w,h,g,'min-width:'+w+'px');

function donut(pctv,label,color,size=140){
  const r=size/2-13, c=2*Math.PI*r, p=clamp(pctv,0,150)/100;
  const dash=Math.min(c,c*p);
  return svR(size,size,`
   <g transform="translate(${size/2},${size/2}) rotate(-90)">
    <circle r="${r}" fill="none" stroke="var(--hair)" stroke-width="12"/>
    <circle r="${r}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${dash} ${c}" style="transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1)"/>
   </g>
   <text x="${size/2}" y="${size/2-1}" text-anchor="middle" style="fill:var(--ink);font-size:25px;font-weight:800">${pctv==null?'–':Math.round(pctv)+'%'}</text>
   <text x="${size/2}" y="${size/2+20}" text-anchor="middle" style="font-size:12px">${esc(label)}</text>`);
}

function waterfall(steps,h=250){
  const w=Math.max(380,steps.length*98), pad=30;
  let run=0; const pts=steps.map(s=>{const from=run; if(!s.total)run+=s.v; const to=s.total?s.v:run; return {...s,from:s.total?0:from,to};});
  const mx=Math.max(...pts.map(p=>Math.max(p.from,p.to)),0), mn=Math.min(...pts.map(p=>Math.min(p.from,p.to)),0);
  const rg=(mx-mn)||1, Y=v=>h-34-((v-mn)/rg)*(h-52), bw=(w-pad*2)/steps.length;
  let g='';
  pts.forEach((p,i)=>{
    const x=pad+i*bw+bw*0.16, ww=bw*0.68;
    const y1=Y(p.from), y2=Y(p.to), y=Math.min(y1,y2), hh=Math.max(2,Math.abs(y2-y1));
    const c=p.total?'var(--accent)':(p.v>=0?'var(--good)':'var(--bad)');
    g+=`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="3" fill="${c}" opacity="${p.total?1:.85}"><title>${esc(p.n)}: ${fmtFull(p.v)}</title></rect>`;
    if(i<pts.length-1&&!pts[i+1].total) g+=`<line x1="${x+ww}" y1="${Y(p.to)}" x2="${pad+(i+1)*bw+bw*0.16}" y2="${Y(p.to)}" stroke="var(--hair2)" stroke-dasharray="3 3"/>`;
    g+=`<text x="${x+ww/2}" y="${h-22}" text-anchor="middle" style="font-size:11px;fill:var(--ink2)">${esc(p.n.length>15?p.n.slice(0,14)+'…':p.n)}</text>`;
    g+=`<text x="${x+ww/2}" y="${h-6}" text-anchor="middle" style="fill:${p.total?'var(--ink)':'var(--ink2)'};font-weight:800;font-size:12px">${fmt(p.v)}</text>`;
  });
  g+=`<line class="gl" x1="0" y1="${Y(0)}" x2="${w}" y2="${Y(0)}"/>`;
  return sv(w,h,g,'min-width:'+w+'px');
}

function hbars(items,h){
  const mx=Math.max(1,...items.map(i=>Math.abs(i.v)));
  return items.map(i=>`
   <div style="display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:7px">
     <div style="min-width:0">
       <div style="font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.n)}</div>
       <div class="bar" style="margin-top:4px"><i style="width:${Math.abs(i.v)/mx*100}%;background:${i.c||(i.v>=0?'var(--good)':'var(--bad)')}"></i></div>
     </div>
     <div class="num" style="font-size:12px;font-weight:800;color:${i.v>=0?'var(--good)':'var(--bad)'}">${sgn(i.v)}${fmt(i.v)}</div>
   </div>`).join('');
}

/* one block per subject, with each figure on its own labelled bar underneath.
   Never two figures sharing a single bar in two colours. */
function multiBars(items){
  const mx=Math.max(1,...[].concat(...items.map(i=>i.rows.map(r=>Math.abs(r.v||0)))));
  return items.map(i=>`
   <div class="mb">

}

/* a ranked row that can carry several figures, not just the bar value */
function rankRows(items){

  return `<div>${items.map(i=>`

/* a plain month-by-month table to sit under the charts */

/* Diverging bars — the clearest read there is on "who is up and who is down".
   Right of the line and green is better than the reference, left and red is worse. */
function diverge(items,h){
  const rowH=38, w=760, mid=w*0.52, pad=14;
  const mx=Math.max(1,...items.map(i=>Math.abs(i.v)));
  const H=items.length*rowH+16;
  let g=`<line x1="${mid}" y1="6" x2="${mid}" y2="${H-10}" stroke="var(--hair2)" stroke-width="1"/>`;
  items.forEach((it,i)=>{
    const y=10+i*rowH, bh=15;
    const len=Math.abs(it.v)/mx*(w*0.40);
    const pos=it.v>=0;
    const x=pos?mid:mid-len;
    g+=`<text x="${mid-14}" y="${y+bh/2+4}" text-anchor="end" style="fill:var(--ink);font-size:12.5px;font-weight:600">${esc(it.n)}</text>`;
    g+=`<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(2,len).toFixed(1)}" height="${bh}" rx="4"
         fill="${pos?'var(--good)':'var(--bad)'}" opacity=".9"><title>${esc(it.n)}: ${sgn(it.v)}${fmtFull(it.v)}</title></rect>`;
    g+=`<text x="${(pos?mid+len+9:mid-len-9).toFixed(1)}" y="${y+bh/2+4}" text-anchor="${pos?'start':'end'}"
         style="fill:${pos?'var(--good)':'var(--bad)'};font-size:12.5px;font-weight:700">${sgn(it.v)}${fmt(it.v)}</text>`;
    if(it.sub) g+=`<text x="${mid-14}" y="${y+bh/2+17}" text-anchor="end" style="font-size:10.5px">${esc(it.sub)}</text>`;
  });
  return sv(w,H,g,'min-width:520px');
}

function heat(rows,months){
  const mx=Math.max(1,...rows.map(r=>Math.max(...r.v.map(x=>Math.abs(x||0)))));
  let h=`<div style="display:grid;grid-template-columns:190px repeat(${months.length},1fr);gap:3px;font-size:11.5px;min-width:${190+months.length*40}px">`;
  h+=`<div></div>`+months.map(m=>`<div style="text-align:center;color:var(--muted);font-weight:700">${esc(t('mshort')[m])}</div>`).join('');
  rows.forEach(r=>{
    h+=`<div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);padding-right:5px" title="${esc(r.n)}">${esc(r.n)}</div>`;
    r.v.forEach((v,i)=>{
      const a=Math.abs(v||0)/mx, c=(v||0)>=0?'79,209,165':'255,122,117';
      h+=`<div title="${esc(r.n)} · ${esc(t('mshort')[months[i]])}: ${sgn(v)}${fmtFull(v)}" style="height:26px;border-radius:4px;background:rgba(${c},${(.08+a*.8).toFixed(2)})"></div>`;
    });
  });
  return h+'</div>';
}
/* ══════════════ what needs attention ══════════════ */
let _alCache=null,_alKey='';
function buildAlerts(){
  const key=S.files.map(f=>f.id).join()+'|'+[...S.sel].sort().join()+'|'+S.period.mode+S.period.m+'|'+LANG+'|'+S.bridge;
  if(_alKey===key&&_alCache)return _alCache;
  const R=_buildAlerts(); _alKey=key; _alCache=R; return R;
}
function _buildAlerts(){
  const RB=refShort(), RBc=RB.charAt(0).toUpperCase()+RB.slice(1);
  const ms=periodMonths(), lm=maxMonth(), A=[];
  const add=(sev,cat,title,body,amt,dept,acct)=>A.push({sev,cat,title,body,amt:amt||0,dept,acct});
  const L=LANG;
  const rows=accountRows(ms,activeFiles());

  bridgeInfo().filter(x=>!S.sel.size||S.sel.has(x.to)).forEach(x=>add('low','bridge',
    L==='da'?`Budget flyttet: ${x.name}`:`Budget moved: ${x.name}`,
    L==='da'?`Budgettet på ${fmtFull(Math.abs(x.b))} står i ${dName(x.from)}, men udgiften bogføres i ${dName(x.to)}. Det er lagt over på ${dName(x.to)}, så afvigelsen bliver retvisende.`
            :`The ${fmtFull(Math.abs(x.b))} budget sits in ${dName(x.from)} while the cost is booked in ${dName(x.to)}. It has been moved onto ${dName(x.to)} so the deviation reads true.`,
    0,x.to,x.acct));

  rows.forEach(r=>{
    if(r.memo)return;
    const rev=r.b>0||r.a>0;
    const dev=r.dev, mag=Math.abs(dev);
    if(rev){
      if(dev<0&&mag>40000&&r.b!==0&&Math.abs(dev/r.b)>0.05)
        add(mag>400000?'high':'med','rev',
          L==='da'?`Manglende omsætning: ${r.name}`:`Revenue shortfall: ${r.name}`,
          L==='da'?`${dName(r.dept)} · omsætning ${fmtFull(r.a)} mod ${RB} ${fmtFull(r.b)} (${pct(r.devp)}).`
                  :`${dName(r.dept)} · revenue ${fmtFull(r.a)} against ${RB} ${fmtFull(r.b)} (${pct(r.devp)}).`,
          dev,r.dept,r.acct);
    }else{
      if(dev<0&&mag>25000&&(r.b===0||Math.abs(dev/r.b)>0.10))
        add(mag>300000?'high':(mag>90000?'med':'low'),'cost',
          L==='da'?`Merforbrug: ${r.name}`:`Overspend: ${r.name}`,
          r.b===0
            ? (L==='da'?`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} brugt uden ${RB} på konto ${r.acct}.`
                       :`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} spent with no ${RB} on account ${r.acct}.`)
            : (L==='da'?`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} mod ${RB} ${fmtFull(Math.abs(r.b))} — ${fmtFull(mag)} over (${pct(r.devp)}).`
                       :`${dName(r.dept)} · ${fmtFull(Math.abs(r.a))} against ${RB} ${fmtFull(Math.abs(r.b))} — ${fmtFull(mag)} over (${pct(r.devp)}).`),
          dev,r.dept,r.acct);
      if(r.b!==0&&Math.abs(r.a)<Math.abs(r.b)*0.15&&Math.abs(r.b)>60000)
        add('low','unused',
          L==='da'?`Ubrugt ${RB}: ${r.name}`:`Unused ${RB}: ${r.name}`,
          L==='da'?`${dName(r.dept)} · kun ${fmtFull(Math.abs(r.a))} brugt af ${fmtFull(Math.abs(r.b))} i ${RB}.`
                  :`${dName(r.dept)} · only ${fmtFull(Math.abs(r.a))} used of the ${fmtFull(Math.abs(r.b))} in ${RB}.`,
          dev,r.dept,r.acct);
    }
    // three months running the wrong way
    if(ms.length>=3){
      const last3=ms.slice(-3).map(m=>{const v=r.line.m[m]; return v?(v[1]||0)-(v[0]||0):0;});
      if(last3.every(d=>d<0)&&Math.abs(sum(last3))>60000)
        add('med','trend',
          L==='da'?`Tre måneder i træk over ${RB}: ${r.name}`:`Three months running over ${RB}: ${r.name}`,
          L==='da'?`${dName(r.dept)} · ${ms.slice(-3).map(m=>t('mshort')[m]).join(', ')} ligger alle værre end ${RB}, i alt ${fmtFull(sum(last3))}.`
                  :`${dName(r.dept)} · ${ms.slice(-3).map(m=>t('mshort')[m]).join(', ')} are all worse than ${RB}, ${fmtFull(sum(last3))} in total.`,
          sum(last3),r.dept,r.acct);
    }
    // a single month far outside its own pattern
    const series=ms.map(m=>{const v=r.line.m[m]; return v?(v[1]||0):0;}).filter(v=>v!==0);
    if(series.length>=4){
      const mu=sum(series)/series.length, sd=Math.sqrt(sum(series.map(v=>(v-mu)**2))/series.length);
      ms.forEach(m=>{ const v=r.line.m[m]?(r.line.m[m][1]||0):0;
        if(sd>0&&Math.abs(v-mu)>3*sd&&Math.abs(v-mu)>80000)
          add('med','spike',
            L==='da'?`Enkeltmåned skiller sig ud: ${r.name}`:`One month stands out: ${r.name}`,
            L==='da'?`${dName(r.dept)} · ${t('months')[m]} ligger på ${fmtFull(v)} mod et snit på ${fmtFull(mu)}.`
                    :`${dName(r.dept)} · ${t('months')[m]} is ${fmtFull(v)} against an average of ${fmtFull(mu)}.`,
            v-mu,r.dept,r.acct); });
    }
    // last year
    if(isFullYTD()&&r.line.py){
      const p=r.line.py.p, c=r.line.py.c;
      if(p!=null&&c!=null&&p!==0&&Math.abs(c-p)>150000&&Math.abs((c-p)/p)>0.12){
        const worse=(r.b>0||r.a>0)?(c<p):(c<p);
        add(Math.abs(c-p)>600000?'med':'low','py',
          L==='da'?`${worse?'Ned':'Op'} mod sidste år: ${r.name}`:`${worse?'Down':'Up'} on last year: ${r.name}`,
          L==='da'?`${dName(r.dept)} · ${fmtFull(c)} i år mod ${fmtFull(p)} sidste år (${pct((c-p)/Math.abs(p)*100)}).`
                  :`${dName(r.dept)} · ${fmtFull(c)} this year against ${fmtFull(p)} last year (${pct((c-p)/Math.abs(p)*100)}).`,
          c-p,r.dept,r.acct);
      }
      if((p==null||p===0)&&c&&Math.abs(c)>200000)
        add('low','py',
          L==='da'?`Ingen sammenligning sidste år: ${r.name}`:`No last-year comparison: ${r.name}`,
          L==='da'?`${dName(r.dept)} · konto ${r.acct} har ${fmtFull(c)} i år og intet sidste år. Tallene er ikke direkte sammenlignelige.`
                  :`${dName(r.dept)} · account ${r.acct} shows ${fmtFull(c)} this year and nothing last year. The figures are not directly comparable.`,
          0,r.dept,r.acct);
    }
  });

  // department level
  activeFiles().forEach(f=>{
    const a=aggFile(f,ms);
    if(a.income.a>0){
      const gpA=a.gp.a/a.income.a*100, gpB=a.income.b?a.gp.b/a.income.b*100:null;
      if(gpB!=null&&gpA<gpB-3)
        add(gpA<gpB-8?'high':'med','gp',
          L==='da'?`Dækningsbidrag under ${RB} · ${dName(f.key)}`:`Gross profit below ${RB} · ${dName(f.key)}`,
          L==='da'?`DB ligger på ${gpA.toFixed(1)}% mod ${gpB.toFixed(1)}% i ${RB}. Hvert procentpoint svarer til ${fmtFull(a.income.a/100)}.`
                  :`GP is ${gpA.toFixed(1)}% against ${gpB.toFixed(1)}% in ${RB}. Each point is worth ${fmtFull(a.income.a/100)}.`,
          (gpA-gpB)/100*a.income.a,f.key);
      const wA=Math.abs(a.wages.a+a.otherpers.a)/a.income.a*100, wB=a.income.b?Math.abs(a.wages.b+a.otherpers.b)/a.income.b*100:null;
      if(wB!=null&&wA>wB+3)
        add('med','wage',
          L==='da'?`Løn fylder mere end i ${RB} · ${dName(f.key)}`:`Wages heavier than in ${RB} · ${dName(f.key)}`,
          L==='da'?`Løn udgør ${wA.toFixed(1)}% af omsætningen mod ${wB.toFixed(1)}% i ${RB}.`
                  :`Wages are ${wA.toFixed(1)}% of revenue against ${wB.toFixed(1)}% in ${RB}.`,
          -(wA-wB)/100*a.income.a,f.key);
    }
    const res=a.result.a-a.result.b;
    if(Math.abs(res)>250000)
      add(Math.abs(res)>1e6?'high':'med','result',
        L==='da'?`${dName(f.key)} — bundlinje ${res>0?'bedre':'dårligere'} end ${RB}`
                :`${dName(f.key)} — bottom line ${res>0?'better':'worse'} than ${RB}`,
        L==='da'?`Resultat ${fmtFull(a.result.a)} mod ${RB} ${fmtFull(a.result.b)}.${a.income.a>0?` Omsætning ${fmtFull(a.income.a)} mod ${fmtFull(a.income.b)}, samlede omkostninger ${fmtFull(a.galley.a+a.purchase.a+a.consumer.a+a.wages.a+a.otherpers.a)}.`:''}`
                :`Result ${fmtFull(a.result.a)} against ${RB} ${fmtFull(a.result.b)}.${a.income.a>0?` Revenue ${fmtFull(a.income.a)} against ${fmtFull(a.income.b)}, total costs ${fmtFull(a.galley.a+a.purchase.a+a.consumer.a+a.wages.a+a.otherpers.a)}.`:''}`,
        res,f.key);
  });

  // pax vs revenue
  const sh=shipTotal(ms);
  if(sh&&sh.a.pax.a>0&&sh.a.pax.b>0&&sh.a.income.b>0){
    const rpA=sh.a.income.a/sh.a.pax.a, rpB=sh.a.income.b/sh.a.pax.b;
    if(rpA<rpB*0.95)
      add('med','pax',
        L==='da'?`Omsætning pr. passager under ${RB}`:`Revenue per passenger below ${RB}`,
        L==='da'?`${fmtN(rpA,0)} kr. pr. pax mod ${fmtN(rpB,0)} kr. i ${RB}. Med ${fmtN(sh.a.pax.a)} passagerer svarer forskellen til ${fmtFull((rpA-rpB)*sh.a.pax.a)}.`
                :`${fmtN(rpA,0)} per pax against ${fmtN(rpB,0)} in ${RB}. Across ${fmtN(sh.a.pax.a)} passengers that is ${fmtFull((rpA-rpB)*sh.a.pax.a)}.`,
        (rpA-rpB)*sh.a.pax.a);
  }

  // duplicate-looking entries
  const seen={}, dups=[];
  S.files.filter(f=>f.combined||S.files.every(x=>!x.combined)).forEach(f=>{
    f.tx.forEach(x=>{
      if(Math.abs(x.amt)<3000)return;
      if(S.sel.size&&!S.sel.has(x.dep))return;
      const k=x.acct+'|'+Math.round(x.amt)+'|'+x.desc.toLowerCase().slice(0,26);
      if(seen[k]){ if(seen[k].doc!==x.doc) dups.push([seen[k],x]); } else seen[k]=x;
    });
  });
  dups.slice(0,14).forEach(([a,b])=>
    add('low','dup',
      L==='da'?`Ens beløb to gange: ${a.an||a.acct}`:`Same amount twice: ${a.an||a.acct}`,
      L==='da'?`${fmtFull(Math.abs(a.amt))} bogført ${a.d} (${a.doc}) og igen ${b.d} (${b.doc}) med samme tekst.`
              :`${fmtFull(Math.abs(a.amt))} posted ${a.d} (${a.doc}) and again ${b.d} (${b.doc}) with the same text.`,
      0,a.dep,a.acct));

  const ord={high:0,med:1,low:2};
  A.sort((x,y)=>ord[x.sev]-ord[y.sev]||Math.abs(y.amt)-Math.abs(x.amt));
  return A;
}

const CAT={
 rev :{da:'Omsætning',en:'Revenue'},        cost:{da:'Forbrug',en:'Spend'},
 result:{da:'Bundlinje',en:'Bottom line'},  unused:{da:'Ubrugt budget',en:'Unused budget'},
 trend:{da:'Skred over flere måneder',en:'Drift over several months'},
 spike:{da:'Enkelt måned',en:'Single month'}, py:{da:'Mod sidste år',en:'Against last year'},
 gp  :{da:'Dækningsbidrag',en:'Gross profit'}, wage:{da:'Løn',en:'Wages'},
 pax :{da:'Pr. passager',en:'Per passenger'},  dup:{da:'Muligt dobbelt',en:'Possible duplicate'},
 bridge:{da:'Budget flyttet',en:'Budget moved'},
};
function meaning(cat,amt){
  const d=LANG==='da', up=amt>0, RB=refShort();
  switch(cat){
    case 'rev':    return d?(up?`Mere omsætning end ${RB}`:`Mindre omsætning end ${RB}`)
                           :(up?`More revenue than ${RB}`:`Less revenue than ${RB}`);
    case 'cost': case 'unused':
                   return d?(up?`Mindre brugt end ${RB}`:`Mere brugt end ${RB}`)
                           :(up?`Less spent than ${RB}`:`More spent than ${RB}`);
    case 'result': return d?(up?`Mere tilbage på bundlinjen end ${RB}`:`Mindre tilbage på bundlinjen end ${RB}`)
                           :(up?`More left on the bottom line than ${RB}`:`Less left on the bottom line than ${RB}`);
    case 'gp':     return d?`Lavere dækningsgrad end ${RB}`:`Lower gross margin than ${RB}`;
    case 'wage':   return d?`Løn fylder mere af omsætningen end ${RB}`:`Wages take more of revenue than ${RB}`;
    case 'pax':    return d?`Hver passager lægger mindre end ${RB}`:`Each passenger spends less than ${RB}`;
    case 'trend':  return d?'Samme retning tre måneder i træk':'Same direction three months running';
    case 'spike':  return d?'Én måned falder helt uden for mønsteret':'One month falls right outside the pattern';
    case 'py':     return d?(up?'Højere end samme periode sidste år':'Lavere end samme periode sidste år')
                           :(up?'Higher than the same period last year':'Lower than the same period last year');
    default: return '';
  }
}

/* ══════════════ views ══════════════ */
function kpiCard(o){
  const {label,val,bud,unitTxt,plain,inv,pctv,dec,noBud}=o;
  const dev=(val!=null&&bud!=null)?val-bud:null;
  const good=dev==null?null:(inv?dev<=0:dev>=0);
  const p=(bud!=null&&bud!==0)?Math.abs(val/bud)*100:null;
  return `<div class="card kpi">
   <div class="lbl"><span class="eyebrow">${esc(label)}${o.q?q(o.q):''}</span>${o.badge||''}</div>
   <div class="v num">${dec!=null?fmtN(val,dec):fmt(val)}<span class="u">${esc(unitTxt||'')}</span></div>
   ${noBud?'':`<div class="cmp">
     ${dev!=null?`<span class="pill ${good?'g':'b'}">${sgn(dev)}${dec!=null?fmtN(dev,dec):fmt(dev)}</span>`:''}
     <span class="mut">${refLabel()} <b class="num">${bud!=null?(dec!=null?fmtN(bud,dec):fmt(bud)):'–'}</b></span>
     ${p!=null?`<span class="mut">· ${Math.round(p)}% ${t('ofBudget')}</span>`:''}
   </div>`}
   ${pctv!=null?`<div class="bar" style="margin-top:9px"><i style="width:${clamp(pctv,0,100)}%;background:${good===false?'var(--bad)':'var(--good)'}"></i></div>`:''}
   ${plain?`<div class="plain">${plain}</div>`:''}
  </div>`;
}

function vOverview(){
  const ms=periodMonths(), lm=maxMonth(), sh=shipTotal(ms);
  if(!sh) return '<div class="empty">'+t('noData')+'</div>';
  const a=sh.a, L=LANG;
  const gpP=a.income.a?a.gp.a/a.income.a*100:null, gpB=a.income.b?a.gp.b/a.income.b*100:null;
  const rp=a.pax.a?a.income.a/a.pax.a:null, rpB=a.pax.b?a.income.b/a.pax.b:null;
  const files=activeFiles();

  // monthly ship series
  const allM=Array.from({length:lm+1},(_,i)=>i);
  const src=S.files.find(f=>f.combined)||null;
  const mSeries=k=>allM.map(m=>{
    if(src){const v=src.kpi[k]&&src.kpi[k].m[m]; return v?[v[0]||0,v[1]||0]:[0,0];}
    let b=0,x=0; files.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m]; if(v){b+=v[0]||0;x+=v[1]||0;}}); return [b,x];
  });
  const resM=mSeries('result'), incM=mSeries('income');
  const devM=resM.map(v=>v[1]-v[0]);

  // movers
  const rows=accountRows(ms).filter(r=>!r.memo);
  const sorted=[...rows].sort((x,y)=>y.dev-x.dev);
  const wins=sorted.slice(0,6).filter(r=>r.dev>0).map(r=>({n:`${dName(r.dept)} · ${r.name}`,v:r.dev}));
  const miss=sorted.slice(-6).reverse().filter(r=>r.dev<0).map(r=>({n:`${dName(r.dept)} · ${r.name}`,v:r.dev}));

  const wf=[
    {n:t('income'),v:a.income.a},{n:t('galley'),v:a.galley.a},{n:t('purchase'),v:a.purchase.a},
    {n:t('consumer'),v:a.consumer.a},{n:t('wages'),v:a.wages.a},{n:t('otherpers'),v:a.otherpers.a},
    {n:t('result'),v:a.result.a,total:true}
  ].filter(s=>s.v!==0||s.total);

  const alerts=buildAlerts();
  const hi=alerts.filter(x=>x.sev==='high').length;

  const deptCards=(files.length?files:[]).map(f=>{
    const g=aggFile(f,ms), d=g.result.a-g.result.b;
    const tv=allM.map(m=>{const v=f.kpi.result.m[m]; return v?(v[1]||0)-(v[0]||0):0;});
    const row=(l,v,b,c)=>`
      <div style="display:flex;align-items:baseline;gap:7px;margin-bottom:3px">
        <span style="font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;width:72px;flex:none">${esc(l)}</span>
        <b class="num" style="font-size:15px;font-weight:800;letter-spacing:-.03em;color:${c||'var(--ink)'}">${fmt(v)}</b>
        ${b!=null?`<span class="mut" style="font-size:10px">${refLabel()} ${fmt(b)}</span>`:''}
      </div>`;
    return `<div class="card" style="padding:13px 14px;cursor:pointer" onclick="focusDept('${f.key}')">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
        <span style="width:9px;height:9px;border-radius:3px;background:${dCol(f.key)}"></span>
        <b style="font-size:12.5px">${esc(dName(f.key))}</b>
        <span style="flex:1"></span>
        <span class="pill ${d>=0?'g':'b'}">${sgn(d)}${fmt(d)}</span>
      </div>
      ${g.income.a>0?row(t('income'),g.income.a,g.income.b):''}
      ${row(t('result'),g.result.a,g.result.b,g.result.a>=0?'var(--good)':'var(--bad)')}
      <div style="margin-top:8px">${tape(allM,tv,lm)}</div>
    </div>`;
  }).join('');

  const dv=dev1(a.result);
  const better=dv>=0;
  const bdOv=deptBreakdown(ms);
  const devItems=bdOv.map(d=>({n:dName(d.key),
      v:d.hasRef?d.res-d.resRef:d.res,
      sub:d.hasRef?`${t('result')} ${fmt(d.res)} · ${refShort()} ${fmt(d.resRef)}`
                  :`${t('result')} ${fmt(d.res)} · ${t('income')} ${fmt(d.inc)}`}))
    .sort((x,y)=>y.v-x.v);

  const verdict=`<div class="verdict" style="margin-bottom:14px">
    <div class="eyebrow">${esc(periodLabel())} · ${esc(scopeName())} · ${esc(refLabel())}${q('basis')}</div>
    <div class="big">${L==='da'
      ? `${esc(who1())} ligger <em class="${better?'up':'dn'}">${fmtFull(Math.abs(dv))} ${better?t('better'):t('worse')}</em> end ${esc(refShort())}`
      : `${esc(who1())} ${activeFiles().length===1?'is':'are'} <em class="${better?'up':'dn'}">${fmtFull(Math.abs(dv))} ${better?t('better'):t('worse')}</em> than ${esc(refShort())}`}</div>
  </div>`;

  return `
  ${verdict}
  <div class="grid g4" style="margin-bottom:14px">
    ${kpiCard({label:t('income'),q:'income',val:a.income.a,bud:a.income.b,
      plain:L==='da'?'Alt hvad gæsterne har lagt om bord i perioden.':'Everything guests spent on board in the period.'})}
    ${kpiCard({label:t('gp'),q:'gp',val:a.gp.a,bud:a.gp.b,
      badge:gpP!=null?`<span class="pill ${gpB==null||gpP>=gpB?'g':'b'}">${gpP.toFixed(1)}%</span>`:'',
      plain:L==='da'?`Omsætning minus vareforbrug. ${refShort()} ${gpB!=null?gpB.toFixed(1)+'%':'–'}.`:`Revenue less cost of goods. ${refShort()} ${gpB!=null?gpB.toFixed(1)+'%':'–'}.`})}
    ${kpiCard({label:t('result'),q:'result',val:a.result.a,bud:a.result.b,
      plain:L==='da'?'Bundlinjen for de kommercielle afdelinger, efter løn.':'Bottom line for the commercial departments, after wages.'})}
    ${kpiCard({label:t('revpax'),q:'revpax',val:rp,bud:rpB,dec:0,unitTxt:'kr.',
      plain:L==='da'?`${fmtN(a.pax.a)} passagerer i perioden (${refShort()} ${fmtN(a.pax.b)}).`:`${fmtN(a.pax.a)} passengers in the period (${refShort()} ${fmtN(a.pax.b)}).`})}
  </div>

  <div class="grid g2" style="margin-bottom:12px">
    <div class="card">
      <h3>${L==='da'?'Fra omsætning til bundlinje':'From revenue to bottom line'}${q('waterfall')}</h3>
      <div class="sub">${L==='da'?'Hver søjle viser hvad der lægges til eller trækkes fra undervejs.':'Each bar shows what is added or taken out along the way.'}</div>
      <div class="chartbox">${waterfall(wf)}</div>
    </div>
    <div class="card">
      <h3>${L==='da'?'Resultat pr. måned':'Result by month'}</h3>
      <div class="sub">${hasMonthlyRef()?(L==='da'?'Lys søjle = budget, blå = faktisk. Tallet over søjlen er det faktiske.':'Pale bar = budget, blue = actual. The figure above each bar is the actual.'):(L==='da'?'Faktisk resultat pr. måned. Sidste år findes kun som årstotal, så der er ikke noget at holde hver måned op imod.':'Actual result per month. Last year only exists as a year total, so there is nothing to hold each month against.')}</div>
      <div class="chartbox">${barsBA(allM,hasMonthlyRef()?resM.map(v=>v[0]):null,resM.map(v=>v[1]))}</div>
      ${hasMonthlyRef()?`<div class="legend"><span><i style="background:var(--hair2)"></i>${refLabel()}</span><span><i style="background:var(--accent)"></i>${t('actual')}</span></div>`:''}
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:12px">${deptCards}</div>

  <div class="grid g2" style="margin-bottom:14px">
    <div class="card">
      <h3>${L==='da'?'Hvem trækker op, og hvem trækker ned':'Who is pulling up, and who is pulling down'}${q('dev')}</h3>
      <div class="sub">${L==='da'?`Afvigelse på bundlinjen mod ${refShort()}. Til højre og grønt er godt.`:`Deviation on the bottom line against ${refShort()}. To the right and green is good.`}</div>
      <div class="chartbox">${devItems.length?diverge(devItems):'<div class="empty">'+t('noData')+'</div>'}</div>
    </div>
    <div class="card">
      <h3>${t('nav_alert')}${q('alerts')} ${hi?`<span class="pill b" style="margin-left:8px">${hi}</span>`:''}</h3>
      <div class="sub">${L==='da'?'De tre ting der først er værd at kigge på.':'The first three things worth a look.'}</div>
      ${alerts.slice(0,3).map(alertHTML).join('')||'<div class="mut" style="font-size:12.5px">'+(L==='da'?'Intet at bemærke.':'Nothing to flag.')+'</div>'}
      <div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">
        <button class="chip" onclick="go('alert')">${L==='da'?'Se alle '+alerts.length:'See all '+alerts.length} →</button>
        ${(()=>{const c=dataChecks().filter(x=>x.sev==='high'||x.sev==='med').length;
          return c?`<button class="chip" onclick="go('chk')">${L==='da'?c+' ting at kontrollere':c+' things to check'} →</button>`:'';})()}
      </div>
    </div>
  </div>`;
}

function alertHTML(x){
  const c=x.amt>0?'var(--good)':x.amt<0?'var(--bad)':'var(--info)';
  const kind=CAT[x.cat]?CAT[x.cat][LANG]||CAT[x.cat].en:'';
  const mean=meaning(x.cat,x.amt);
  return `<div class="alert">
   <div class="sev" style="background:${c}"></div>
   <div style="flex:1;min-width:0">
     <div style="margin-bottom:6px">
       ${kind?`<span class="tag">${esc(kind)}</span>`:''}
       ${x.dept?`<span class="tag" style="color:${dCol(x.dept)};border-color:${dCol(x.dept)}55">${esc(dName(x.dept))}</span>`:''}
       ${x.sev==='high'?`<span class="tag" style="color:var(--warn);border-color:var(--warn)66">${esc(t('sev_high'))}</span>`:''}
     </div>
     <h4>${esc(x.title)}</h4>
     <p>${esc(x.body)}</p>
     ${mean?`<p style="margin-top:4px;color:${c};font-weight:600">${x.amt>0?'▲':'▼'} ${esc(mean)}</p>`:''}
   </div>
   ${x.amt?`<div class="amt ${x.amt>=0?'up':'dn'}">${sgn(x.amt)}${fmt(x.amt)}</div>`:''}
  </div>`;
}
/* ---------- departments ---------- */
function vDept(){
  const ms=periodMonths(), lm=maxMonth(), files=activeFiles(), L=LANG;
  const bd=deptBreakdown(ms);
  if(!files.length){
    if(!bd.length) return '<div class="empty">'+t('noData')+'</div>';
    /* Only the all-ship file is loaded. Its ledger still carries a department
       code on every entry, so the split is real — there is just no budget. */
    const T=bd.reduce((s,d)=>({inc:s.inc+d.inc,buy:s.buy+d.buy,pay:s.pay+d.pay,gp:s.gp+d.gp,res:s.res+d.res}),
                      {inc:0,buy:0,pay:0,gp:0,res:0});
    return `<div class="card" style="margin-bottom:13px">
      <h3>${L==='da'?'Afdelingerne, regnet ud fra posteringerne':'Departments, worked out from the entries'}</h3>
      <div class="sub">${esc(periodLabel())} · ${L==='da'?'hver postering i totalfilen bærer sin afdelingskode':'every entry in the all-ship file carries its department code'}</div>
      <div class="tw"><table><thead><tr><th>${t('dept')}</th><th>${t('income')}</th><th>${t('gppct')}</th>
        <th>${t('purchaseAll')}</th><th>${t('wagesAll')}</th><th>${t('result')}</th></tr></thead><tbody>
        ${bd.map(d=>`<tr><td class="name"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${dCol(d.key)};margin-right:8px"></span><b>${esc(dName(d.key))}</b></td>
          <td class="num">${d.inc?fmt(d.inc):'–'}</td>
          <td class="num mut">${d.inc?(d.gp/d.inc*100).toFixed(1)+'%':'–'}</td>
          <td class="num dn">${fmt(d.buy)}</td><td class="num dn">${fmt(d.pay)}</td>
          <td class="num ${d.res>=0?'up':'dn'}"><b>${fmt(d.res)}</b></td></tr>`).join('')}
        <tr class="grand"><td>${t('total')}</td><td class="num">${fmt(T.inc)}</td>
          <td class="num">${T.inc?(T.gp/T.inc*100).toFixed(1)+'%':'–'}</td>
          <td class="num">${fmt(T.buy)}</td><td class="num">${fmt(T.pay)}</td>
          <td class="num"><b>${fmt(T.res)}</b></td></tr>
      </tbody></table></div>
      <div class="hint">${L==='da'
        ?'Der er ingen afdelingsbudgetter i totalfilen, så der er intet at måle op imod her. Tallene afviger også fra afdelingsrapporterne på to punkter: kabyssens vareforbrug tælles ikke med hos F&amp;B, og fælles lønkonti ligger hos den afdeling de er bogført på. Læg afdelingsfilerne ind for at få budgetterne med.'
        :'The all-ship file holds no department budgets, so there is nothing to measure against here. The figures also differ from the department reports on two points: the galley cost of goods is not counted under F&amp;B, and shared wage accounts sit with the department they are booked to. Load the department files to bring the budgets in.'}</div>
    </div>
    <div class="grid g2">
      <div class="card"><h3>${L==='da'?'Hvem tjener pengene':'Where the money comes from'}${q('income')}</h3>
        <div class="sub">${esc(periodLabel())}</div>
        ${multiBars(bd.filter(d=>d.inc>0).sort((x,y)=>y.inc-x.inc).map(d=>({n:dName(d.key),c:dCol(d.key),
          rows:[{l:t('income'),q:'income',v:d.inc,c:dCol(d.key)},
                {l:t('gp'),q:'gp',v:d.gp,c:'var(--good)'},
                {l:t('result'),q:'result',v:d.res,c:'var(--accent)',k:d.res>=0?'var(--good)':'var(--bad)'}]})))}</div>
      <div class="card"><h3>${L==='da'?'Hvem koster mest':'Where the money goes'}${q('buy')}</h3>
        <div class="sub">${esc(periodLabel())}</div>
        ${multiBars(bd.slice().sort((x,y)=>(y.buy+y.pay)-(x.buy+x.pay)).map(d=>({n:dName(d.key),c:dCol(d.key),
          rows:[{l:t('purchaseAll'),q:'buy',v:d.buy,c:'var(--warn)',f:fmt(-d.buy),k:'var(--bad)'},
                {l:t('wagesAll'),q:'pay',v:d.pay,c:'var(--info)',f:fmt(-d.pay),k:'var(--bad)'},
                {l:t('total'),v:d.buy+d.pay,c:'var(--muted)',f:fmt(-(d.buy+d.pay)),k:'var(--bad)'}]})))}</div>
    </div>`;
  }
  const allM=Array.from({length:lm+1},(_,i)=>i);
  const sh=shipTotal(ms);
  const rowsHTML=files.map(f=>{
    const a=aggFile(f,ms), d=a.result.a-a.result.b;
    const gp=a.income.a?a.gp.a/a.income.a*100:null;
    const wg=a.income.a?Math.abs(a.wages.a+a.otherpers.a)/a.income.a*100:null;
    const share=sh&&sh.a.income.a?a.income.a/sh.a.income.a*100:null;
    const tv=allM.map(m=>{const v=f.kpi.result.m[m]; return v?(v[1]||0)-(v[0]||0):0;});
    return `<tr class="clip" onclick="focusDept('${f.key}')">
     <td class="name"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${dCol(f.key)};margin-right:8px"></span><b>${esc(dName(f.key))}</b></td>
     <td class="num">${fmt(a.income.a)}</td>
     <td class="num mut">${fmt(a.income.b)}</td>
     <td class="num">${gp!=null?gp.toFixed(1)+'%':'–'}</td>
     <td class="num">${fmt(a.wages.a+a.otherpers.a)}</td>
     <td class="num">${wg!=null?wg.toFixed(1)+'%':'–'}</td>
     <td class="num"><b>${fmt(a.result.a)}</b></td>
     <td class="num mut">${fmt(a.result.b)}</td>
     <td class="num ${d>=0?'up':'dn'}"><b>${sgn(d)}${fmt(d)}</b></td>
     <td style="width:130px">${tape(allM,tv,lm)}</td>
    </tr>`;
  }).join('');
  const T2=sh?sh.a:null;
  return `
  <div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Afdelingerne side om side':'Departments side by side'}</h3>
    <div class="sub">${esc(periodLabel())} · ${L==='da'?'klik på en linje for at zoome ind på afdelingen.':'click a row to zoom into that department.'}</div>
    <div class="tw"><table>
      <thead><tr><th>${t('dept')}</th><th>${t('income')}${q('income')}</th><th>${refLabel()}</th><th>${t('gppct')}${q('gppct')}</th>
      <th>${t('wages')}${q('wages')}</th><th>%</th><th>${t('result')}${q('result')}</th><th>${refLabel()}</th><th>${t('dev')}${q('dev')}</th><th>${L==='da'?'Måned for måned':'Month by month'}${q('tape')}</th></tr></thead>
      <tbody>${rowsHTML}
      ${T2?`<tr class="grand"><td>${esc(scopeName())}</td><td class="num">${fmt(T2.income.a)}</td><td class="num">${fmt(T2.income.b)}</td>
        <td class="num">${T2.income.a?(T2.gp.a/T2.income.a*100).toFixed(1)+'%':'–'}</td>
        <td class="num">${fmt(T2.wages.a+T2.otherpers.a)}</td>
        <td class="num">${T2.income.a?(Math.abs(T2.wages.a+T2.otherpers.a)/T2.income.a*100).toFixed(1)+'%':'–'}</td>
        <td class="num">${fmt(T2.result.a)}</td><td class="num">${fmt(T2.result.b)}</td>
        <td class="num ${T2.result.a-T2.result.b>=0?'up':'dn'}">${sgn(T2.result.a-T2.result.b)}${fmt(T2.result.a-T2.result.b)}</td><td></td></tr>`:''}
      </tbody></table></div>
    ${bridgeInfo().length?`<div class="hint">${L==='da'
      ?'<b>'+t('bridgeH')+'.</b> '+bridgeInfo().map(x=>`${esc(x.name)} (${fmtFull(Math.abs(x.b))}) er flyttet fra ${dName(x.from)} til ${dName(x.to)}, hvor udgiften faktisk bogføres. Uden det ville ${dName(bridgeInfo()[0].to)} se ud til at ligge millioner over budget. Slå det fra i toppen for at se rå JetReports-tal.`).join(' ')
      :'<b>'+t('bridgeH')+'.</b> '+bridgeInfo().map(x=>`${esc(x.name)} (${fmtFull(Math.abs(x.b))}) has been moved from ${dName(x.from)} to ${dName(x.to)}, where the cost is actually booked. Without it ${dName(bridgeInfo()[0].to)} would look millions over budget. Switch it off at the top for raw JetReports figures.`).join(' ')}</div>`:''}
    ${sh&&sh.src==='calc'?`<div class="hint">${L==='da'
      ?'Skib i alt er lagt sammen af afdelingsfilerne. Kabyssens vareforbrug er kun talt én gang — det står også under F&amp;B, hvor det bruges til at regne dækningsbidrag.'
      :'Ship total is added up from the department files. The galley cost of goods is counted once only — it also sits under F&amp;B, where it is used to work out gross profit.'}</div>`:''}
  </div>

  <div class="grid g2">
    <div class="card">
      <h3>${L==='da'?'Hvem tjener pengene':'Where the money comes from'}${q('income')}</h3>
      <div class="sub">${L==='da'?'Omsætning, dækningsbidrag og bundlinje — hver på sin egen linje, så de kan læses hver for sig.':'Revenue, gross profit and bottom line — each on its own row so they can be read separately.'} · ${esc(periodLabel())}</div>
      ${(()=>{const r=files.map(f=>({f,a:aggFile(f,ms)})).filter(x=>x.a.income.a>0).sort((x,y)=>y.a.income.a-x.a.income.a);
        return r.length?multiBars(r.map(x=>({n:dName(x.f.key),c:dCol(x.f.key),
          note:(x.a.gp.a/x.a.income.a*100).toFixed(1)+'% '+t('gppct'),
          rows:[
            {l:t('income'),q:'income',v:x.a.income.a,c:dCol(x.f.key)},
            {l:t('gp'),q:'gp',v:x.a.gp.a,c:'var(--good)'},
            {l:t('result'),q:'result',v:x.a.result.a,c:'var(--accent)',k:x.a.result.a>=0?'var(--good)':'var(--bad)'}
          ]})))
        :'<div class="mut" style="font-size:12px">'+t('noData')+'</div>';})()}
      ${(()=>{const nr=files.filter(f=>aggFile(f,ms).income.a<=0);
        return nr.length?`<div class="hint">${L==='da'?'Kabys og kahytter har ingen egen omsætning — de leverer til de andre afdelinger og står derfor kun med omkostninger.':'The galley and housekeeping carry no revenue of their own — they serve the other departments and so show costs only.'}</div>`:'';})()}
    </div>
    <div class="card">
      <h3>${L==='da'?'Hvem koster mest':'Where the money goes'}${q('buy')}</h3>
      <div class="sub">${L==='da'?'Indkøb og løn hver for sig — de to knapper man skruer på uafhængigt af hinanden.':'Purchases and wages separately — the two levers you turn independently of each other.'} · ${esc(periodLabel())}</div>
      ${(()=>{const r=files.map(f=>{const a=aggFile(f,ms);
          return {f,buy:-(a.galley.a+a.purchase.a+a.consumer.a),pay:-(a.wages.a+a.otherpers.a),a};})
          .map(x=>({...x,tot:x.buy+x.pay})).sort((x,y)=>y.tot-x.tot);
        return multiBars(r.map(x=>({n:dName(x.f.key),c:dCol(x.f.key),
          rows:[

function vPL(){
  const ms=periodMonths(), files=activeFiles(), L=LANG;

  const showPY=isFullYTD();
  const blocks=files.map(f=>{
    const a=aggFile(f,ms), inc=a.income.a||1;
    const secRow=(sec)=>{
      const lines=sec.lines.map(l=>{
        const b=ref(l,ms)||0, x=pick(l,ms,1)||0, d=x-b;
        if(b===0&&x===0)return '';
        const py=showPY&&l.py?l.py.p:null;
        return `<tr>
         <td class="name"><span class="acct">${esc(l.acct)}</span>${esc(l.name)}${l.bridged?`<span class="tag" style="margin-left:6px">${t('bridged')} ${esc(l.bridged)}</span>`:''}</td>

         <td class="num mut">${b?pct(d/Math.abs(b)*100,0):'–'}</td>
         ${showPY?`<td class="num mut">${py!=null?fmt(py):'–'}</td>`:''}
         <td class="num mut">${(Math.abs(x)/inc*100).toFixed(1)}%</td>
         <td style="width:110px">${tape(ms,ms.map(m=>{const v=l.m[m];return v?(v[1]||0)-(v[0]||0):0;}),ms[ms.length-1])}</td>

        ${lines}
        <tr class="tot"><td>${esc(sec.total?sec.total.label:sec.name)}</td>

      <div style="display:flex;align-items:center;gap:9px;margin-bottom:3px">
        <span style="width:10px;height:10px;border-radius:3px;background:${dCol(f.key)}"></span>
        <h3 style="margin:0">${esc(dName(f.key))}</h3>

      <div class="tw"><table>

        ${showPY?`<th>${t('py')}</th>`:''}<th>${t('pctRev')}</th><th>${L==='da'?'Måned':'Month'}</th></tr></thead>
        <tbody>
          ${f.sections.map(secRow).join('')}
          <tr class="tot"><td>${t('gp')}</td><td class="num">${fmt(gpb)}</td><td class="num">${fmt(gpa)}</td>
            <td class="num ${gpa-gpb>=0?'up':'dn'}">${sgn(gpa-gpb)}${fmt(gpa-gpb)}</td>

        </tbody></table></div>

/* ---------- attention ---------- */
function vAlert(){
  const A=buildAlerts(), L=LANG, ms=periodMonths();
  const rows=accountRows(ms).filter(r=>!r.memo).sort((x,y)=>y.dev-x.dev);
  const wins=rows.slice(0,6).filter(r=>r.dev>0).map(r=>({n:`${dName(r.dept)} · ${r.name}`,v:r.dev}));
  const miss=rows.slice(-6).reverse().filter(r=>r.dev<0).map(r=>({n:`${dName(r.dept)} · ${r.name}`,v:r.dev}));

    <div class="card"><h3 class="up">${t('best')}${q('dev')}</h3>

    <div class="card"><h3 class="dn">${t('worst')}${q('dev')}</h3>
      <div class="sub">${L==='da'?'Konti der trækker mest ned.':'Accounts pulling hardest the other way.'}</div>
      ${miss.length?hbars(miss):'<div class="mut" style="font-size:12px">'+t('noData')+'</div>'}</div>

    <h3>${L==='da'?'Hvad der er værd at kigge på':'What is worth looking at'}</h3>
    <div class="sub">${L==='da'?'Automatisk gennemgang af hver konto i perioden: merforbrug, manglende omsætning, skæve måneder og skred over flere måneder.':'An automatic pass over every account in the period: overspend, missing revenue, odd months and multi-month drift.'} · ${esc(periodLabel())}</div>
    ${groups.map(([k,lbl])=>{const g=A.filter(x=>x.sev===k); if(!g.length)return '';

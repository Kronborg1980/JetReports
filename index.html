const px=v=>v==null||!isFinite(v)?0:Math.round(v);

function loadPptx(){
  return new Promise((res,rej)=>{
    if(window.PptxGenJS)return res(window.PptxGenJS);
    const go=(src,next)=>{
      const s=document.createElement('script'); s.src=src;
      s.onload=()=>window.PptxGenJS?res(window.PptxGenJS):(next?next():rej());
      s.onerror=()=>next?next():rej();
      document.head.appendChild(s);
    };
    go('./pptxgen.bundle.js',()=>go('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
      ()=>go('https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js',null)));
  });
}

async function exportPPT(){
  let P; toast(t('buildingP'));
  try{ P=await loadPptx(); }catch(e){ toast(t('pptFail')); return; }

  const ms=periodMonths(), lm=maxMonth(), allM=Array.from({length:lm+1},(_,i)=>i);
  const sh=shipTotal(ms); if(!sh){toast(t('noData'));return;}
  const a=sh.a, files=activeFiles(), L=LANG, RB=refShort();
  const cur=S.files[0]?S.files[0].currency:'DKK';
  const F=v=>px(v).toLocaleString('da-DK');
  const D=o=>o.a-o.b;
  const bd=deptBreakdown(ms);
  const brk={}; if(S.basis==='py') files.forEach(f=>{const b=pyBreak(f); if(b.items.length)brk[f.key]=b;});
  const cmpDev=d=>(d.hasRef?d.res-d.resRef:d.res)-(brk[d.key]?brk[d.key].amt:0);

  const p=new P();
  p.defineLayout({name:'SMYRIL',width:26.667,height:15});
  p.layout='SMYRIL';
  p.author='Smyril Line'; p.company='Smyril Line';
  p.title='JetReport Overview · MS Norröna · '+periodLabel();
  const FONT='Helvetica Neue';

  /* the two corner wedges and the badge, exactly where the house deck puts them */
  const wedges=(s,col)=>{
    s.addShape(p.ShapeType.parallelogram,{x:-13.45,y:-1.95,w:16.30,h:7.74,fill:{color:col||SL.navy},line:{width:0}});
    s.addShape(p.ShapeType.parallelogram,{x:22.83,y:5.66,w:16.30,h:7.74,fill:{color:col||SL.navy},line:{width:0}});
    s.addImage({data:BADGE,x:23.88,y:11.16,w:1.99,h:1.96});
  };
  const head=(s,title,sub)=>{
    wedges(s);
    s.addText(title,{x:2.40,y:1.18,w:19.5,h:1.5,fontSize:46,bold:true,color:SL.navy,fontFace:FONT});
    if(sub)s.addText(sub,{x:2.40,y:2.62,w:19.5,h:0.8,fontSize:20,color:SL.mute,fontFace:FONT});
  };
  const foot=s=>s.addText(`MS Norröna · ${periodLabel()} · ${L==='da'?'målt mod':'measured against'} ${RB}`,
    {x:2.40,y:13.75,w:18,h:0.6,fontSize:14,color:SL.mute,fontFace:FONT});

  /* ── 1 · forside ─────────────────────────────────────────────── */
  {
    const s=p.addSlide(); s.background={color:SL.navy};
    s.addShape(p.ShapeType.parallelogram,{x:-13.45,y:-1.95,w:16.30,h:7.74,fill:{color:SL.navy2},line:{width:0}});
    s.addShape(p.ShapeType.parallelogram,{x:22.83,y:5.66,w:16.30,h:7.74,fill:{color:SL.navy2},line:{width:0}});
    s.addImage({data:BADGE,x:12.33,y:2.60,w:2.60,h:2.56});
    s.addText('MS NORRÖNA',{x:4.31,y:6.10,w:18.05,h:0.8,fontSize:22,color:SL.gold,charSpacing:6,align:'center',fontFace:FONT});
    s.addText(L==='da'?'Månedstal':'Monthly figures',
      {x:4.31,y:6.95,w:18.05,h:1.9,fontSize:76,bold:true,color:'FFFFFF',align:'center',fontFace:FONT});
    s.addText(periodLabel(),{x:4.31,y:8.95,w:18.05,h:1.0,fontSize:34,color:'C8DEE9',align:'center',fontFace:FONT});
    const d=D(a.result), up=d>=0;
    s.addText([{text:(L==='da'?'Vi ligger ':'We are '),options:{color:'C8DEE9'}},
               {text:F(Math.abs(d))+' '+cur,options:{color:up?'6FE3B4':'FF9E99',bold:true}},
               {text:(L==='da'?(up?' bedre end ':' dårligere end '):(up?' better than ':' worse than '))+RB,options:{color:'C8DEE9'}}],
      {x:4.31,y:10.2,w:18.05,h:0.9,fontSize:28,align:'center',fontFace:FONT});
    s.addText(new Date().toLocaleDateString(L==='da'?'da-DK':'en-GB'),
      {x:4.31,y:13.2,w:18.05,h:0.6,fontSize:16,color:'6E93A8',align:'center',fontFace:FONT});
  }

  /* ── 2 · hovedtal ────────────────────────────────────────────── */
  {
    const s=p.addSlide();
    const d=D(a.result), gp=a.income.a?a.gp.a/a.income.a*100:0, gpR=a.income.b?a.gp.b/a.income.b*100:0;
    head(s, L==='da'?(d>=0?'Vi er foran budgettet':'Vi er bagud på budgettet').replace('budgettet',S.basis==='py'?'sidste år':'budgettet')
                    :(d>=0?'We are ahead':'We are behind'),
         L==='da'?`${scopeName()} · alle tal i ${cur}`:`${scopeName()} · all figures in ${cur}`);
    const noRev=!a.income.a&&!a.income.b;
    const cards=noRev?[
      [t('purchaseAll'),-(a.galley.a+a.purchase.a+a.consumer.a),-(D(a.galley)+D(a.purchase)+D(a.consumer)),-(a.galley.b+a.purchase.b+a.consumer.b)],
      [t('wagesAll'),-(a.wages.a+a.otherpers.a),-(D(a.wages)+D(a.otherpers)),-(a.wages.b+a.otherpers.b)],
      [t('result'),a.result.a,D(a.result),a.result.b],
      [t('pax'),a.pax.a,a.pax.a-a.pax.b,a.pax.b]
    ]:[
      [t('income'),a.income.a,D(a.income),a.income.b],
      [t('gp')+' · '+gp.toFixed(1)+'%',a.gp.a,D(a.gp),a.gp.b],
      [t('result'),a.result.a,D(a.result),a.result.b],
      [t('revpax'),a.pax.a?a.income.a/a.pax.a:0,
        (a.pax.a?a.income.a/a.pax.a:0)-(a.pax.b?a.income.b/a.pax.b:0),a.pax.b?a.income.b/a.pax.b:0]
    ];
    cards.forEach(([lbl,val,dv,ref],i)=>{
      const x=2.40+i*4.90;
      s.addShape(p.ShapeType.roundRect,{x,y:3.90,w:4.45,h:3.30,fill:{color:'F4F7F9'},line:{color:SL.hair,width:1},rectRadius:0.08});
      s.addText(String(lbl).toUpperCase(),{x:x+0.35,y:4.20,w:3.8,h:0.5,fontSize:14,color:SL.mute,bold:true,charSpacing:1.5,fontFace:FONT});
      s.addText(F(val),{x:x+0.35,y:4.75,w:3.8,h:1.0,fontSize:40,bold:true,color:SL.navy,fontFace:FONT});
      s.addText((dv>=0?'+':'-')+F(Math.abs(dv)),{x:x+0.35,y:5.80,w:3.8,h:0.5,fontSize:20,bold:true,color:dv>=0?SL.good:SL.bad,fontFace:FONT});
      s.addText(RB+' '+F(ref),{x:x+0.35,y:6.35,w:3.8,h:0.5,fontSize:15,color:SL.mute,fontFace:FONT});
    });
    if(bd.length) s.addChart(p.ChartType.bar,[{name:t('dev'),
        labels:bd.map(d2=>dName(d2.key)),values:bd.map(d2=>px(cmpDev(d2)))}],
      {x:2.40,y:7.70,w:19.6,h:5.4,barDir:'bar',showValue:true,valAxisHidden:true,
       chartColors:bd.map(d2=>cmpDev(d2)>=0?SL.good:SL.bad),varyColors:true,
       catAxisLabelFontSize:16,dataLabelFontSize:14,dataLabelColor:SL.ink,showLegend:false,
       catAxisLabelFontFace:FONT,dataLabelFontFace:FONT,
       title:(L==='da'?'Hvem trækker op, og hvem trækker ned — mod ':'Who pulls up and who pulls down — against ')+RB,
       showTitle:true,titleFontSize:18,titleColor:SL.mute,titleFontFace:FONT});
    foot(s);
  }

  /* ── 3 · hvad der driver tallet ──────────────────────────────── */
  {
    const s=p.addSlide();
    const rp=a.pax.a?a.income.a/a.pax.a:0, rpR=a.pax.b?a.income.b/a.pax.b:0;
    const paxEff=(a.pax.a-a.pax.b)*rpR, rateEff=(rp-rpR)*a.pax.a;
    head(s,L==='da'?'Hvad driver tallet':'What is driving the number',
      L==='da'?'Omsætningen flytter sig af to grunde: hvor mange der er om bord, og hvad hver enkelt bruger'
              :'Revenue moves for two reasons: how many are on board, and what each one spends');
    const rows=[
      [L==='da'?'Passagerer':'Passengers',a.pax.a,a.pax.b,a.pax.a-a.pax.b],
      [L==='da'?'Omsætning pr. passager':'Revenue per passenger',rp,rpR,rp-rpR],
      [L==='da'?'Heraf: flere eller færre passagerer':'Of which: more or fewer passengers',null,null,paxEff],
      [L==='da'?'Heraf: forbrug pr. passager':'Of which: spend per passenger',null,null,rateEff],
      [L==='da'?'Omsætning i alt':'Revenue in total',a.income.a,a.income.b,D(a.income)]
    ];
    s.addTable([[{text:'',options:{fill:{color:SL.navy}}},
                 {text:t('actual'),options:{bold:true,color:'FFFFFF',fill:{color:SL.navy}}},
                 {text:RB,options:{bold:true,color:'FFFFFF',fill:{color:SL.navy}}},
                 {text:t('dev'),options:{bold:true,color:'FFFFFF',fill:{color:SL.navy}}}]]
      .concat(rows.map((r,i)=>[
        {text:r[0],options:{align:'left',bold:i===4}},
        {text:r[1]==null?'':F(r[1]),options:{bold:i===4}},
        {text:r[2]==null?'':F(r[2]),options:{color:SL.mute}},
        {text:(r[3]>=0?'+':'-')+F(Math.abs(r[3])),options:{bold:true,color:r[3]>=0?SL.good:SL.bad}}])),
      {x:2.40,y:4.10,w:19.6,colW:[9.4,3.5,3.4,3.3],fontSize:19,fontFace:FONT,align:'right',
       border:{type:'solid',color:SL.hair,pt:0.5},rowH:0.62,color:SL.ink,valign:'middle'});
    s.addShape(p.ShapeType.roundRect,{x:2.40,y:9.10,w:19.6,h:2.4,fill:{color:'F4F7F9'},line:{color:SL.hair,width:1},rectRadius:0.06});
    s.addText(L==='da'
      ? (Math.abs(rateEff)>Math.abs(paxEff)
        ? `Det er forbruget pr. hoved der flytter tallet, ikke passagertallet. Hver gæst lægger ${F(Math.abs(rp-rpR))} kr. ${rp>=rpR?'mere':'mindre'} om bord end i ${RB}, og det alene er ${F(Math.abs(rateEff))}. Det er den knap vi selv kan skrue på.`
        : `Det er passagertallet der flytter tallet, ikke hvad den enkelte bruger. ${F(Math.abs(a.pax.a-a.pax.b))} ${a.pax.a>=a.pax.b?'flere':'færre'} gæster om bord er alene ${F(Math.abs(paxEff))}.`)
      : (Math.abs(rateEff)>Math.abs(paxEff)
        ? `Spend per head is moving the number, not passenger volume. Each guest spends ${F(Math.abs(rp-rpR))} ${rp>=rpR?'more':'less'} than ${RB}, worth ${F(Math.abs(rateEff))} on its own. That is the lever we control.`
        : `Passenger volume is moving the number, not spend per head. ${F(Math.abs(a.pax.a-a.pax.b))} ${a.pax.a>=a.pax.b?'more':'fewer'} guests on board is ${F(Math.abs(paxEff))} on its own.`),
      {x:2.85,y:9.40,w:18.7,h:1.9,fontSize:20,color:SL.ink,fontFace:FONT});
    foot(s);
  }

  /* ── 4 · afdelingerne ────────────────────────────────────────── */
  {
    const s=p.addSlide();
    head(s,L==='da'?'Hvem er foran, og hvem er bagud':'Who is ahead, and who is behind',
      L==='da'?'Omsætning, dækningsbidrag, indkøb, løn og bundlinje pr. afdeling':'Revenue, gross profit, purchases, wages and bottom line by department');
    const hasRef=bd.length&&bd[0].hasRef;
    const hd=[t('dept'),t('income'),t('gppct'),t('purchaseAll'),t('wagesAll'),t('result')].concat(hasRef?[RB,t('dev')]:[]);
    const rows=[hd.map((h,i)=>({text:h,options:{bold:true,color:'FFFFFF',fill:{color:SL.navy},fontSize:16,align:i?'right':'left'}}))];
    bd.forEach(d=>{
      const dv=hasRef?cmpDev(d):null;
      rows.push([{text:dName(d.key),options:{align:'left',bold:true}},
        {text:d.inc?F(d.inc):'–'},{text:d.inc?(d.gp/d.inc*100).toFixed(1)+'%':'–'},
        {text:F(d.buy)},{text:F(d.pay)},{text:F(d.res),options:{bold:true}}]
        .concat(hasRef?[{text:F(d.resRef),options:{color:SL.mute}},
          {text:(dv>=0?'+':'-')+F(Math.abs(dv)),options:{bold:true,color:dv>=0?SL.good:SL.bad}}]:[]));
    });
    const T=bd.reduce((x,d)=>({inc:x.inc+d.inc,buy:x.buy+d.buy,pay:x.pay+d.pay,gp:x.gp+d.gp,res:x.res+d.res,
      ref:x.ref+(d.resRef||0)}),{inc:0,buy:0,pay:0,gp:0,res:0,ref:0});
    rows.push([{text:scopeName(),options:{align:'left',bold:true}},
      {text:F(T.inc),options:{bold:true}},{text:T.inc?(T.gp/T.inc*100).toFixed(1)+'%':'–',options:{bold:true}},
      {text:F(T.buy),options:{bold:true}},{text:F(T.pay),options:{bold:true}},{text:F(T.res),options:{bold:true}}]
      .concat(hasRef?[{text:F(T.ref),options:{bold:true}},
        {text:((T.res-T.ref)>=0?'+':'-')+F(Math.abs(T.res-T.ref)),options:{bold:true,color:(T.res-T.ref)>=0?SL.good:SL.bad}}]:[])
      .map(c=>({...c,options:{...c.options,fill:{color:'E8EFF3'}}})));
    s.addTable(rows,{x:2.40,y:4.10,w:19.6,
      colW:hasRef?[4.6,2.5,1.7,2.5,2.3,2.5,2.3,1.2]:[6.6,3.4,2.2,3.0,2.4,2.0],
      fontSize:17,fontFace:FONT,align:'right',valign:'middle',
      border:{type:'solid',color:SL.hair,pt:0.5},rowH:0.66,color:SL.ink});
    let y=4.30+ (rows.length*0.70);
    if(S.basis==='py'&&Object.keys(brk).length){
      const tot=sum(Object.values(brk).map(b=>b.amt));
      s.addShape(p.ShapeType.roundRect,{x:2.40,y:Math.min(y,11.2),w:19.6,h:1.9,fill:{color:'FFF6E6'},line:{color:SL.gold,width:1},rectRadius:0.06});
      s.addText(L==='da'
        ? `Pas på med den direkte sammenligning: ${F(Math.abs(tot))} af forskellen mod sidste år kommer fra konti der kun findes i det ene af de to år — først og fremmest kabyssens vareforbrug, der ligger under Bar/Restaurant i år og ikke sidste år. Afvigelsen i tabellen er renset for det.`
        : `Treat the direct comparison with care: ${F(Math.abs(tot))} of the difference against last year comes from accounts present in only one of the two years — above all the galley cost of goods, inside Bar/Restaurant this year and not last. The deviation column is adjusted for it.`,
        {x:2.85,y:Math.min(y,11.2)+0.25,w:18.7,h:1.5,fontSize:17,color:SL.ink,fontFace:FONT});
    } else if(bd.length&&bd[0].fromLedger){
      s.addText(L==='da'
        ? 'Opdelingen er regnet ud af posteringerne i totalfilen, hvor hver postering bærer sin afdelingskode. Der er ingen afdelingsbudgetter i den fil, så der er intet at måle op imod.'
        : 'The split is worked out from the entries in the all-ship file, where every entry carries its department code. That file holds no department budgets, so there is nothing to measure against.',
        {x:2.40,y:Math.min(y,12.2),w:19.6,h:1.0,fontSize:16,color:SL.mute,fontFace:FONT});
    }
    foot(s);
  }

  /* ── 5 · måned for måned ─────────────────────────────────────── */
  {
    const s=p.addSlide();
    head(s,L==='da'?'Måned for måned':'Month by month',
      L==='da'?'Omsætning og bundlinje hen over året':'Revenue and bottom line across the year');
    const src=S.files.find(f=>f.combined)&&!S.sel.size?[S.files.find(f=>f.combined)]:files;
    const ser=k=>allM.map(m=>{let b=0,x=0;src.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m];if(v){b+=v[0]||0;x+=v[1]||0;}});return [b,x];});
    const inc=ser('income'), res=ser('result'), lab=allM.map(m=>t('mshort')[m]);
    const mk=(dat,x,col,ttl)=>s.addChart(p.ChartType.bar,dat,{x,y:4.10,w:9.5,h:8.6,barDir:'col',
      chartColors:[col,'C3D4DC'],showLegend:true,legendPos:'b',legendFontSize:15,legendFontFace:FONT,
      catAxisLabelFontSize:15,valAxisLabelFontSize:15,catAxisLabelFontFace:FONT,valAxisLabelFontFace:FONT,
      showTitle:true,titleFontSize:19,title:ttl,titleColor:SL.mute,titleFontFace:FONT});
    const d1=[{name:t('actual'),labels:lab,values:inc.map(v=>px(v[1]))}];
    if(hasMonthlyRef())d1.push({name:RB,labels:lab,values:inc.map(v=>px(v[0]))});
    mk(d1,2.40,SL.blue,t('income'));
    const d2=[{name:t('actual'),labels:lab,values:res.map(v=>px(v[1]))}];
    if(hasMonthlyRef())d2.push({name:RB,labels:lab,values:res.map(v=>px(v[0]))});
    mk(d2,12.50,SL.navy,t('result'));
    foot(s);
  }

  /* ── 6 · til beslutning ──────────────────────────────────────── */
  {
    const s=p.addSlide();
    const A=buildAlerts().filter(x=>x.cat!=='bridge').slice(0,7);
    head(s,L==='da'?'Det vi skal tage stilling til':'What we need to decide on',
      L==='da'?'De største afvigelser i perioden, sorteret efter beløb':'The largest deviations in the period, by amount');
    if(!A.length)s.addText(L==='da'?'Der er ikke noget der stikker ud.':'Nothing stands out.',
      {x:2.40,y:6.5,w:19.6,h:1,fontSize:26,color:SL.mute,align:'center',fontFace:FONT});
    A.forEach((x,i)=>{
      const y=4.10+i*1.28, c=x.amt>0?SL.good:x.amt<0?SL.bad:SL.mute;
      s.addShape(p.ShapeType.rect,{x:2.40,y,w:0.10,h:1.05,fill:{color:c},line:{width:0}});
      s.addText(x.title,{x:2.75,y:y-0.02,w:15.6,h:0.5,fontSize:20,bold:true,color:SL.navy,fontFace:FONT});
      s.addText(x.body,{x:2.75,y:y+0.48,w:16.4,h:0.6,fontSize:14.5,color:SL.mute,fontFace:FONT});
      if(x.amt)s.addText((x.amt>0?'+':'-')+F(Math.abs(x.amt)),
        {x:19.2,y:y+0.15,w:2.8,h:0.6,fontSize:24,bold:true,color:c,align:'right',fontFace:FONT});
    });
    foot(s);
  }

  /* ── 7 · datakontrol ─────────────────────────────────────────── */
  {
    const C=dataChecks().filter(x=>x.sev==='high'||x.sev==='med').slice(0,7);
    const s=p.addSlide();
    head(s,L==='da'?'Er tallene til at stole på':'Can the figures be trusted',
      L==='da'?'Fejl og huller i selve bogføringen — ikke resultatet':'Errors and gaps in the bookkeeping itself — not performance');
    if(!C.length)s.addText(L==='da'?'Datakontrollen har ikke fundet noget der ser forkert ud.':'The data check found nothing that looks wrong.',
      {x:2.40,y:6.5,w:19.6,h:1,fontSize:26,color:SL.mute,align:'center',fontFace:FONT});
    C.forEach((x,i)=>{
      const y=4.10+i*1.28, c=x.sev==='high'?SL.bad:SL.gold;
      s.addShape(p.ShapeType.rect,{x:2.40,y,w:0.10,h:1.05,fill:{color:c},line:{width:0}});
      s.addText((CHKCAT[x.cat]?(CHKCAT[x.cat][L]||CHKCAT[x.cat].en):'')+' — '+x.title,
        {x:2.75,y:y-0.02,w:19,h:0.5,fontSize:20,bold:true,color:SL.navy,fontFace:FONT});
      s.addText(x.body,{x:2.75,y:y+0.48,w:19,h:0.6,fontSize:14.5,color:SL.mute,fontFace:FONT});
    });
    foot(s);
  }

  /* ── 8 · prognose ────────────────────────────────────────────── */
  {
    const s=p.addSlide();
    head(s,L==='da'?'Sådan lander året':'Where the year lands',
      L==='da'?'År til dato skaleret op efter skibets normale passagerkurve':'Year to date scaled up on the ship\u2019s usual passenger curve');
    const src=S.files.find(f=>f.combined)&&!S.sel.size?[S.files.find(f=>f.combined)]:files;
    const tot=k=>{let x=0;src.forEach(f=>allM.forEach(m=>{const v=f.kpi[k]&&f.kpi[k].m[m];if(v)x+=v[1]||0;}));return x;};
    const w=[0.028,0.022,0.055,0.085,0.105,0.155,0.205,0.155,0.075,0.045,0.032,0.038];
    const done=w.slice(0,lm+1).reduce((x,y)=>x+y,0);
    const incY=tot('income'), resY=tot('result'), gpY=tot('income')+tot('galley')+tot('purchase');
    const rows=[[{text:'',options:{fill:{color:SL.navy}}},
      {text:t('ytd'),options:{bold:true,color:'FFFFFF',fill:{color:SL.navy}}},
      {text:L==='da'?'Fuldt år':'Full year',options:{bold:true,color:'FFFFFF',fill:{color:SL.navy}}}]];
    [[t('income'),incY],[t('gp'),gpY],[t('result'),resY]].forEach(([l,v])=>
      rows.push([{text:l,options:{align:'left'}},{text:F(v)},{text:F(done>0?v/done:0),options:{bold:true}}]));
    s.addTable(rows,{x:2.40,y:4.10,w:9.2,colW:[4.2,2.5,2.5],fontSize:19,fontFace:FONT,align:'right',
      border:{type:'solid',color:SL.hair,pt:0.5},rowH:0.70,color:SL.ink,valign:'middle'});
    s.addText(L==='da'
      ? 'JetReports leverer kun budget for de måneder der er lukket, så der er intet helårsbudget at holde det op imod. Fremskrivningen bygger alene på det der faktisk er bogført, fordelt efter hvordan passagererne plejer at ligge hen over året.'
      : 'JetReports only carries budget for the months that are closed, so there is no full-year budget to hold it against. The projection is built purely on what has been booked, spread the way passengers usually fall across the year.',
      {x:2.40,y:7.60,w:9.2,h:3,fontSize:16,color:SL.mute,fontFace:FONT});
    s.addChart(p.ChartType.line,[{name:L==='da'?'Bundlinje, opsummeret':'Bottom line, cumulative',
      labels:MON_EN.map((_,i)=>t('mshort')[i]),
      values:(()=>{let c=0;return MON_EN.map((_,m)=>{
        const v=m<=lm?(()=>{let x=0;src.forEach(f=>{const q=f.kpi.result&&f.kpi.result.m[m];if(q)x+=q[1]||0;});return x;})()
                     :(done>0?resY/done*w[m]:0);
        return px(c+=v);});})()}],
      {x:12.20,y:4.10,w:9.8,h:8.4,chartColors:[SL.blue],lineSize:4,showLegend:false,
       catAxisLabelFontSize:15,valAxisLabelFontSize:15,catAxisLabelFontFace:FONT,valAxisLabelFontFace:FONT,
       showTitle:true,titleFontSize:19,title:(L==='da'?'Bundlinje, opsummeret':'Bottom line, cumulative'),
       titleColor:SL.mute,titleFontFace:FONT});
    foot(s);
  }

  /* ── 9 · noter ───────────────────────────────────────────────── */
  {
    const s=p.addSlide();
    head(s,L==='da'?'Noter til tallene':'Notes on the figures',
      L==='da'?'Så de bliver læst rigtigt':'So they are read correctly');
    const n=[];
    n.push([L==='da'?'Hvad vi måler op imod':'What we measure against',
      L==='da'?`Alle afvigelser er målt mod ${RB}.`:`Every deviation is measured against ${RB}.`]);
    n.push([L==='da'?'Skib i alt':'Ship total', sh.src==='file'
      ? (L==='da'?'Taget direkte fra totalfilen, ikke lagt sammen af afdelingerne.':'Taken straight from the all-ship file, not added up from the departments.')
      : (L==='da'?'Lagt sammen af afdelingsfilerne. Kabyssens vareforbrug tælles kun én gang.':'Added up from the department files. The galley cost of goods is counted once only.')]);
    bridgeInfo().forEach(x=>n.push([L==='da'?'Kabysbudgettet':'The galley budget',
      L==='da'?`Budgettet på ${F(Math.abs(x.b))} står i ${dName(x.from)}, mens udgiften bogføres i ${dName(x.to)}. Vi har flyttet det, så afvigelsen bliver retvisende.`
              :`The ${F(Math.abs(x.b))} budget sits in ${dName(x.from)} while the cost is booked in ${dName(x.to)}. We have moved it so the deviation reads true.`]));
    if(S.basis==='py') n.push([L==='da'?'Sidste år':'Last year',
      L==='da'?'JetReports leverer kun sidste år som år til dato, derfor er perioden år til dato.':'JetReports only delivers last year as year to date, so the period is year to date.']);
    n.push([L==='da'?'Kilde':'Source', S.files.map(f=>f.fileName).join('   ·   ')]);
    n.forEach(([h,b],i)=>{
      const y=4.10+i*1.55;
      s.addText(h,{x:2.40,y,w:19.6,h:0.5,fontSize:21,bold:true,color:SL.navy,fontFace:FONT});
      s.addText(b,{x:2.40,y:y+0.52,w:19.6,h:0.9,fontSize:16,color:SL.mute,fontFace:FONT});
    });
    foot(s);
  }

  /* ── 10 · takk fyri ──────────────────────────────────────────── */
  {
    const s=p.addSlide(); s.background={color:SL.navy};
    s.addShape(p.ShapeType.parallelogram,{x:-13.45,y:-1.95,w:16.30,h:7.74,fill:{color:SL.navy2},line:{width:0}});
    s.addShape(p.ShapeType.parallelogram,{x:22.83,y:5.66,w:16.30,h:7.74,fill:{color:SL.navy2},line:{width:0}});
    s.addImage({data:BADGE,x:12.33,y:4.20,w:2.60,h:2.56});
    s.addText('Takk fyri',{x:4.31,y:7.60,w:18.05,h:1.9,fontSize:76,bold:true,color:'FFFFFF',align:'center',fontFace:FONT});
    s.addText('MS Norröna · '+periodLabel(),{x:4.31,y:9.70,w:18.05,h:0.9,fontSize:24,color:SL.gold,align:'center',fontFace:FONT});
  }

  const per=periodMonths().length===1?t('mshort')[periodMonths()[0]]:'YTD';
  await p.writeFile({fileName:`Norrona_JetReport_${S.files[0]?S.files[0].year:''}_${per}.pptx`});
  toast(t('pptDone'));
}

render();
</script>
</body>
</html>

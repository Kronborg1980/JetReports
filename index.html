      ||`<div class="empty">${L==='da'?'Ingenting stikker ud i perioden.':'Nothing stands out in the period.'}</div>`}
  </div>`;
}

/* ---------- forecast ---------- */
function vFC(){
  const lm=maxMonth(), L=LANG, allM=Array.from({length:lm+1},(_,i)=>i);
  const files=activeFiles(); const src=S.files.find(f=>f.combined);
  const use=src?[src]:files;
  const ser=k=>Array.from({length:12},(_,m)=>{let b=0,a=0;use.forEach(f=>{const v=f.kpi[k]&&f.kpi[k].m[m];if(v){b+=v[0]||0;a+=v[1]||0;}});return [b,a];});
  const res=ser('result'), inc=ser('income'), gpS=Array.from({length:12},(_,m)=>{
    let b=0,a=0; ['income','galley','purchase'].forEach(k=>use.forEach(f=>{
      const v=f.kpi[k]&&f.kpi[k].m[m]; if(v){b+=v[0]||0;a+=v[1]||0;}})); return [b,a];});
  const paxA=Array.from({length:12},(_,m)=>{const v=use[0].pax&&use[0].pax.m[m];return v?v[1]||0:0;});
  const ytdA=sum(res.slice(0,lm+1).map(v=>v[1])), ytdB=sum(res.slice(0,lm+1).map(v=>v[0]));
  const incA=sum(inc.slice(0,lm+1).map(v=>v[1])), incB=sum(inc.slice(0,lm+1).map(v=>v[0]));
  const gpA =sum(gpS.slice(0,lm+1).map(v=>v[1]));
  // seasonal weights from the passenger curve where we have it, otherwise flat
  const paxYear=[0.028,0.022,0.055,0.085,0.105,0.155,0.205,0.155,0.075,0.045,0.032,0.038];
  const doneW=sum(paxYear.slice(0,lm+1));
  const projSeason=doneW>0?ytdA/doneW:null;
  const projRun=ytdA/(lm+1)*12;
  const fut=Array.from({length:12},(_,m)=>m<=lm?res[m][1]:(projSeason!=null?projSeason*paxYear[m]:projRun/12));
  const projInc=doneW>0?incA/doneW:null, projGP=doneW>0?gpA/doneW:null;
  const futI=Array.from({length:12},(_,m)=>m<=lm?inc[m][1]:(projInc!=null?projInc*paxYear[m]:0));
  let ci=0; const cumFI=futI.map(v=>ci+=v);
  let cbi=0; const cumAI=Array.from({length:12},(_,m)=>m<=lm?(cbi+=inc[m][1]):null);
  let c=0; const cumF=fut.map(v=>c+=v);
  let cb=0; const cumA=Array.from({length:12},(_,m)=>m<=lm?(cb+=res[m][1]):null);
  return `
  <div class="grid g3" style="margin-bottom:12px">
    ${kpiCard({label:L==='da'?'År til dato, omsætning':'Revenue year to date',val:incA,bud:incB,
      plain:L==='da'?`De første ${lm+1} måneder. Dækningsbidrag ${incA?(gpA/incA*100).toFixed(1)+'%':'–'}.`:`The first ${lm+1} months. Gross profit ${incA?(gpA/incA*100).toFixed(1)+'%':'–'}.`})}
    ${kpiCard({label:L==='da'?'Fuldt år, omsætning':'Full year, revenue',q:'season',val:projInc,bud:null,noBud:true,
      plain:L==='da'?'Sæsonvægtet fremskrivning. Juli og august vejer tungest.':'Season-weighted projection. July and August carry most weight.'})}
    ${kpiCard({label:L==='da'?'Fuldt år, dækningsbidrag':'Full year, gross profit',q:'gp',val:projGP,bud:null,noBud:true,
      plain:L==='da'?'Samme fremskrivning på dækningsbidraget.':'The same projection applied to gross profit.'})}
  </div>
  <div class="grid g3" style="margin-bottom:12px">
    ${kpiCard({label:L==='da'?'År til dato, resultat':'Result year to date',val:ytdA,bud:ytdB,
      plain:L==='da'?`De første ${lm+1} måneder.`:`The first ${lm+1} months.`})}
    ${kpiCard({label:L==='da'?'Fuldt år, sæsonvægtet':'Full year, season-weighted',q:'season',val:projSeason,bud:null,noBud:true,
      plain:L==='da'?'År til dato skaleret op efter skibets normale passagerkurve — juli og august vejer tungt.':'Year to date scaled up on the ship\'s usual passenger curve — July and August carry most of the weight.'})}
    ${kpiCard({label:L==='da'?'Fuldt år, lige fordelt':'Full year, flat run-rate',q:'runrate',val:projRun,bud:null,noBud:true,
      plain:L==='da'?'Samme resultat hver måned resten af året. Konservativt for et sæsonskib.':'Same result every month for the rest of the year. Conservative for a seasonal ship.'})}
  </div>
  <div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Hvor omsætningen lander':'Where revenue lands'}</h3>
    <div class="sub">${L==='da'?'Opsummeret omsætning. Fast linje = bogført, stiplet = fremskrevet.':'Cumulative revenue. Solid = booked, dashed = projected.'}</div>
    <div class="chartbox">${lineChart(Array.from({length:12},(_,i)=>i),[
      {n:t('projected'),v:cumFI,c:'var(--warn)',dash:1},
      {n:t('actual'),v:cumAI,c:'var(--good)',area:1,w:2.6}],200)}</div>
    ${monthTable(Array.from({length:12},(_,i)=>i),[
      {h:t('income'),v:futI,cls:(v,i)=>i>lm?'mut':''},
      {h:L==='da'?'Opsummeret':'Cumulative',v:cumFI,cls:(v,i)=>i>lm?'mut':''},
      {h:t('result'),v:fut,cls:(v,i)=>i>lm?'mut':''},
      {h:L==='da'?'Bogført?':'Booked?',v:Array.from({length:12},(_,i)=>i),
       f:v=>v<=lm?'✓':(L==='da'?'fremskrevet':'projected'),cls:v=>v<=lm?'up':'mut'},
    ])}
  </div>
  <div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Hvor bundlinjen lander':'Where the bottom line lands'}</h3>
    <div class="sub">${L==='da'?'Fast linje = bogført. Stiplet = fremskrivning efter passagerkurven.':'Solid = booked. Dashed = projected on the passenger curve.'}</div>
    <div class="chartbox">${lineChart(Array.from({length:12},(_,i)=>i),[
      {n:L==='da'?'Fremskrevet':'Projected',v:cumF,c:'var(--warn)',dash:1},
      {n:t('actual'),v:cumA,c:'var(--accent)',area:1,w:2.6}],200)}</div>
    <div class="hint">${L==='da'
      ?'JetReports-udtrækket indeholder kun budget for de måneder der er lukket, så der er ikke noget helårsbudget at måle op imod her. Fremskrivningen bygger udelukkende på det der faktisk er bogført.'
      :'The JetReports extract only carries budget for the months that are closed, so there is no full-year budget to measure against here. The projection is built purely on what has actually been booked.'}</div>
  </div>
  <div class="card">
    <h3>${L==='da'?'Afdeling for afdeling':'Department by department'}</h3>
    <div class="sub">${L==='da'?'Omsætning og resultat år til dato, og hvad det bliver til på et helt år.':'Revenue and result year to date, and what that becomes across a full year.'}</div>
    <div class="tw"><table><thead><tr><th>${t('dept')}</th>
      <th>${t('income')} ${t('ytd')}</th><th>${t('gppct')}</th>
      <th>${t('result')} ${t('ytd')}</th><th>${refLabel()}</th><th>${t('dev')}</th>
      <th>${t('projected')} ${t('income')}</th><th>${t('projected')} ${t('result')}</th></tr></thead><tbody>
      ${files.map(f=>{const A=aggFile(f,allM);
        const pr=doneW>0?A.result.a/doneW:null, pi=doneW>0?A.income.a/doneW:null;
        return `<tr><td class="name"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${dCol(f.key)};margin-right:8px"></span>${esc(dName(f.key))}</td>
        <td class="num">${A.income.a?fmt(A.income.a):'–'}</td>
        <td class="num mut">${A.income.a?(A.gp.a/A.income.a*100).toFixed(1)+'%':'–'}</td>
        <td class="num">${fmt(A.result.a)}</td><td class="num mut">${fmt(A.result.b)}</td>
        <td class="num ${A.result.a-A.result.b>=0?'up':'dn'}">${sgn(A.result.a-A.result.b)}${fmt(A.result.a-A.result.b)}</td>
        <td class="num">${A.income.a?fmt(pi):'–'}</td>
        <td class="num"><b>${fmt(pr)}</b></td></tr>`;}).join('')}
      ${(()=>{const T=files.reduce((s,f)=>{const A=aggFile(f,allM);return {i:s.i+A.income.a,r:s.r+A.result.a,rb:s.rb+A.result.b};},{i:0,r:0,rb:0});
        return `<tr class="grand"><td>${t('total')}</td><td class="num">${fmt(T.i)}</td><td></td>
          <td class="num">${fmt(T.r)}</td><td class="num">${fmt(T.rb)}</td>
          <td class="num ${T.r-T.rb>=0?'up':'dn'}">${sgn(T.r-T.rb)}${fmt(T.r-T.rb)}</td>
          <td class="num">${fmt(doneW>0?T.i/doneW:null)}</td><td class="num"><b>${fmt(doneW>0?T.r/doneW:null)}</b></td></tr>`;})()}
    </tbody></table></div>
  </div>`;
}

/* ---------- reconcile ---------- */
function vRec(){
  const ms=periodMonths(), L=LANG;
  const all=S.files.find(f=>f.combined), deps=activeFiles();
  const versions=S.shadow;
  let body='';
  if(all&&deps.length){
    const A={}, B={};
    const grab=(f,tgt)=>f.sections.forEach(s=>s.lines.forEach(l=>{
      const k=l.acct; tgt[k]=tgt[k]||{name:l.name,v:0,src:[]};
      tgt[k].v+=pick(l,ms,1)||0; if(!tgt[k].src.includes(f.key))tgt[k].src.push(f.key);}));
    grab(all,A); deps.forEach(f=>grab(f,B));
    const keys=[...new Set([...Object.keys(A),...Object.keys(B)])];
    const diff=keys.map(k=>({acct:k,name:(A[k]||B[k]).name,a:A[k]?A[k].v:0,b:B[k]?B[k].v:0,src:(B[k]||{src:[]}).src}))
      .map(x=>({...x,d:x.a-x.b})).filter(x=>Math.abs(x.d)>1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
    const tot=sum(diff.map(x=>x.d));
    body=`<div class="card" style="margin-bottom:12px">
      <h3>${L==='da'?'Totalfil mod summen af afdelinger':'All-ship file against the sum of departments'}</h3>
      <div class="sub">${L==='da'?'De to skal ikke nødvendigvis være ens. Her står præcis hvorfor de ikke er det. Sammenligningen bruger faktiske tal — budgetflytningen ovenfor rører dem ikke.':'The two need not match. Here is exactly why they do not. The comparison uses actuals — the budget move above does not touch them.'} · ${esc(periodLabel())}</div>
      <div class="grid g3" style="margin-bottom:12px">
        <div class="card" style="padding:12px"><div class="eyebrow">${L==='da'?'Totalfil':'All-ship file'}</div>
          <div class="num" style="font-size:20px;font-weight:800">${fmt(aggFile(all,ms).result.a)}</div></div>
        <div class="card" style="padding:12px"><div class="eyebrow">${L==='da'?'Sum af afdelinger':'Sum of departments'}</div>
          <div class="num" style="font-size:20px;font-weight:800">${fmt(sum(deps.map(f=>aggFile(f,ms).result.a)))}</div></div>
        <div class="card" style="padding:12px"><div class="eyebrow">${t('dev')}</div>
          <div class="num ${tot>=0?'up':'dn'}" style="font-size:20px;font-weight:800">${sgn(tot)}${fmt(tot)}</div></div>
      </div>
      <div class="tw"><table><thead><tr><th>${t('acct')}</th><th>${L==='da'?'Totalfil':'All-ship'}</th><th>${L==='da'?'Afdelinger':'Departments'}</th><th>${t('dev')}</th><th>${L==='da'?'Forklaring':'Explanation'}</th></tr></thead><tbody>
        ${diff.map(x=>{
          let why=L==='da'?'Konto findes kun i den ene fil.':'Account only appears in one of the files.';
          if(x.src.length>1) why=L==='da'?`Talt med i både ${x.src.map(dName).join(' og ')} — kabyssens vareforbrug står også under F&B for at kunne vise dækningsbidrag.`:`Counted in both ${x.src.map(dName).join(' and ')} — the galley cost also sits under F&B so gross profit can be shown.`;
          else if(!x.b) why=L==='da'?'Kun i totalfilen — ikke lagt ud på en afdeling.':'Only in the all-ship file — not pushed out to a department.';
          else if(!x.a) why=L==='da'?'Kun i afdelingsfilen — ikke med i totalens kontoskema.':'Only in the department file — not part of the all-ship account schedule.';
          return `<tr><td class="name"><span class="acct">${esc(x.acct)}</span>${esc(x.name)}</td>
            <td class="num mut">${fmt(x.a)}</td><td class="num mut">${fmt(x.b)}</td>
            <td class="num ${x.d>=0?'up':'dn'}"><b>${sgn(x.d)}${fmt(x.d)}</b></td>
            <td class="name" style="text-align:left;white-space:normal;max-width:340px;font-size:11px;color:var(--muted)">${esc(why)}</td></tr>`;}).join('')
          ||`<tr><td colspan="5" class="mut" style="text-align:center;padding:26px">${L==='da'?'Ingen forskelle.':'No differences.'}</td></tr>`}
      </tbody></table></div></div>`;
  } else {
    body=`<div class="card"><div class="empty">${L==='da'?'Læg både totalfilen og afdelingsfilerne ind for at afstemme dem mod hinanden.':'Load both the all-ship file and the department files to reconcile them against each other.'}</div></div>`;
  }
  const bi=bridgeInfo();
  if(bi.length){
    body+=`<div class="card" style="margin-bottom:12px">
      <h3>${t('bridgeH')}${q('bridge')}</h3>
      <div class="sub">${L==='da'
        ?'JetReports lægger nogle budgetter i én afdelings rapport og selve udgiften i en anden. Her står hvad der er flyttet, og hvad det betyder for de to afdelinger.'
        :'JetReports puts some budgets in one department report and the cost itself in another. Here is what has been moved, and what it does to the two departments.'}</div>
      <div class="tw"><table><thead><tr><th>${t('acct')}</th><th>${L==='da'?'Budget står i':'Budget sits in'}</th><th>${L==='da'?'Udgift bogføres i':'Cost booked in'}</th><th>${refLabel()}</th></tr></thead><tbody>
      ${bi.map(x=>`<tr><td class="name"><span class="acct">${esc(x.acct)}</span>${esc(x.name)}</td>
        <td>${esc(dName(x.from))}</td><td>${esc(dName(x.to))}</td><td class="num">${fmt(x.b)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="hint">${L==='da'
        ?'Er knappen i toppen slået fra, vises tallene præcis som JetReports leverer dem — og så ser kabyssen ud til at mangle budget for sin største udgiftspost.'
        :'With the button at the top switched off the figures show exactly as JetReports delivers them — and the galley then looks like it has no budget for its largest cost line.'}</div>
    </div>`;
  }

  // internal check: months vs the report's own YTD column
  const chk=S.files.map(f=>{
    const ms2=Array.from({length:f.lastM+1},(_,i)=>i);
    const a=aggFile(f,ms2), y=f.kpi.result.ytd;
    return {f,calc:a.result.a,rep:y?y.a:null,d:y?a.result.a-(y.a||0):null};
  });
  body+=`<div class="card" style="margin-bottom:12px">
    <h3>${L==='da'?'Kontrol af indlæsningen':'Read-in check'}</h3>
    <div class="sub">${L==='da'?'Månederne lagt sammen skal ramme rapportens egen år-til-dato-kolonne præcist.':'The months added together should hit the report\'s own year-to-date column exactly.'}</div>
    <div class="tw"><table><thead><tr><th>${L==='da'?'Fil':'File'}</th><th>${L==='da'?'Måneder lagt sammen':'Months added up'}</th><th>${L==='da'?'Rapportens ÅTD':'Report YTD'}</th><th>${t('dev')}</th></tr></thead><tbody>
      ${chk.map(c=>`<tr><td class="name">${esc(dName(c.f.key))} ${c.f.combined?'<span class="tag">total</span>':''}<div style="font-size:9.5px;color:var(--muted)">${esc(c.f.fileName)}</div></td>
        <td class="num">${fmtFull(c.calc)}</td><td class="num">${c.rep!=null?fmtFull(c.rep):'–'}</td>
        <td class="num ${Math.abs(c.d||0)<2?'up':'dn'}">${Math.abs(c.d||0)<2?'✓ 0':sgn(c.d)+fmtFull(c.d)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  if(versions.length){
    body+=`<div class="card"><h3>${L==='da'?'Tidligere udtræk':'Earlier extracts'}</h3>
      <div class="sub">${L==='da'?'Filer der er blevet erstattet af et nyere udtræk. Skifter et tal her, er noget efterposteret.':'Files replaced by a newer extract. If a figure moves here, something was posted after the fact.'}</div>
      <div class="tw"><table><thead><tr><th>${L==='da'?'Fil':'File'}</th><th>${L==='da'?'Måned':'Month'}</th><th>${L==='da'?'Dengang':'Then'}</th><th>${L==='da'?'Nu':'Now'}</th><th>${t('dev')}</th></tr></thead><tbody>
      ${versions.map(v=>{const now=S.files.find(f=>f.key===v.key&&f.year===v.year);
        const o=v.kpi.result.ytd, n=now&&now.kpi.result?aggFile(now,Array.from({length:v.lastM+1},(_,i)=>i)).result.a:null;
        return `<tr><td class="name">${esc(v.fileName)}</td><td>${esc(t('mshort')[v.lastM])}</td>
          <td class="num mut">${o?fmtFull(o.a):'–'}</td><td class="num">${n!=null?fmtFull(n):'–'}</td>
          <td class="num ${n!=null&&o&&Math.abs(n-o.a)<2?'up':'dn'}">${n!=null&&o?sgn(n-o.a)+fmtFull(n-o.a):'–'}</td></tr>`;}).join('')}
      </tbody></table></div></div>`;
  }
  return body;
}
/* ---------- report ---------- */
function narrative(){
  const ms=periodMonths(), sh=shipTotal(ms), L=LANG;
  if(!sh)return '';
  const a=sh.a, per=periodLabel(), RB=refShort(), cur=sh.f?sh.f.currency:'DKK';
  const dev=a.result.a-a.result.b;
  const gp=a.income.a?a.gp.a/a.income.a*100:null, gpR=a.income.b?a.gp.b/a.income.b*100:null;
  const rp=a.pax.a?a.income.a/a.pax.a:0, rpR=a.pax.b?a.income.b/a.pax.b:0;
  const buy=-(a.galley.a+a.purchase.a+a.consumer.a), buyR=-(a.galley.b+a.purchase.b+a.consumer.b);
  const pay=-(a.wages.a+a.otherpers.a), payR=-(a.wages.b+a.otherpers.b);
  const wPct=a.income.a?pay/a.income.a*100:null, wPctR=a.income.b?payR/a.income.b*100:null;
  /* Revenue moves for two separate reasons: more or fewer people on board, and
     each of them spending more or less. Splitting the two is the most useful
     thing this summary can say. The two parts add back to the whole deviation. */
  const paxEff=(a.pax.a-a.pax.b)*rpR, rateEff=(rp-rpR)*a.pax.a;
  /* Against last year, a department can look far worse purely because an
     account exists in one year and not the other. Work out that piece and
     report the comparable figure alongside the raw one. */
  const brk={}; if(S.basis==='py') activeFiles().forEach(f=>{const b=pyBreak(f); if(b.items.length)brk[f.key]=b;});
  const brkTot=sum(Object.values(brk).map(b=>b.amt));
  const bd=deptBreakdown(ms).slice().sort((x,y)=>{
    const dx=(x.hasRef?x.res-x.resRef:x.res)-(brk[x.key]?brk[x.key].amt:0);
    const dy=(y.hasRef?y.res-y.resRef:y.res)-(brk[y.key]?brk[y.key].amt:0);
    return dy-dx;});
  const cmpDev=d=>(d.hasRef?d.res-d.resRef:d.res)-(brk[d.key]?brk[d.key].amt:0);
  const ahead=bd.filter(d=>d.hasRef&&cmpDev(d)>0), behind=bd.filter(d=>d.hasRef&&cmpDev(d)<=0);
  const rows=accountRows(ms).filter(r=>!r.memo).sort((x,y)=>y.dev-x.dev);
  const up=rows.slice(0,4).filter(r=>r.dev>0), dn=rows.slice(-4).reverse().filter(r=>r.dev<0);
  const py=isFullYTD()?(()=>{let p=0,c=0,pp=null,pc=null;
      analysisFiles().forEach(f=>{const q=aggPY(f);p+=q.income.p||0;c+=q.income.c||0;});
      const src=S.files.find(f=>f.combined)||S.files[0];
      if(src&&src.pax&&src.pax.py){pp=src.pax.py.p;pc=src.pax.py.c;}
      return p?{p,c,pp,pc}:null;})():null;
  const chk=(typeof dataChecks==='function')?dataChecks():[];
  const cHi=chk.filter(x=>x.sev==='high'), cMe=chk.filter(x=>x.sev==='med');
  const F=fmtFull, N=(v,d=0)=>fmtN(v,d);
  const A=v=>v>=0?'<b class="up">':'<b class="dn">';
  const W=(v,g,b)=>v>=0?g:b;
  const led=bd.length&&bd[0].fromLedger;

  const dLine=(d,en)=>{
    const nm=`<b>${dName(d.key)}</b>`;
    const tail=en
      ? `${d.inc>0?`, revenue ${F(d.inc)}, GP ${(d.gp/d.inc*100).toFixed(1)}%`:''}. Purchases ${F(d.buy)}, wages ${F(d.pay)}.`
      : `${d.inc>0?`, omsætning ${F(d.inc)}, DB ${(d.gp/d.inc*100).toFixed(1)}%`:''}. Indkøb ${F(d.buy)}, løn ${F(d.pay)}.`;
    if(!d.hasRef) return `<li>${nm} — ${en?'result':'resultat'} <b class="${d.res>=0?'up':'dn'}">${F(d.res)}</b>${tail}</li>`;
    const dv=d.res-d.resRef, b=brk[d.key], cd=cmpDev(d);
    const note=b
      ? (en?` <span style="color:var(--warn)">Not comparable as it stands: ${b.items.map(i=>esc(i.name)).join(', ')} sits in only one of the two years (${F(b.amt)}). Like for like it is ${cd>=0?'<span class="up">ahead</span>':'<span class="dn">behind</span>'} by <b>${F(Math.abs(cd))}</b>.</span>`
             :` <span style="color:var(--warn)">Ikke sammenligneligt som det står: ${b.items.map(i=>esc(i.name)).join(', ')} findes kun i det ene af de to år (${F(b.amt)}). Sammenligneligt er den ${cd>=0?'<span class="up">foran</span>':'<span class="dn">bagud</span>'} med <b>${F(Math.abs(cd))}</b>.</span>`)
      : '';
    return en
      ? `<li>${nm} — ${dv>=0?'<span class="up">ahead</span>':'<span class="dn">behind</span>'} by <b>${F(Math.abs(dv))}</b>. Result ${F(d.res)} against ${RB} ${F(d.resRef)}${tail}${note}</li>`
      : `<li>${nm} — ${dv>=0?'<span class="up">foran</span>':'<span class="dn">bagud</span>'} med <b>${F(Math.abs(dv))}</b>. Resultat ${F(d.res)} mod ${RB} ${F(d.resRef)}${tail}${note}</li>`;
  };

  const da=`
  <h4>Kort fortalt</h4>
  <p>For <b>${per}</b> lander ${who1().toLowerCase()} på et resultat på <b>${F(a.result.a)} ${cur}</b> mod ${RB} på ${F(a.result.b)} — ${A(dev)}${F(Math.abs(dev))} ${W(dev,'bedre','dårligere')}</b> end ventet. Omsætningen er <b>${F(a.income.a)}</b> mod ${F(a.income.b)} (${pct(a.income.b?(a.income.a-a.income.b)/Math.abs(a.income.b)*100:null)}), og dækningsbidraget ligger på <b>${gp!=null?gp.toFixed(1)+'%':'–'}</b>${gpR!=null?` mod ${gpR.toFixed(1)}% — ${Math.abs(gp-gpR).toFixed(1)} procentpoint ${gp>=gpR?'over':'under'}, hvilket svarer til ${F(Math.abs(gp-gpR)/100*a.income.a)} på bundlinjen`:''}.</p>

  <h4>Passagerer og forbrug pr. hoved</h4>
  <p>Der har været <b>${N(a.pax.a)} passagerer</b> om bord mod ${N(a.pax.b)} i ${RB} — ${A(a.pax.a-a.pax.b)}${N(Math.abs(a.pax.a-a.pax.b))} ${W(a.pax.a-a.pax.b,'flere','færre')}</b> (${pct(a.pax.b?(a.pax.a-a.pax.b)/a.pax.b*100:null)}). Hver passager har lagt <b>${N(rp,0)} kr.</b> om bord mod ${N(rpR,0)} kr. — ${A(rp-rpR)}${N(Math.abs(rp-rpR),0)} kr. ${W(rp-rpR,'mere','mindre')}</b>.</p>
  <p>Afvigelsen på omsætningen, ${F(a.income.a-a.income.b)}, deler sig i to: <b>${F(paxEff)}</b> skyldes ${W(paxEff,'flere','færre')} passagerer, og <b>${F(rateEff)}</b> skyldes at hver passager bruger ${W(rateEff,'mere','mindre')}. ${Math.abs(rateEff)>Math.abs(paxEff)?'Det er altså først og fremmest forbruget pr. hoved der flytter tallet — og det er den knap I selv kan skrue på.':'Det er altså først og fremmest passagertallet der flytter tallet, ikke hvad den enkelte bruger om bord.'}</p>

  <h4>Omkostningssiden</h4>
  <p>Indkøb udgør <b>${F(buy)}</b> mod ${F(buyR)} i ${RB} (${A(buyR-buy)}${F(Math.abs(buyR-buy))} ${W(buyR-buy,'mindre','mere')}</b>), og løn udgør <b>${F(pay)}</b> mod ${F(payR)} (${A(payR-pay)}${F(Math.abs(payR-pay))} ${W(payR-pay,'mindre','mere')}</b>). ${wPct!=null?`Lønnen svarer til <b>${wPct.toFixed(1)}%</b> af omsætningen${wPctR!=null?` mod ${wPctR.toFixed(1)}% i ${RB}`:''}.`:''} ${a.pax.a?`Pr. passager er det ${N(buy/a.pax.a,0)} kr. i indkøb og ${N(pay/a.pax.a,0)} kr. i løn.`:''}</p>

  <h4>Hvem er foran, og hvem er bagud</h4>
  ${bd.length?`<ul>${bd.map(d=>dLine(d,false)).join('')}</ul>
  ${bd[0].hasRef?`<p>${ahead.length} afdeling${ahead.length===1?'':'er'} ligger foran ${RB}, ${behind.length} ligger bagud.</p>`:''}
  ${led?`<p style="font-size:13px;color:var(--muted)">Opdelingen er regnet ud fra posteringerne i totalfilen, hvor hver postering bærer sin afdelingskode. Der er ingen afdelingsbudgetter i den fil, så der er intet at måle op imod, og tallene afviger fra afdelingsrapporterne på to punkter: kabyssens vareforbrug tælles ikke med hos F&amp;B, og fælles lønkonti ligger hos den afdeling de er bogført på. Læg afdelingsfilerne ind for at få budgetterne med.</p>`:''}`:'<p>Ingen afdelingsopdeling tilgængelig.</p>'}

  <h4>Det der trækker mest op</h4>
  <ul>${up.map(r=>`<li>${dName(r.dept)} · <b>${esc(r.name)}</b> ligger <span class="up">${F(r.dev)}</span> over ${RB} — ${F(r.a)} mod ${F(r.b)}.</li>`).join('')||'<li>Ingen konti ligger over.</li>'}</ul>
  <h4>Det der trækker mest ned</h4>
  <ul>${dn.map(r=>`<li>${dName(r.dept)} · <b>${esc(r.name)}</b> ligger <span class="dn">${F(Math.abs(r.dev))}</span> under ${RB} — ${F(r.a)} mod ${F(r.b)}${r.b?'':` (ingen ${RB} på kontoen)`}.</li>`).join('')||'<li>Ingen konti ligger under.</li>'}</ul>

  ${(S.basis==='py'&&brkTot)?`<p style="color:var(--warn)"><b>Pas på med den direkte sammenligning.</b> ${F(Math.abs(brkTot))} af forskellen mod sidste år stammer fra konti der kun findes i det ene af de to år — først og fremmest kabyssens vareforbrug, der ligger inde under Bar/Restaurant i år og ikke sidste år. Tallene ovenfor viser både den rå og den sammenlignelige afvigelse.</p>`:''}
  ${py&&py.p?`<h4>Mod samme periode sidste år</h4>
  <p>Omsætningen er ${A(py.c-py.p)}${F(Math.abs(py.c-py.p))} ${W(py.c-py.p,'højere','lavere')}</b> end sidste år (${pct((py.c-py.p)/Math.abs(py.p)*100)}). ${py.pp?`Passagertallet er ${A(py.pc-py.pp)}${N(Math.abs(py.pc-py.pp))} ${W(py.pc-py.pp,'højere','lavere')}</b> (${pct((py.pc-py.pp)/py.pp*100)}), og omsætningen pr. passager er gået fra ${N(py.p/py.pp,0)} kr. til ${N(py.c/py.pc,0)} kr.`:''}</p>`:''}

  <h4>Er tallene til at stole på</h4>
  ${(cHi.length||cMe.length)?`<p>Datakontrollen har fundet ${cHi.length} forhold der skal ses på og ${cMe.length} der er værd at tjekke, før tallene sendes videre.${cHi.length?` Vigtigst: <b>${esc(cHi[0].title)}</b> — ${esc(cHi[0].body)}`:''}</p>`
  :`<p>Datakontrollen har ikke fundet noget der ser forkert ud i perioden.</p>`}`;

  const en=`
  <h4>In short</h4>
  <p>For <b>${per}</b> ${who1().toLowerCase()} land on a result of <b>${F(a.result.a)} ${cur}</b> against ${RB} of ${F(a.result.b)} — ${A(dev)}${F(Math.abs(dev))} ${W(dev,'better','worse')}</b> than expected. Revenue is <b>${F(a.income.a)}</b> against ${F(a.income.b)} (${pct(a.income.b?(a.income.a-a.income.b)/Math.abs(a.income.b)*100:null)}), and gross profit sits at <b>${gp!=null?gp.toFixed(1)+'%':'–'}</b>${gpR!=null?` against ${gpR.toFixed(1)}% — ${Math.abs(gp-gpR).toFixed(1)} points ${gp>=gpR?'above':'below'}, worth ${F(Math.abs(gp-gpR)/100*a.income.a)} on the bottom line`:''}.</p>

  <h4>Passengers and spend per head</h4>
  <p><b>${N(a.pax.a)} passengers</b> travelled against ${N(a.pax.b)} in ${RB} — ${A(a.pax.a-a.pax.b)}${N(Math.abs(a.pax.a-a.pax.b))} ${W(a.pax.a-a.pax.b,'more','fewer')}</b> (${pct(a.pax.b?(a.pax.a-a.pax.b)/a.pax.b*100:null)}). Each one spent <b>${N(rp,0)}</b> on board against ${N(rpR,0)} — ${A(rp-rpR)}${N(Math.abs(rp-rpR),0)} ${W(rp-rpR,'more','less')}</b>.</p>
  <p>The ${F(a.income.a-a.income.b)} revenue deviation splits in two: <b>${F(paxEff)}</b> comes from ${W(paxEff,'more','fewer')} passengers, and <b>${F(rateEff)}</b> from each one spending ${W(rateEff,'more','less')}. ${Math.abs(rateEff)>Math.abs(paxEff)?'Spend per head is doing most of the work — and that is the lever you control.':'Passenger numbers are doing most of the work, not what each guest spends on board.'}</p>

  <h4>The cost side</h4>
  <p>Purchases come to <b>${F(buy)}</b> against ${F(buyR)} in ${RB} (${A(buyR-buy)}${F(Math.abs(buyR-buy))} ${W(buyR-buy,'less','more')}</b>), and wages to <b>${F(pay)}</b> against ${F(payR)} (${A(payR-pay)}${F(Math.abs(payR-pay))} ${W(payR-pay,'less','more')}</b>). ${wPct!=null?`Wages are <b>${wPct.toFixed(1)}%</b> of revenue${wPctR!=null?` against ${wPctR.toFixed(1)}% in ${RB}`:''}.`:''} ${a.pax.a?`Per passenger that is ${N(buy/a.pax.a,0)} in purchases and ${N(pay/a.pax.a,0)} in wages.`:''}</p>

  <h4>Who is ahead, and who is behind</h4>
  ${bd.length?`<ul>${bd.map(d=>dLine(d,true)).join('')}</ul>
  ${bd[0].hasRef?`<p>${ahead.length} department${ahead.length===1?'':'s'} sit ahead of ${RB}, ${behind.length} behind.</p>`:''}
  ${led?`<p style="font-size:13px;color:var(--muted)">The split is worked out from the entries in the all-ship file, where every entry carries its department code. That file holds no department budgets, so there is nothing to measure against, and the figures differ from the department reports on two points: the galley cost of goods is not counted under F&amp;B, and shared wage accounts sit with the department they are booked to. Load the department files to bring the budgets in.</p>`:''}`:'<p>No department split available.</p>'}

  <h4>Pulling up hardest</h4>
  <ul>${up.map(r=>`<li>${dName(r.dept)} · <b>${esc(r.name)}</b> is <span class="up">${F(r.dev)}</span> above ${RB} — ${F(r.a)} against ${F(r.b)}.</li>`).join('')||'<li>No accounts are above.</li>'}</ul>
  <h4>Pulling down hardest</h4>
  <ul>${dn.map(r=>`<li>${dName(r.dept)} · <b>${esc(r.name)}</b> is <span class="dn">${F(Math.abs(r.dev))}</span> below ${RB} — ${F(r.a)} against ${F(r.b)}${r.b?'':` (no ${RB} on the account)`}.</li>`).join('')||'<li>No accounts are below.</li>'}</ul>

  ${(S.basis==='py'&&brkTot)?`<p style="color:var(--warn)"><b>Treat the direct comparison with care.</b> ${F(Math.abs(brkTot))} of the difference against last year comes from accounts that exist in only one of the two years — above all the galley cost of goods, which sits inside Bar/Restaurant this year and not last. The lines above give both the raw and the like-for-like deviation.</p>`:''}
  ${py&&py.p?`<h4>Against the same period last year</h4>
  <p>Revenue is ${A(py.c-py.p)}${F(Math.abs(py.c-py.p))} ${W(py.c-py.p,'higher','lower')}</b> than last year (${pct((py.c-py.p)/Math.abs(py.p)*100)}). ${py.pp?`Passenger numbers are ${A(py.pc-py.pp)}${N(Math.abs(py.pc-py.pp))} ${W(py.pc-py.pp,'higher','lower')}</b> (${pct((py.pc-py.pp)/py.pp*100)}), and revenue per passenger has gone from ${N(py.p/py.pp,0)} to ${N(py.c/py.pc,0)}.`:''}</p>`:''}

  <h4>Can the figures be trusted</h4>
  ${(cHi.length||cMe.length)?`<p>The data check found ${cHi.length} item${cHi.length===1?'':'s'} needing a look and ${cMe.length} worth checking before the figures go any further.${cHi.length?` Most important: <b>${esc(cHi[0].title)}</b> — ${esc(cHi[0].body)}`:''}</p>`
  :`<p>The data check found nothing that looks wrong in the period.</p>`}`;
  return LANG==='da'?da:en;
}
function vRep(){
  const L=LANG, sh=shipTotal(periodMonths());
  return `<div class="card">
    <div style="display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px">
      <div><h3 style="margin:0">${L==='da'?'Ledelsesresumé':'Management summary'}</h3>
        <div class="sub" style="margin:0">${esc(periodLabel())} · MS Norröna · ${S.files[0]?esc(S.files[0].budgetName):''}</div></div>
      <div style="flex:1"></div>
      <button class="chip noprint" onclick="copyNarr()">${t('copy')}</button>
      <button class="chip noprint" onclick="window.print()">${t('print')}</button>
      <button class="chip noprint on" onclick="exportPPT()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>${t('exportP')}</button>
      <button class="chip noprint" onclick="exportXLSX()">${t('exportX')}</button>

}
function copyNarr(){
  const el=document.getElementById('narr'); if(!el)return;
  const txt=el.innerText.replace(/\n{3,}/g,'\n\n');
  navigator.clipboard.writeText(txt).then(()=>toast(t('copied')));
}

/* ---------- exports ---------- */
function exportCSV(rows,name){
  if(!rows||!rows.length){toast(t('noData'));return;}
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(';')].concat(rows.map(r=>keys.map(k=>{
    const v=r[k]; return typeof v==='number'?String(v).replace('.',','):`"${String(v==null?'':v).replace(/"/g,'""')}"`;}).join(';'))).join('\n');
  dl(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),name+'.csv');
}
function exportXLSX(){
  if(typeof XLSX==='undefined'){toast('XLSX');return;}
  const ms=periodMonths(), wb=XLSX.utils.book_new();
  const sh=shipTotal(ms);
  if(sh){
    const a=sh.a;
    const sum1=[[t('shipTotal'),periodLabel()],[],[ '',t('budget'),t('actual'),t('dev')]];
    [['income','income'],['galley','galley'],['purchase','purchase'],['gp','gp'],['consumer','consumer'],
     ['wages','wages'],['otherpers','otherpers'],['result','result'],['pax','pax']].forEach(([k,l])=>
      sum1.push([t(l),a[k].b,a[k].a,a[k].a-a[k].b]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum1),'Total');
  }
  activeFiles().forEach(f=>{
    const aoa=[[dName(f.key),periodLabel()],[],[t('acct'),t('name'),t('budget'),t('actual'),t('dev')]];
    f.sections.forEach(s=>{ aoa.push([s.name]);
      s.lines.forEach(l=>{const b=pick(l,ms,0)||0,x=pick(l,ms,1)||0; if(b||x)aoa.push([l.acct,l.name,b,x,x-b]);});
      if(s.total)aoa.push(['',s.total.label,pick(s.total,ms,0)||0,pick(s.total,ms,1)||0,(pick(s.total,ms,1)||0)-(pick(s.total,ms,0)||0)]);
      aoa.push([]); });
    const A=aggFile(f,ms); aoa.push(['',t('result'),A.result.b,A.result.a,A.result.a-A.result.b]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),f.key.slice(0,28));
  });
  const al=buildAlerts();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(
    [[t('nav_alert'),periodLabel()],[],['','',t('dept'),t('acct'),t('amount')]].concat(
      al.map(x=>[t('sev_'+({high:'high',med:'med',low:'low'}[x.sev])),x.title,x.dept?dName(x.dept):'',x.acct||'',x.amt]))),
    t('nav_alert').slice(0,28));
  XLSX.writeFile(wb,`Norrona_JetReport_${S.files[0]?S.files[0].year:''}_${periodMonths().length===1?t('mshort')[periodMonths()[0]]:'YTD'}.xlsx`);
}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function saveSession(){
  unbridge();
  dl(new Blob([JSON.stringify({v:1,files:S.files,shadow:S.shadow})],{type:'application/json'}),
     `norrona-jetreport-${new Date().toISOString().slice(0,10)}.json`);

}
function loadSession(txt){
  try{const o=JSON.parse(txt); if(!o.files)throw 0;
    S.files=o.files; S.shadow=o.shadow||[]; S.sel=new Set();
    S.files.forEach(f=>f._bridged=null); applyBridge();
    S.period={mode:'ytd',m:maxMonth()}; render(); toast(S.files.length+' '+t('loaded'));
  }catch(e){toast(t('nofile'));}
}

/* ---------- file intake ---------- */
async function handleFiles(list){
  for(let i=0;i<60&&typeof XLSX==='undefined';i++) await new Promise(r=>setTimeout(r,150));
  if(typeof XLSX==='undefined'){toast(LANG==='da'?'Kunne ikke indlæse Excel-læseren. Tjek netværket, eller læg xlsx.full.min.js ved siden af filen.':'Could not load the Excel reader. Check the network, or place xlsx.full.min.js next to this file.');return;}
  let n=0;
  for(const file of list){
    if(/\.json$/i.test(file.name)){ loadSession(await file.text()); continue; }
    try{
      const buf=await file.arrayBuffer();
      const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellDates:true});
      const p=parseWB(wb,file.name);
      const ex=S.files.findIndex(f=>f.key===p.key&&f.year===p.year);
      if(ex>=0){
        const old=S.files[ex];
        const newer=(p.rMonth>old.rMonth)||(p.rMonth===old.rMonth&&String(p.reportDate||'')>=String(old.reportDate||''));
        if(newer){ S.shadow.push(old); S.files[ex]=p; toast(dName(p.key)+' — '+t('replaced')); }
        else { S.shadow.push(p); toast(dName(p.key)+' — '+t('older')); }
      } else S.files.push(p);
      n++;
    }catch(e){ console.error(e); toast(file.name+': '+(e.message==='notJet'?t('notJet'):t('nofile'))); }
  }
  if(n){
    const order=['ALL','TFS','FNB','GAL','ACC','REC'];
    S.files.sort((a,b)=>order.indexOf(a.key)-order.indexOf(b.key));
    applyBridge();
    S.period={mode:'ytd',m:maxMonth()};
    toast(n+' '+t('loaded'));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════════
   DATA CHECK — hunts for things that look wrong in the reports
   themselves: missing sales, missing costs, sign errors, ledger
   mismatches, duplicates and figures that moved between extracts.
   Separate from Attention, which is about performance, not correctness.
   ══════════════════════════════════════════════════════════════════ */
const CHKCAT={
 missing :{da:'Noget mangler',            en:'Something missing'},
 sign    :{da:'Fortegn og rimelighed',    en:'Sign and plausibility'},
 ledger  :{da:'Kladde mod rapport',       en:'Ledger against report'},
 dup     :{da:'Dubletter og skæve bilag', en:'Duplicates and odd documents'},
 across  :{da:'På tværs af filer',        en:'Across the files'},
 budget  :{da:'Budgettets kvalitet',      en:'Quality of the budget'},
 restate :{da:'Ændret siden sidste udtræk',en:'Changed since the last extract'},
};
/* Account numbers alone cannot tell revenue from cost: 120200 is a sale and
   125200 is a purchase, both in the 12-series. The section a line sits in is
   the report's own answer, so use that. */
const secIsRev=sec=>sec.kpiKey==='income';
const secIsCogs=sec=>sec.kpiKey==='purchase'||sec.kpiKey==='galley';
/* A line that is negative every single month is a deduction by design —
   onboard vouchers, waste, discounts. Only a line that changes sign, or that
   sits opposite to last year, is worth flagging. */
function mixedSign(l,ms){
  const v=ms.map(m=>l.m[m]?(l.m[m][1]||0):0).filter(x=>x!==0);
  return v.some(x=>x>0)&&v.some(x=>x<0);
}
function flipsPY(l,val){
  const p=l.py?l.py.p:null;
  return p!=null&&p!==0&&Math.sign(p)!==Math.sign(val);
}

function dataChecks(){
  const ms=periodMonths(), lm=maxMonth(), L=LANG, out=[];
  const files=activeFiles(), all=S.files.find(f=>f.combined);
  const add=(sev,cat,title,body,amt,dept,acct,fix)=>out.push({sev,cat,title,body,amt:amt||0,dept,acct,fix});
  const money=v=>fmtFull(Math.abs(v));

  /* ── A. something that used to be there and now is not ───────── */
  const paxOf=m=>{const src=all||S.files[0]; const v=src&&src.pax&&src.pax.m[m]; return v?(v[1]||0):0;};
  const paxAvg=ms.length?sum(ms.map(paxOf))/ms.length:0;
  files.forEach(f=>f.sections.forEach(sec=>{ if(sec.memo)return; sec.lines.forEach(l=>{
    const act=ms.map(m=>{const v=l.m[m]; return v?(v[1]||0):0;});
    const live=act.map((v,i)=>({v,m:ms[i]})).filter(x=>x.v!==0);
    if(live.length<3)return;
    const lastLive=live[live.length-1].m;
    const gap=ms.filter(m=>m>lastLive);
    const avg=sum(live.map(x=>Math.abs(x.v)))/live.length;
    if(gap.length&&avg>15000){
      add(gap.length>1?'high':'med','missing',
        L==='da'?`${secIsRev(sec)?'Salget':'Posteringerne'} stopper: ${l.name}`
                :`${secIsRev(sec)?'Sales':'Postings'} stop: ${l.name}`,
        L==='da'?`${dName(f.key)} · konto ${l.acct} er bogført til og med ${t('months')[lastLive].toLowerCase()} (snit ${money(avg)} pr. måned) og står derefter på nul i ${gap.map(m=>t('months')[m].toLowerCase()).join(', ')}.`
                :`${dName(f.key)} · account ${l.acct} is posted up to ${t('months')[lastLive]} (averaging ${money(avg)} a month) and then sits at zero in ${gap.map(m=>t('months')[m]).join(', ')}.`,
        -avg*gap.length,f.key,l.acct,
        L==='da'?'Tjek om der mangler en postering, eller om varegruppen er lukket ned.':'Check whether a posting is missing, or the line was discontinued.');
    }
    // a hole in the middle of an otherwise steady account
    const first=live[0].m, holes=ms.filter(m=>m>first&&m<lastLive&&(l.m[m]?(l.m[m][1]||0):0)===0);
    const quiet=holes.filter(m=>paxAvg&&paxOf(m)<paxAvg*0.2);
    if(holes.length&&avg>15000)
      add(quiet.length===holes.length?'low':'med','missing',
        L==='da'?`Hul i rækken: ${l.name}`:`Gap in the run: ${l.name}`,
        L==='da'?`${dName(f.key)} · konto ${l.acct} er bogført både før og efter, men ${holes.map(m=>t('months')[m].toLowerCase()).join(', ')} står på nul. Snit ellers ${money(avg)}.${quiet.length?` Der var kun ${holes.map(m=>fmtN(paxOf(m),0)).join('/')} passagerer om bord, så det er formentlig lavsæson snarere end en fejl.`:''}`
                :`${dName(f.key)} · account ${l.acct} is posted both before and after, but ${holes.map(m=>t('months')[m]).join(', ')} sits at zero. Otherwise averaging ${money(avg)}.${quiet.length?` Only ${holes.map(m=>fmtN(paxOf(m),0)).join('/')} passengers were on board, so this is most likely low season rather than an error.`:''}`,
        -avg*holes.length,f.key,l.acct,
        L==='da'?'En manglende faktura eller en postering lagt i en anden måned.':'A missing invoice, or a posting landed in another month.');
  });}));

  /* ── B. sign and plausibility ────────────────────────────────── */
  files.forEach(f=>{
    const a=aggFile(f,ms);
    f.sections.forEach(sec=>{ if(sec.memo)return; sec.lines.forEach(l=>{
      const v=pick(l,ms,1)||0;
      if(!v)return;
      const odd=mixedSign(l,ms)||flipsPY(l,v);
      if(secIsRev(sec)&&v<0&&Math.abs(v)>5000&&odd)
        add('high','sign',
          L==='da'?`Negativ omsætning: ${l.name}`:`Negative revenue: ${l.name}`,
          L==='da'?`${dName(f.key)} · salgskontoen står samlet på ${fmtFull(v)}, men har både plus- og minusmåneder. Det peger på en kreditnota eller en postering med forkert fortegn.`
                  :`${dName(f.key)} · the sales account totals ${fmtFull(v)} but has both positive and negative months. That points to a credit note or an entry with the sign the wrong way round.`,
          v,f.key,l.acct,L==='da'?'Slå posteringerne op på Posteringer-fanen.':'Look the entries up on the Entries tab.');
      if(!secIsRev(sec)&&v>0&&Math.abs(v)>5000&&odd)
        add('med','sign',
          L==='da'?`Omkostning med plus: ${l.name}`:`Cost showing a credit: ${l.name}`,
          L==='da'?`${dName(f.key)} · omkostningskontoen står samlet på +${fmtFull(v)} og skifter fortegn hen over året. En godskrivning er normal — men det kan også være en udgift bogført det forkerte sted.`
                  :`${dName(f.key)} · the cost account totals +${fmtFull(v)} and changes sign across the year. A credit is normal — but it can also be a cost booked in the wrong place.`,
          v,f.key,l.acct,L==='da'?'Kontrollér om godskrivningen hører til her.':'Check whether the credit belongs here.');
    });});
    if(a.income.a>0){
      const gp=a.gp.a/a.income.a*100;
      if(gp>100||gp<0)
        add('high','sign',
          L==='da'?`Umuligt dækningsbidrag · ${dName(f.key)}`:`Impossible gross profit · ${dName(f.key)}`,
          L==='da'?`DB beregnes til ${gp.toFixed(1)}%. Enten mangler vareforbruget, eller også er det bogført i en anden afdeling.`
                  :`GP works out at ${gp.toFixed(1)}%. Either the cost of goods is missing, or it is booked in another department.`,
          0,f.key,null,L==='da'?'Se Afstemning-fanen for hvor vareforbruget ligger.':'See the Reconcile tab for where the cost of goods sits.');
    }
    // revenue with no cost of goods at all, or the other way round
    const rev=sum(f.sections.filter(s=>!s.memo&&secIsRev(s)).map(s=>sum(s.lines.map(l=>pick(l,ms,1)||0))));
    const cogs=sum(f.sections.filter(s=>!s.memo&&secIsCogs(s)).map(s=>sum(s.lines.map(l=>pick(l,ms,1)||0))));
    if(rev>500000&&cogs===0)
      add('high','sign',
        L==='da'?`Salg uden vareforbrug · ${dName(f.key)}`:`Sales with no cost of goods · ${dName(f.key)}`,
        L==='da'?`Der er bogført ${money(rev)} i omsætning, men ingen vareudgift overhovedet. Dækningsbidraget bliver derfor for højt.`
                :`${money(rev)} of revenue is booked with no cost of goods at all. Gross profit therefore reads too high.`,
        0,f.key,null,L==='da'?'Vareforbruget ligger sandsynligvis på en anden afdeling.':'The cost of goods most likely sits in another department.');
  });

  /* ── C. does the ledger detail agree with the reported figures? ── */
  S.files.forEach(f=>{
    if(S.sel.size&&!f.combined&&!S.sel.has(f.key))return;
    if(!f.tx.length)return;
    const byAM={}; f.tx.forEach(x=>{ byAM[x.acct+'|'+x.m]=(byAM[x.acct+'|'+x.m]||0)+x.amt; });
    let bad=[];
    f.sections.forEach(s=>{ if(s.memo)return; s.lines.forEach(l=>{
      ms.forEach(m=>{
        const gl=byAM[l.acct+'|'+m]; if(gl===undefined)return;
        const rep=l.m[m]?(l.m[m][1]||0):0;
        if(Math.abs(rep-gl)>2) bad.push({acct:l.acct,name:l.name,m,rep,gl});
      });});});
    bad.slice(0,6).forEach(b=>add('high','ledger',
      L==='da'?`Kladde og rapport er ikke enige: ${b.name}`:`Ledger and report disagree: ${b.name}`,
      L==='da'?`${dName(f.key)} · konto ${b.acct}, ${t('months')[b.m].toLowerCase()}: rapporten viser ${fmtFull(b.rep)}, men de enkelte posteringer summer til ${fmtFull(b.gl)}.`
              :`${dName(f.key)} · account ${b.acct}, ${t('months')[b.m]}: the report shows ${fmtFull(b.rep)} while the individual entries add up to ${fmtFull(b.gl)}.`,
      b.gl-b.rep,f.key,b.acct,L==='da'?'Udtrækket kan være taget midt i en bogføring.':'The extract may have been taken mid-posting.'));
    if(!bad.length)
      add('ok','ledger',
        L==='da'?`Kladden stemmer · ${dName(f.key)}`:`Ledger agrees · ${dName(f.key)}`,
        L==='da'?`Alle posteringer summer præcist til de tal rapporten viser.`
                :`Every entry adds up exactly to the figures the report shows.`,
        0,f.key);
  });

  /* ── D. duplicates, reversals and suspiciously round entries ───
     The same amount twice is only a double payment if nothing cancels it out.
     Suppliers credit and re-invoice constantly, and that shows up as the same
     figure with a minus in front — so check for the offsetting entry first. */
  {
    const src=all&&!S.sel.size?[all]:files;
    const pool=[];
    src.forEach(f=>f.tx.forEach(x=>{
      if(S.sel.size&&!S.sel.has(x.dep))return;
      if(!ms.includes(x.m))return;
      pool.push(x);
    }));
    const byAbs={};   // account + |amount|  ->  every entry with that size
    pool.forEach(x=>{
      const k=x.acct+'|'+Math.abs(Math.round(x.amt));
      (byAbs[k]=byAbs[k]||[]).push(x);
    });
    const seen={}, dups=[], credits=[], round=[];
    pool.forEach(x=>{
      const amt=Math.round(x.amt);
      if(Math.abs(amt)>=3000){
        const k=x.acct+'|'+amt+'|'+x.desc.toLowerCase().slice(0,26);
        if(seen[k]&&seen[k].doc!==x.doc){
          const group=byAbs[x.acct+'|'+Math.abs(amt)]||[];
          const opposite=group.filter(y=>Math.sign(Math.round(y.amt))!==Math.sign(amt)).length;
          const same=group.filter(y=>Math.sign(Math.round(y.amt))===Math.sign(amt)).length;
          /* One credit for every extra copy means the books already balance. */
          if(opposite>=same-1&&opposite>0) credits.push([seen[k],x,opposite]);
          else dups.push([seen[k],x,opposite]);
        } else seen[k]=x;
      }
      if(Math.abs(amt)>=50000&&amt%10000===0) round.push(x);
    });
    dups.slice(0,8).forEach(([a,b])=>add('med','dup',
      L==='da'?`Samme beløb bogført to gange: ${a.an||a.acct}`:`Same amount booked twice: ${a.an||a.acct}`,
      L==='da'?`${fmtFull(a.amt)} står både ${a.d} (bilag ${a.doc}) og ${b.d} (bilag ${b.doc}) med samme tekst — "${a.desc.slice(0,44)}". Der er ingen kreditnota på beløbet, så det står stadig dobbelt.`
              :`${fmtFull(a.amt)} appears both on ${a.d} (doc ${a.doc}) and ${b.d} (doc ${b.doc}) with the same text — "${a.desc.slice(0,44)}". No credit note matches it, so it still stands twice.`,
      -Math.abs(a.amt),a.dep,a.acct,
      L==='da'?'Kontrollér om fakturaen er betalt to gange.':'Check whether the invoice was paid twice.'));
    credits.slice(0,6).forEach(([a,b,n])=>add('low','dup',
      L==='da'?`Faktura og kreditnota: ${a.an||a.acct}`:`Invoice and credit note: ${a.an||a.acct}`,
      L==='da'?`${fmtFull(Math.abs(a.amt))} går igen ${a.d} (${a.doc}) og ${b.d} (${b.doc}), men der ligger ${n} modpostering${n===1?'':'er'} på samme beløb. Det er en kreditering og en ny faktura, ikke en dobbeltbetaling.`
              :`${fmtFull(Math.abs(a.amt))} repeats on ${a.d} (${a.doc}) and ${b.d} (${b.doc}), but ${n} offsetting entr${n===1?'y':'ies'} of the same size sit alongside. This is a credit and a re-invoice, not a double payment.`,
      0,a.dep,a.acct));
    /* Standalone reversals worth knowing about when reading the month. */
    const pairs={};
    pool.forEach(x=>{ const amt=Math.round(x.amt);
      if(Math.abs(amt)<3000)return;
      const k=x.acct+'|'+Math.abs(amt);
      if(pairs[k]&&Math.sign(Math.round(pairs[k].amt))!==Math.sign(amt)&&!pairs[k].pair) pairs[k].pair=x;
      else if(!pairs[k]) pairs[k]=x; });
    Object.values(pairs).filter(x=>x.pair).slice(0,5).forEach(x=>add('low','dup',
      L==='da'?`Postering og modpostering: ${x.an||x.acct}`:`Posting and reversal: ${x.an||x.acct}`,
      L==='da'?`${fmtFull(Math.abs(x.amt))} bogført ${x.d} og modposteret ${x.pair.d}. Normalt en rettelse — værd at vide når man læser måneden.`
              :`${fmtFull(Math.abs(x.amt))} posted ${x.d} and reversed ${x.pair.d}. Usually a correction — worth knowing when reading the month.`,
      0,x.dep,x.acct));
    round.slice(0,5).forEach(x=>add('low','dup',
      L==='da'?`Rundt beløb: ${x.an||x.acct}`:`Round amount: ${x.an||x.acct}`,
      L==='da'?`${fmtFull(Math.abs(x.amt))} præcist, bogført ${x.d} (${x.doc}) — "${x.desc.slice(0,44)}". Runde tal er tit skøn eller manuelle posteringer.`
              :`Exactly ${fmtFull(Math.abs(x.amt))}, posted ${x.d} (${x.doc}) — "${x.desc.slice(0,44)}". Round figures are often estimates or manual entries.`,
      0,x.dep,x.acct,L==='da'?'Tjek om der skal komme en rigtig faktura.':'Check whether a real invoice is still to come.'));
  }

  /* ── E. consistency across the files ─────────────────────────── */
  if(all&&deptFiles().length){
    const A={},B={};
    const grab=(f,tg)=>f.sections.forEach(s=>{ if(s.memo)return; s.lines.forEach(l=>{
      tg[l.acct]=tg[l.acct]||{name:l.name,v:0,dep:[]};
      tg[l.acct].v+=pick(l,ms,1)||0; if(!tg[l.acct].dep.includes(f.key))tg[l.acct].dep.push(f.key);});});
    grab(all,A); deptFiles().forEach(f=>grab(f,B));
    Object.keys(A).forEach(k=>{ if(!B[k]&&Math.abs(A[k].v)>50000)
      add('med','across',
        L==='da'?`Ikke lagt ud på en afdeling: ${A[k].name}`:`Not pushed out to a department: ${A[k].name}`,
        L==='da'?`Konto ${k} står med ${fmtFull(A[k].v)} i totalfilen, men findes ikke i nogen afdelingsrapport. Ingen har den på sit budget.`
                :`Account ${k} carries ${fmtFull(A[k].v)} in the all-ship file but appears in no department report. Nobody has it on their budget.`,
        A[k].v,null,k,L==='da'?'Overvej om den skal fordeles ud på afdelingerne.':'Consider whether it should be allocated to the departments.'); });
    Object.keys(B).forEach(k=>{ if(!A[k]&&Math.abs(B[k].v)>50000)
      add('low','across',
        L==='da'?`Ikke med i totalen: ${B[k].name}`:`Not in the all-ship total: ${B[k].name}`,
        L==='da'?`Konto ${k} står med ${fmtFull(B[k].v)} hos ${B[k].dep.map(dName).join(', ')}, men er ikke med i totalfilens kontoskema.`
                :`Account ${k} carries ${fmtFull(B[k].v)} in ${B[k].dep.map(dName).join(', ')} but is not part of the all-ship account schedule.`,
        B[k].v,B[k].dep[0],k); });
    const paxSet=[...new Set(S.files.map(f=>pick(f.pax,ms,1)))];
    if(paxSet.length>1)
      add('high','across',
        L==='da'?'Filerne er ikke enige om passagertallet':'The files disagree on the passenger count',
        L==='da'?`Der står ${paxSet.map(p=>fmtN(p,0)).join(' og ')} i de forskellige rapporter. Alt der regnes pr. passager bliver usikkert.`
                :`The reports show ${paxSet.map(p=>fmtN(p,0)).join(' and ')}. Anything worked out per passenger becomes unreliable.`,
        0);
  }

  /* ── F. quality of the budget itself ─────────────────────────── */
  if(S.basis==='budget') files.forEach(f=>f.sections.forEach(sec=>{ if(sec.memo)return; sec.lines.forEach(l=>{
    const b=pick(l,ms,0)||0, a=pick(l,ms,1)||0;
    if(b===0&&Math.abs(a)>100000)
      add('med','budget',
        L==='da'?`Bogført uden budget: ${l.name}`:`Booked with no budget: ${l.name}`,
        L==='da'?`${dName(f.key)} · konto ${l.acct} har ${fmtFull(a)} bogført og intet budget. Afvigelsen bliver derfor hele beløbet.`
                :`${dName(f.key)} · account ${l.acct} carries ${fmtFull(a)} with no budget at all. The deviation therefore reads as the whole amount.`,
        a,f.key,l.acct,L==='da'?'Enten mangler budgettet, eller også ligger det på en anden konto.':'Either the budget is missing, or it sits on another account.');
    if(a===0&&Math.abs(b)>100000)
      add('low','budget',
        L==='da'?`Budget uden bogføring: ${l.name}`:`Budget with nothing booked: ${l.name}`,
        L==='da'?`${dName(f.key)} · konto ${l.acct} er budgetteret med ${fmtFull(b)}, men der er intet bogført i perioden.`
                :`${dName(f.key)} · account ${l.acct} is budgeted at ${fmtFull(b)} with nothing booked in the period.`,
        -b,f.key,l.acct);
    if(b!==0&&a!==0&&Math.abs(a-b)<0.5&&Math.abs(b)>50000)
      add('low','budget',
        L==='da'?`Faktisk er præcis lig budget: ${l.name}`:`Actual exactly equals budget: ${l.name}`,
        L==='da'?`${dName(f.key)} · konto ${l.acct} står på ${fmtFull(a)} i både budget og faktisk. Det sker sjældent af sig selv.`
                :`${dName(f.key)} · account ${l.acct} shows ${fmtFull(a)} as both budget and actual. That rarely happens on its own.`,
        0,f.key,l.acct);
  });}));

  /* ── F2. the two years are not always comparable ─────────────── */
  if(S.basis==='py') files.forEach(f=>{
    const br=pyBreak(f);
    if(!br.items.length)return;
    const raw=aggFile(f,ms), dv=raw.result.a-raw.result.b;
    add(Math.abs(br.amt)>1e6?'high':'med','across',
      L==='da'?`Ikke sammenlignelig med sidste år · ${dName(f.key)}`:`Not comparable with last year · ${dName(f.key)}`,
      L==='da'?`${br.items.map(i=>i.name).join(', ')} findes kun i det ene af de to år (${fmtFull(br.amt)}). Rå afvigelse ${sgn(dv)}${fmtFull(dv)} — sammenligneligt ${sgn(dv-br.amt)}${fmtFull(dv-br.amt)}.`
              :`${br.items.map(i=>i.name).join(', ')} exists in only one of the two years (${fmtFull(br.amt)}). Raw deviation ${sgn(dv)}${fmtFull(dv)} — like for like ${sgn(dv-br.amt)}${fmtFull(dv-br.amt)}.`,
      -br.amt,f.key,br.items[0].acct,
      L==='da'?'Brug det sammenlignelige tal når du vurderer udviklingen.':'Use the like-for-like figure when judging the trend.');
  });

  /* ── G. figures that moved since an earlier extract ──────────── */
  S.shadow.forEach(old=>{
    const now=S.files.find(f=>f.key===old.key&&f.year===old.year); if(!now)return;
    const ms2=Array.from({length:Math.min(old.lastM,now.lastM)+1},(_,i)=>i);
    const O={},N={};
    old.sections.forEach(s=>s.lines.forEach(l=>O[l.acct]=(O[l.acct]||0)+(pick(l,ms2,1)||0)));
    now.sections.forEach(s=>s.lines.forEach(l=>{N[l.acct]=(N[l.acct]||0)+(pick(l,ms2,1)||0);}));
    const moved=[...new Set([...Object.keys(O),...Object.keys(N)])]
      .map(k=>({k,d:(N[k]||0)-(O[k]||0)})).filter(x=>Math.abs(x.d)>0.5)
      .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    moved.slice(0,6).forEach(x=>{
      const nm=(now.sections.flatMap(s=>s.lines).find(l=>l.acct===x.k)||{}).name||x.k;
      add('med','restate',
        L==='da'?`Efterposteret: ${nm}`:`Posted after the fact: ${nm}`,
        L==='da'?`${dName(now.key)} · konto ${x.k} er ændret med ${sgn(x.d)}${fmtFull(x.d)} mellem udtrækket fra ${(old.reportDate||'').slice(0,10)} og det fra ${(now.reportDate||'').slice(0,10)}. Tal der allerede er rapporteret videre passer ikke længere.`
                :`${dName(now.key)} · account ${x.k} moved by ${sgn(x.d)}${fmtFull(x.d)} between the extract of ${(old.reportDate||'').slice(0,10)} and the one of ${(now.reportDate||'').slice(0,10)}. Figures already reported onward no longer match.`,
        x.d,now.key,x.k);
    });
  });

  const ord={high:0,med:1,low:2,ok:3};
  out.sort((a,b)=>ord[a.sev]-ord[b.sev]||Math.abs(b.amt)-Math.abs(a.amt));
  return out;
}

function chkHTML(x){
  const c=x.sev==='high'?'var(--bad)':x.sev==='med'?'var(--warn)':x.sev==='ok'?'var(--good)':'var(--info)';
  return `<div class="alert">
   <div class="sev" style="background:${c}"></div>
   <div style="flex:1;min-width:0">
     <div style="margin-bottom:6px">
       <span class="tag">${esc(CHKCAT[x.cat]?CHKCAT[x.cat][LANG]||CHKCAT[x.cat].en:x.cat)}</span>
       ${x.dept?`<span class="tag" style="color:${dCol(x.dept)};border-color:${dCol(x.dept)}55">${esc(dName(x.dept))}</span>`:''}
       ${x.acct?`<span class="tag">${esc(x.acct)}</span>`:''}
     </div>
     <h4>${esc(x.title)}</h4>
     <p>${esc(x.body)}</p>
     ${x.fix?`<p style="margin-top:5px;color:var(--ink2)">→ ${esc(x.fix)}</p>`:''}
   </div>
   ${x.amt?`<div class="amt ${x.amt>=0?'up':'dn'}">${sgn(x.amt)}${fmt(x.amt)}</div>`:''}
  </div>`;
}

function vCheck(){
  const C=dataChecks(), L=LANG;
  const hi=C.filter(x=>x.sev==='high').length, me=C.filter(x=>x.sev==='med').length,
        lo=C.filter(x=>x.sev==='low').length, ok=C.filter(x=>x.sev==='ok').length;
  const score=hi?'bad':me?'warn':'good';
  const cats=Object.keys(CHKCAT);
  return `
  <div class="grid g4" style="margin-bottom:14px">
    ${[[L==='da'?'Skal ses på':'Needs a look',hi,'var(--bad)'],
       [L==='da'?'Værd at tjekke':'Worth checking',me,'var(--warn)'],
       [L==='da'?'Til orientering':'For information',lo,'var(--info)'],
       [L==='da'?'Kontroller der er i orden':'Checks that came out clean',ok,'var(--good)']]
      .map(([l,n,c])=>`<div class="card kpi">
        <div class="lbl"><span class="eyebrow">${esc(l)}</span></div>
        <div class="v num" style="color:${c}">${n}</div></div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:14px">
    <h3>${L==='da'?'Hvad der er kigget efter':'What has been looked for'}</h3>
    <div class="sub">${L==='da'
      ?'Hver konto, hver måned og hver enkelt postering er gennemgået for det der plejer at gå galt: salg der pludselig stopper, huller midt i en ellers fast række, fortegn der vender forkert, kladde der ikke stemmer med rapporten, samme faktura to gange, konti der ikke er lagt ud på nogen afdeling, og tal der har flyttet sig siden et tidligere udtræk.'
      :'Every account, every month and every single entry has been checked for what usually goes wrong: sales that suddenly stop, gaps in an otherwise steady run, signs the wrong way round, ledger detail that disagrees with the report, the same invoice twice, accounts allocated to no department, and figures that have moved since an earlier extract.'}
      · ${esc(periodLabel())}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${cats.map(k=>{const n=C.filter(x=>x.cat===k&&x.sev!=='ok').length;
        return `<span class="tag" style="${n?'color:var(--ink);border-color:var(--hair2)':''}">${esc(CHKCAT[k][LANG]||CHKCAT[k].en)} · ${n}</span>`;}).join('')}
    </div>
  </div>
  ${cats.map(k=>{
    const g=C.filter(x=>x.cat===k);
    if(!g.length)return '';
    return `<div class="card" style="margin-bottom:13px">
      <h3>${esc(CHKCAT[k][LANG]||CHKCAT[k].en)}</h3>
      <div class="sub">${g.length} ${L==='da'?'fund':'findings'}</div>
      ${g.map(chkHTML).join('')}
    </div>`;}).join('')}
  ${C.length?'':`<div class="card"><div class="empty">${L==='da'?'Der er ikke fundet noget der ser forkert ud.':'Nothing was found that looks wrong.'}</div></div>`}`;
}

/* ══════════════════════════════════════════════════════════════════
   PowerPoint export, built on the Smyril Line house deck: 26.67 × 15in
   canvas, navy parallelogram wedges in opposite corners, the round gold
   badge bottom right, Helvetica. Every figure comes from the same
   accessors the screen uses, so the deck and the app cannot drift.
   ══════════════════════════════════════════════════════════════════ */
const SL={ navy:'154068', navy2:'233E5F', gold:'E0A020', blue:'0076BA',
